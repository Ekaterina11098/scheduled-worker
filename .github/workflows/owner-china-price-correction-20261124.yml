name: Owner China exact price scope correction 24Nov2026
on:
  push:
    paths: ['.github/workflows/owner-china-price-correction-20261124.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: china-confirmed-wb-price-writes
  cancel-in-progress: false
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: /scripts/
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install requests==2.32.5
      - name: Apply exact correction and verify WB prices
        run: python scripts/owner_price_scope_correction_20261124.py
        env:
          WB_TOKEN_3: ${{ secrets.WB_TOKEN_3 }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          CHINA_TELEGRAM_BOT_TOKEN: disabled
