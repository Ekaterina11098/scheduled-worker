name: Scoped private media maintenance
on:
  push:
    branches: [private-catalog-check-20261120]
    paths: [.github/workflows/private-media-maintenance-20261120.yml]
permissions:
  contents: read
concurrency:
  group: private-media-maintenance-20261120
  cancel-in-progress: true
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          repository: Ekaterina11098/VESCHI_AI
          ref: beb1fa84a0253205cad069d55fd894e8f35f6e8a
          token: ${{ secrets.SOURCE_READ_TOKEN }}
          persist-credentials: false
          path: private-source
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq tesseract-ocr tesseract-ocr-rus
          pip install requests pillow numpy
      - name: Inventory catalog media
        working-directory: private-source
        env:
          WB_TOKEN_2: ${{ secrets.WB_TOKEN_2 }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: python -u maya_ip_three_slides_audit.py > /dev/null 2>&1
