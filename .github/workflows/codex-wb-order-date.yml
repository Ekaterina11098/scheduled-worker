name: WB China order date lookup
on:
  push:
    branches: [codex/wb-order-date-20261123]
    paths: [.github/workflows/codex-wb-order-date.yml]
permissions: {}
jobs:
  lookup:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Query WB Statistics
        env:
          WB_STATISTICS_TOKEN: ${{ secrets.WB_TOKEN_2 }}
        run: |
          cat > /tmp/order-public.pem <<'PEM'
          -----BEGIN PUBLIC KEY-----
          MIIBIjANBgkqhkiG9w0BAQEFAAOCAQ8AMIIBCgKCAQEAxz95lveamU/8XANXA5ux
          dtUmO4ePAzb1E5uesviTNOsdgO+smtK1mSC+X3m2xD9B+9SPzS8cx4ycAKi79DEl
          AV6v/W6j1lCNtAnpILq7RD4Dev0ODBAn9Rk+VDvFFy9j+7M9RkcFE5X3ZWUuOpQJ
          c7n6UZRao/oxzBUoRvD5v+Gvn+KO5/eMa9/HlIwXUGykm6fTZzYCtXVPU3y/kcdY
          rIVTPyJFZLOl0rhYWz4lLswtVDhXgp7eHMjwPEUshq4o74B3LSfg13mopUn/22Y/
          2McGDsHTlfGAdJX6eyGR8WXgWsZ3xBwbYeomVJLRgEsT6hKzfI80pkArPVhGVREf
          SQIDAQAB
          -----END PUBLIC KEY-----
          PEM
          python - <<'PY'
          import datetime, hashlib, json, os, subprocess, time, urllib.error, urllib.parse, urllib.request

          import base64, concurrent.futures
          token = os.environ["WB_STATISTICS_TOKEN"]
          ids = ["f9a08c9e9fc3621258342a44d204f310c5f7aa1553f4de547becacde1c4c6527","9b790b1b32407caeb433c19112620a87a139bb60b49779c43164f53a65239506","20dd90e836cd2014bd25e819ea161ee93b8e49d1a50797e50137b70511dadecd","a6cbeeab6336a14fadfc5eaa8539d62dca03ff6d8ebeec315e4f1dbaa92aba20"]
          market = "https://marketplace-api.wildberries.ru"
          stats = "https://statistics-api.wildberries.cn/api/v1/supplier"
          finance = "https://finance-api.wildberries.cn/api/finance/v1/sales-reports/detailed"
          tz = datetime.timezone(datetime.timedelta(hours=3))
          def digest(value):
              return hashlib.sha256(str(value).replace(chr(92), "").encode()).hexdigest()
          def api(name, url, body=None):
              req = urllib.request.Request(url, data=json.dumps(body).encode() if body is not None else None,
                      headers={"Authorization": token, "Content-Type": "application/json"})
              try:
                  with urllib.request.urlopen(req, timeout=90) as res:
                      return json.load(res) if res.status != 204 else []
              except urllib.error.HTTPError as exc:
                  print(f"{name} HTTP {exc.code}", flush=True)
                  return None
          def emit(name, row, fields):
              subset = {k: v for k, v in row.items() if k in fields}
              blob = json.dumps([name, subset], ensure_ascii=False, separators=(",", ":")).encode()
              for offset in range(0, len(blob), 180):
                  enc = subprocess.check_output(["openssl","pkeyutl","-encrypt","-pubin","-inkey",
                     "/tmp/order-public.pem","-pkeyopt","rsa_padding_mode:oaep"], input=blob[offset:offset+180])
                  print("WB_LOOKUP_RESULT=" + base64.b64encode(enc).decode(), flush=True)
              print("WB_LOOKUP_END", flush=True)
          def key(row):
              return any(digest(row.get(k)) in ids for k in ("srid","rid","sticker","stickerId","shkId","shk_id","supplyId","id"))
          def stamp(month, day):
              return int(datetime.datetime(2026, month, day, tzinfo=tz).timestamp())
          supply = next(s for n in range(301345000, 301346000) if digest(s := f"WB-GI-{n}") == ids[0])
          detail = api("Exact supply", market + "/api/v3/supplies/" + supply)
          refs = api("Exact supply order IDs", market + "/api/marketplace/v3/supplies/" + supply + "/order-ids")
          if detail:
              emit("supply", detail, {"id","createdAt","closedAt","scanDt","done","warehouseId"})
          target_order = "8bb9f3c33659a454df541181f5e62923ae76c0c64d94961eec7a9c0c29a2219b"
          if refs is not None:
              values = refs if isinstance(refs, list) else refs.get("orderIds", refs.get("orders", []))
              wanted = {v.get("id", v.get("orderId")) if isinstance(v, dict) else v for v in values}
              wanted.discard(None)
              wanted = {str(v) for v in wanted}
              print(f"Order list shape: {list(refs) if isinstance(refs, dict) else 'list'}", flush=True)
              print(f"Target task in supply IDs: {any(digest(v) == target_order for v in wanted)}", flush=True)
              print(f"Supply order count: {len(wanted)}", flush=True)
              targets = set(ids[1:] + [target_order] + ["77a01335fc1e6bdc305568b8fcaf8b3f261495a42ac11998efe6439e79a2086d","cffea2086eb841b772ebc9e5a62ae9406db110c0ad9800d710e02bcf2b9640d8","843ef040c871f44dd8acefa61218af54bd5e323898fa99d5213153e372edf11f","aa83897c47d29ab005c4bb526877298d02fd8e6cb6f52124e32058a8d021ce54","7610fcb627e0481e8e5b8e065497192754404078fb87926ab2845b11f3966540"])
              chosen = [int(v) for v in wanted if digest(v) in targets]
              status = api("FBS status", market + "/api/v3/orders/status", {"orders":chosen})
              for row in (status or {}).get("orders", []):
                  emit("FBS",row,{"id","supplierStatus","wbStatus"})
          sku_ids = {"453951161","493953813"}
          ar = "https://seller-analytics-api.wildberries.ru/api/analytics/v1/"
          def lookup(kind):
              offset = 0
              limit = 1000
              while True:
                  dates = ("2026-10-28","2026-11-27")
                  qs = urllib.parse.urlencode(dict(dateFrom=dates[0], dateTo=dates[1], limit=limit, offset=offset))
                  data = api(kind, ar + kind + "?" + qs)
                  if not isinstance(data, dict):
                      print(f"{kind} response: {type(data).__name__}", flush=True)
                      break
                  block = data.get("data", data)
                  rows = block.get("report", block.get("reports", []))
                  count = block.get("count", block.get("total", len(rows)))
                  hit = [row for row in rows if str(row.get("nmId")) in sku_ids or
                         any(digest(row.get(k)) in targets for k in ("srid","shkId","stickerId","orderId","oldShkId","newShkId","oldSku","newSku","sku"))]
                  print(f"{kind} rows: {len(rows)}; total: {count}; matches: {len(hit)}", flush=True)
                  for row in hit:
                      row["photoCount"] = len(row.get("photoUrls") or [])
                      emit(kind, row, {"sku","barcode","completedDt","dstOfficeAddress","dstOfficeId","expiredDt","nmId",
                         "orderDt","orderId","readyToReturnDt","returnReason","returnType","shkId","srid","returnStatus","status",
                         "stickerId","dtBonus","oldShkId","oldSku","oldVendorCode","newShkId","newSku","newVendorCode",
                         "bonusSumm","bonusType","photoCount"})
                  offset += len(rows)
                  if not rows or offset >= count or offset >= 10000:
                      break
                  time.sleep(61)
          with concurrent.futures.ThreadPoolExecutor() as pool:
              # Serialize encrypted record output per report.
              lookup("item-returns")
              lookup("deductions")
          PY
