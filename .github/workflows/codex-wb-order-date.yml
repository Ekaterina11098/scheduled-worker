name: WB China order date lookup
on:
  push:
    branches: [codex/wb-order-date-20261123]
    paths: [.github/workflows/codex-wb-order-date.yml]
permissions: {}
jobs:
  lookup:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Query WB Statistics
        env:
          WB_STATISTICS_TOKEN: ${{ secrets.WB_TOKEN_3 }}
        run: |
          cat > /tmp/order-public.pem <<'PEM'
          -----BEGIN PUBLIC KEY-----
          MIIBIjANBgkqhkiG9w0BAQEFAAOCAQ8AMIIBCgKCAQEAxz95lveamU/8XANXA5ux
          dtUmO4ePAzb1E5uesviTNOsdgO+smtK1mSC+X3m2xD9B+9SPzS8cx4ycAKi79DEl
          AV6v/W6j1lCNtAnpILq7RD4Dev0ODBAn9Rk+VDvFFy9j+7M9RkcFE5X3ZWUuOpQJ
          c7n6UZRao/oxzBUoRvD5v+Gvn+KO5/eMa9/HlIwXUGykm6fTZzYCtXVPU3y/kcdY
          rIVTPyJFZLOl0rhYWz4lLswtVDhXgp7eHMjwPEUshq4o74B3LSfg13mopUn/22Y/
          2McGDsHTlfGAdJX6eyGR8WXgWsZ3xBwbYeomVJLRgEsT6hKzfI80pkArPVhGVREf
          SQIDAQAB
          -----END PUBLIC KEY-----
          PEM
          python - <<'PY'
          import datetime, hashlib, json, os, subprocess, time, urllib.error, urllib.parse, urllib.request

          target = "a6cbeeab6336a14fadfc5eaa8539d62dca03ff6d8ebeec315e4f1dbaa92aba20"
          token = os.environ.get("WB_STATISTICS_TOKEN")
          if not token:
              raise SystemExit("WB token is unavailable")
          moscow = datetime.timezone(datetime.timedelta(hours=3))
          sources = {
              "statistics": ("https://statistics-api.wildberries.cn/api/v1/supplier/orders?dateFrom=2026-11-13&flag=0", None),
              "feed": ("https://seller-analytics-api.wildberries.cn/api/analytics/v1/order-feed",
                       {"selectedPeriod": {"start": "2026-11-12T00:00:00+03:00", "end": "2026-11-23T00:00:00+03:00"},
                        "nmIds": [453951161], "pagination": {"offset": 0, "limit": 5000}}),
          }
          import base64
          for source, (url, body) in sources.items():
              req = urllib.request.Request(url, data=json.dumps(body).encode() if body else None,
                      headers={"Authorization": token, "Content-Type": "application/json"})
              try:
                  with urllib.request.urlopen(req, timeout=90) as response:
                      data = json.load(response)
              except urllib.error.HTTPError as exc:
                  print(f"{source} HTTP {exc.code}")
                  continue
              rows = data["data"]["orders"] if body else data
              matches = [row for row in rows if hashlib.sha256(row.get("srid", "").replace(chr(92), "").encode()).hexdigest() == target]
              print(f"{source} matches: {len(matches)}")
              for row in matches:
                  for name, value in row.items():
                      if name == "srid":
                          continue
                      encrypted = subprocess.check_output(
                          ["openssl", "pkeyutl", "-encrypt", "-pubin", "-inkey", "/tmp/order-public.pem",
                           "-pkeyopt", "rsa_padding_mode:oaep"],
                          input=json.dumps([name, value], ensure_ascii=False).encode())
                      print("WB_LOOKUP_RESULT=" + base64.b64encode(encrypted).decode())
          PY
