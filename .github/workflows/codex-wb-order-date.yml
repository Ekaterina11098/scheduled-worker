name: WB China order date lookup
on:
  push:
    branches: [codex/wb-order-date-20261123]
    paths: [.github/workflows/codex-wb-order-date.yml]
permissions: {}
jobs:
  lookup:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Query WB Order Feed
        env:
          WB_STATISTICS_TOKEN: ${{ secrets.WB_TOKEN_3 }}
        run: |
          cat > /tmp/order-public.pem <<'PEM'
          -----BEGIN PUBLIC KEY-----
          MIIBIjANBgkqhkiG9w0BAQEFAAOCAQ8AMIIBCgKCAQEAxz95lveamU/8XANXA5ux
          dtUmO4ePAzb1E5uesviTNOsdgO+smtK1mSC+X3m2xD9B+9SPzS8cx4ycAKi79DEl
          AV6v/W6j1lCNtAnpILq7RD4Dev0ODBAn9Rk+VDvFFy9j+7M9RkcFE5X3ZWUuOpQJ
          c7n6UZRao/oxzBUoRvD5v+Gvn+KO5/eMa9/HlIwXUGykm6fTZzYCtXVPU3y/kcdY
          rIVTPyJFZLOl0rhYWz4lLswtVDhXgp7eHMjwPEUshq4o74B3LSfg13mopUn/22Y/
          2McGDsHTlfGAdJX6eyGR8WXgWsZ3xBwbYeomVJLRgEsT6hKzfI80pkArPVhGVREf
          SQIDAQAB
          -----END PUBLIC KEY-----
          PEM
          python - <<'PY'
          import datetime, hashlib, json, os, subprocess, time, urllib.error, urllib.parse, urllib.request

          target = "69d00d2f25194351126cd3916b676f32b67085e85f5a5288c4dafba4ff9768df"
          token = os.environ.get("WB_STATISTICS_TOKEN")
          if not token:
              raise SystemExit("WB token is unavailable")
          moscow = datetime.timezone(datetime.timedelta(hours=3))
          now = datetime.datetime.now(moscow)
          start = now - datetime.timedelta(days=30)
          body = {"selectedPeriod": {"start": start.isoformat(), "end": now.isoformat()},
                  "pagination": {"offset": 0, "limit": 5000}}
          date = None
          for page in range(6):
              req = urllib.request.Request("https://seller-analytics-api.wildberries.cn/api/analytics/v1/order-feed",
                  data=json.dumps(body).encode(), headers={"Authorization": token, "Content-Type": "application/json"})
              try:
                  with urllib.request.urlopen(req, timeout=90) as response:
                      data = json.load(response)["data"]
              except urllib.error.HTTPError as exc:
                  raise SystemExit(f"WB Order Feed returned HTTP {exc.code}")
              rows = data["orders"]
              for row in rows:
                  srid = row.get("srid", "").replace(chr(92), "")
                  if hashlib.sha256(srid.encode()).hexdigest() == target:
                      date = row["createdAt"]
                      break
              if date or len(rows) < 5000:
                  break
              if page == 5:
                  raise SystemExit("WB Order Feed pagination did not finish")
              body["pagination"]["snapshotTime"] = data["snapshotTime"]
              body["pagination"]["offset"] += len(rows)
              time.sleep(61)
          encrypted = subprocess.check_output(
              ["openssl", "pkeyutl", "-encrypt", "-pubin", "-inkey", "/tmp/order-public.pem",
               "-pkeyopt", "rsa_padding_mode:oaep"],
              input=json.dumps({"date": date}).encode(),
          )
          import base64
          print("WB_LOOKUP_RESULT=" + base64.b64encode(encrypted).decode())
          PY
