name: WB China order date lookup
on:
  push:
    branches: [codex/wb-order-date-20261123]
    paths: [.github/workflows/codex-wb-order-date.yml]
permissions: {}
jobs:
  lookup:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Query WB Statistics
        env:
          WB_STATISTICS_TOKEN: ${{ secrets.WB_TOKEN_3 }}
        run: |
          cat > /tmp/order-public.pem <<'PEM'
          -----BEGIN PUBLIC KEY-----
          MIIBIjANBgkqhkiG9w0BAQEFAAOCAQ8AMIIBCgKCAQEAxz95lveamU/8XANXA5ux
          dtUmO4ePAzb1E5uesviTNOsdgO+smtK1mSC+X3m2xD9B+9SPzS8cx4ycAKi79DEl
          AV6v/W6j1lCNtAnpILq7RD4Dev0ODBAn9Rk+VDvFFy9j+7M9RkcFE5X3ZWUuOpQJ
          c7n6UZRao/oxzBUoRvD5v+Gvn+KO5/eMa9/HlIwXUGykm6fTZzYCtXVPU3y/kcdY
          rIVTPyJFZLOl0rhYWz4lLswtVDhXgp7eHMjwPEUshq4o74B3LSfg13mopUn/22Y/
          2McGDsHTlfGAdJX6eyGR8WXgWsZ3xBwbYeomVJLRgEsT6hKzfI80pkArPVhGVREf
          SQIDAQAB
          -----END PUBLIC KEY-----
          PEM
          python - <<'PY'
          import datetime, hashlib, json, os, subprocess, time, urllib.error, urllib.parse, urllib.request

          target = "7610fcb627e0481e8e5b8e065497192754404078fb87926ab2845b11f3966540"
          token = os.environ.get("WB_STATISTICS_TOKEN")
          if not token:
              raise SystemExit("WB token is unavailable")
          moscow = datetime.timezone(datetime.timedelta(hours=3))
          import base64
          root = "https://marketplace-api.wildberries.cn"
          headers = {"Authorization": token, "Content-Type": "application/json"}
          allowed = {"id", "createdAt", "warehouseId", "supplyId", "nmId", "chrtId", "article", "skus", "price",
                     "convertedPrice", "salePrice", "currencyCode", "convertedCurrencyCode", "deliveryType",
                     "sellerStatus", "wbStatus", "status", "updatedAt", "isB2b"}
          def request(url, payload=None):
              req = urllib.request.Request(url, data=json.dumps(payload).encode() if payload else None, headers=headers)
              with urllib.request.urlopen(req, timeout=60) as response:
                  return json.load(response)
          def emit(source, row):
              for field, value in row.items():
                  if field not in allowed:
                      continue
                  blob = subprocess.check_output(
                      ["openssl", "pkeyutl", "-encrypt", "-pubin", "-inkey", "/tmp/order-public.pem",
                       "-pkeyopt", "rsa_padding_mode:oaep"], input=json.dumps([source, field, value]).encode())
                  print("WB_LOOKUP_RESULT=" + base64.b64encode(blob).decode())
          def same(row):
              return any(hashlib.sha256(str(row.get(field, "")).encode()).hexdigest() == target
                         for field in ("rid", "srid"))
          match = None
          try:
              period = {"dateFrom": int(datetime.datetime(2026, 11, 16, tzinfo=moscow).timestamp()),
                        "dateTo": int(datetime.datetime(2026, 11, 23, tzinfo=moscow).timestamp()),
                        "limit": 1000, "next": 0}
              for page in range(30):
                  data = request(root + "/api/v3/orders?" + urllib.parse.urlencode(period))
                  match = next((row for row in data["orders"] if same(row)), None)
                  if match or not data["orders"] or not data.get("next") or data["next"] == period["next"]:
                      break
                  period["next"] = data["next"]
                  time.sleep(0.25)
              print(f"FBS match: {bool(match)}")
              if match:
                  emit("FBS", match)
                  for row in request(root + "/api/v3/orders/status", {"orders": [match["id"]]}).get("orders", []):
                      emit("status", row)
          except urllib.error.HTTPError as exc:
              print(f"FBS HTTP {exc.code}")
          try:
              feed = request("https://seller-analytics-api.wildberries.cn/api/analytics/v1/order-feed",
                      {"selectedPeriod": {"start": "2026-11-16T00:00:00+03:00", "end": "2026-11-23T00:00:00+03:00"},
                       "nmIds": [493953813], "pagination": {"offset": 0, "limit": 5000}})
              rows = [row for row in feed["data"]["orders"] if same(row)]
              print(f"Feed matches: {len(rows)}")
              for row in rows:
                  emit("feed", row)
          except urllib.error.HTTPError as exc:
              print(f"Feed HTTP {exc.code}")
          PY
