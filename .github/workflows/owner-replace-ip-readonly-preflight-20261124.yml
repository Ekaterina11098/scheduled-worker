name: Replace obsolete read-only IP preflight
on:
  push:
    paths: ['.github/workflows/owner-replace-ip-readonly-preflight-20261124.yml']
permissions:
  actions: write
  contents: read
jobs:
  cancel-obsolete-read:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail-with-body --silent --show-error -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" https://api.github.com/repos/Ekaterina11098/scheduled-worker/actions/runs/45364090652/cancel
