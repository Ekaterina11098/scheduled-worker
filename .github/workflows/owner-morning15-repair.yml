name: Owner morning15 report repair
on:
  push:
    branches: [main]
    paths: [.github/workflows/owner-morning15-repair.yml]
permissions: {contents: read}
jobs:
  inspect:
    if: github.run_attempt == 1 && github.event.head_commit.message == '[owner-morning15-repair] Complete cost scan and correct the existing reports'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /scripts/
            /.github/
            /*request*.json
      - uses: actions/checkout@v4
        with:
          repository: Ekaterina11098/VESCHI_AI
          ref: a7efd98c6ef7e54f415471abcb694c748c2b4f6d
          token: ${{ secrets.SOURCE_READ_TOKEN }}
          path: source
          persist-credentials: false
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /analytics/
            /business_agents/
            /advertising_agent/
            /china_agent/
            /tests/
            /*.py
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install requests==2.32.5 pillow==11.3.0 python-dotenv simplejson==4.2.0 openai==3.42.1

      - name: Verify report safeguards
        run: PYTHONPATH=scripts python -m unittest discover -s scripts -p 'test_china_advertising_*.py'
      - name: Verify completed-day cost scan
        run: PYTHONPATH=scripts python -m unittest discover -s scripts -p 'test_completed_cost_scan.py'
      - name: Read exact campaign economics
        env:
          OPENAI_API_KEY: ''
          MPSTATS_API_TOKEN: ${{ secrets.MPSTATS_API_TOKEN }}
          MOYSKLAD_API_TOKEN: ${{ secrets.MOYSKLAD_API_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          WB_TOKEN_3: ${{ secrets.WB_TOKEN_3 }}
          CHINA_TELEGRAM_BOT_TOKEN: ${{ secrets.CHINA_TELEGRAM_BOT_TOKEN }}
          PYTHONPATH: scripts:source
        run: python scripts/owner_morning15_repair.py

# Resume only unfinished read stages; preserve collected exact inputs.

# Resume from completed dated source and verify same-category minima before publication.
