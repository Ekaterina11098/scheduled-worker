name: OOO one-shot read-only cohort refresh
on:
  push:
    branches: [main]
    paths: ['scripts/ooo_cohort_refresh16.py', '.github/workflows/ooo-cohort-refresh16.yml']
permissions: {contents: read}
concurrency:
  group: ooo-cohort-refresh16
  cancel-in-progress: false
jobs:
  read:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false, sparse-checkout: scripts}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install requests==2.32.5 --quiet
      - name: Refresh orders and sales only
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          WB_TOKEN_1: ${{ secrets.WB_TOKEN_1 }}
        run: python -u scripts/ooo_cohort_refresh16.py
