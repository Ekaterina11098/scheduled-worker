name: Read-only MS pagination diagnosis25Nov
on:
  push:
    paths: ['.github/workflows/ms-pagination-diagnosis-20261125.yml']
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inspect document page metadata without reading stock or modifying documents
        env:
          MS_TOKEN: ${{ secrets.MOYSKLAD_API_TOKEN }}
        run: |
          python - <<'PY'
          import os,json,urllib.request,urllib.error,urllib.parse,gzip,time,concurrent.futures
          def probe(kind):
              expected=None
              for offset in (0,1000,2000,3000):
                  params=urllib.parse.urlencode({'limit':1000,'offset':offset,'filter':'updated>=2026-11-25 00:00:00'})
                  url='https://api.moysklad.ru/api/remap/1.2/entity/'+kind+'?'+params
                  request=urllib.request.Request(url,headers={'Authorization':'Bearer '+os.environ['MS_TOKEN'],'Accept-Encoding':'gzip'})
                  start=time.time()
                  try:
                      with urllib.request.urlopen(request,timeout=30) as response:
                          raw=response.read()
                          if response.headers.get('Content-Encoding')=='gzip':raw=gzip.decompress(raw)
                          value=json.loads(raw)
                          meta=value.get('meta') or {};rows=value.get('rows')
                          size=meta.get('size')
                          print(json.dumps({'endpoint':kind,'offset':offset,'status':response.status,'size':size,'size_type':type(size).__name__,'rows_type':type(rows).__name__,'row_count':len(rows) if isinstance(rows,list) else None,'elapsed':round(time.time()-start,2)}),flush=True)
                          if not isinstance(rows,list) or type(size) is not int or len(rows)<1000:break
                  except Exception as e:
                      print(json.dumps({'endpoint':kind,'offset':offset,'error_type':type(e).__name__,'status':getattr(e,'code',None)}),flush=True);break
          with concurrent.futures.ThreadPoolExecutor(max_workers=2) as pool:list(pool.map(probe,['demand','customerorder']))
          PY
