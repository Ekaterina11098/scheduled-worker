                      raise Stop("existing_video_missing")
                  with tempfile.TemporaryDirectory() as folder:
                      report.update(validated_video(client, card["video"], Path(folder) / "checked.mp4"))
                  report["status"] = "verified"
              except Exception as error:
                  report.update(status="stopped", reason=str(error) if isinstance(error, Stop) else type(error).__name__)
                  save(client, report)
                  raise SystemExit("Video preflight stopped") from None
              save(client, report)
              print("Video preflight verified")


          if __name__ == "__main__":
              main()
          PYTHON
