          def sha(raw):
              return hashlib.sha256(raw).hexdigest()


          def image(raw):
              with Image.open(io.BytesIO(raw)) as im:
                  return ImageOps.fit(im.convert("RGB"), (192, 256))


          def difference(a, b):
              return sum(ImageStat.Stat(ImageChops.difference(a, b)).mean) / 3


          def matches(slides, photos):
              return [[i for i, photo in enumerate(photos) if difference(slide, photo) <= 5]
                      for slide in slides]


          def media_urls(card):
              urls = []
              for photo in card.get("photos") or []:
                  url = photo.get("big")
                  u = urlsplit(url or "")
                  if (u.scheme != "https" or not re.fullmatch(r"basket-\d+\.(wbbasket\.ru|wbcontent\.net)", u.netloc)
                          or not re.fullmatch(r"/vol\d+/part\d+/\d+/images/big/\d+\.(webp|jpg|jpeg|png)", u.path)
                          or u.query or u.fragment):
                      raise Stop("unexpected_photo_url")
                  urls.append(url)
              return urls


          def photos(client, urls, fresh=False):
              stamp = str(time.time_ns())
              return [client.call(url + ("?verify=" + stamp if fresh else ""),
                                  auth=False, limit=32_000_000) for url in urls]


          def core(card):
              return {k: v for k, v in card.items() if k not in ("photos", "video", "updatedAt")}


          def read_card(client, nm, article):
              body = {"settings": {"cursor": {"limit": 100}, "filter": {"withPhoto": -1, "textSearch": str(nm)}}}
              import json
              raw = client.call(HOST + "/content/v2/get/cards/list", "POST", body,
                                {"Authorization": os.environ["WB_TOKEN_3"]})
              data = json.loads(raw)
              hits = [c for c in data.get("data", data)["cards"] if c.get("nmID") == nm]
              if not hits:
                  hits = [c for c in client.catalog() if c.get("nmID") == nm]
              if len(hits) != 1 or hits[0].get("vendorCode") != article:
                  raise Stop("card_identity_not_verified")
              return hits[0]


          def save(client, report, claim=False):
              now = dt.datetime.now(dt.timezone.utc)
              body = {"cache_key": RESULT, "payload": report, "updated_at": now.isoformat(),
                      "expires_at": (now + dt.timedelta(days=30)).isoformat()}
              mode = "ignore" if claim else "merge"
              rows = client.cache({"on_conflict": "cache_key"}, "POST", body,
                                  f"resolution={mode}-duplicates,return=representation")
              if len(rows) != 1 or client.get(RESULT) != report:
                  raise Stop("journal_not_verified_or_run_already_claimed")


          import json
