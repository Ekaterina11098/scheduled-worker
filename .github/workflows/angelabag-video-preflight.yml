          def trusted_video_url(url):
              u = urlsplit(url)
              host = u.hostname or ""
              if (u.scheme != "https" or u.username or u.password or u.port or u.fragment
                      or not (host == "video.wbstatic.net" or host.endswith(
                          (".wbbasket.ru", ".wbcontent.net", ".geobasket.ru", ".wbstatic.net", ".wildberries.ru", ".wildberries.cn", ".wb.ru")))):
                  raise Stop("video_host_not_allowed")
              return u


          def hls_vod(client, url):
              trusted_video_url(url)
              for _ in range(3):
                  data = client.call(url, auth=False, limit=1_000_000).decode("utf-8-sig")
                  lines = [line.strip() for line in data.splitlines() if line.strip()]
                  if not lines or lines[0] != "#EXTM3U":
                      raise Stop("invalid_hls_playlist")
                  if any(line.startswith(("#EXT-X-KEY:", "#EXT-X-SESSION-KEY:", "#EXT-X-MEDIA:")) for line in lines):
                      raise Stop("hls_has_encryption_or_external_tracks")
                  if "#EXT-X-ENDLIST" in lines:
                      segments = [urljoin(url, line) for line in lines if not line.startswith("#")]
                      durations = [float(line[8:].split(",", 1)[0]) for line in lines if line.startswith("#EXTINF:")]
                      if len(segments) != len(durations) or not segments:
                          raise Stop("hls_segments_missing")
                      for segment in segments:
                          trusted_video_url(segment)
                      return url, lines, sum(durations)
                  branches = [(int(re.search(r"(?:[:,])BANDWIDTH=(\d+)", line)[1]), urljoin(url, lines[i+1]))
                              for i, line in enumerate(lines[:-1]) if line.startswith("#EXT-X-STREAM-INF:")]
                  if not branches:
                      raise Stop("hls_is_not_complete_vod")
                  url = max(branches)[1]
                  trusted_video_url(url)
              raise Stop("hls_playlist_depth_limit")


          def command(args, failure):
              try:
                  result = subprocess.run(args, capture_output=True, check=True, timeout=180)
                  return result.stdout
              except subprocess.CalledProcessError as error:
                  stderr = (error.stderr or b"").decode("utf-8", errors="replace").lower()
                  categories = {
                      "extension": ("not in allowed_segment_extensions", "invalid extension", "not in allowed extensions"),
                      "invalid_segment": ("invalid data found", "error when loading first segment"),
                      "unsupported_stream": ("codec not currently supported", "could not find tag for codec"),
                      "no_streams": ("does not contain any stream", "matches no streams", "could not find codec parameters"),
                      "network": ("http error", "connection refused", "input/output error"),
                      "file_missing": ("no such file or directory",),
                      "timestamp": ("non-monoton", "invalid dts", "invalid pts"),
                  }
                  match = next((name for name, needles in categories.items()
                                if any(needle in stderr for needle in needles)), "unknown_ffmpeg_error")
                  raise Stop(failure + "_" + match) from None
              except subprocess.TimeoutExpired:
                  raise Stop(failure + "_timeout") from None
              except OSError:
                  raise Stop(failure + "_tool_unavailable") from None


          def media_info(path):
              data = json.loads(command(["ffprobe", "-v", "error", "-show_streams", "-show_format",
                                         "-of", "json", str(path)], "video_probe_failed"))
              return data


          def stream_identity(source, network=False):
              args = ["ffmpeg", "-v", "error", "-xerror", "-nostdin"]
              if network:
                  args += ["-protocol_whitelist", "https,tls,tcp,crypto", "-rw_timeout", "12000000"]
              args += ["-i", str(source), "-map", "0:v:0", "-map", "0:a:0?", "-c:v", "rawvideo",
                       "-c:a", "pcm_s16le", "-f", "streamhash", "-hash", "sha256", "-"]
              result = command(args, "video_or_audio_decode_failed").decode("ascii").strip().splitlines()
              if not any(",v," in line for line in result):
                  raise Stop("no_decoded_video")
              return result


          def localize_playlist(client, url, lines, folder):
              cache = {}
              total = 0

              def download(value):
                  nonlocal total
                  address = urljoin(url, value)
                  parsed = trusted_video_url(address)
                  if address not in cache:
                      ext = Path(parsed.path).suffix.lower()
                      if ext not in (".ts", ".mp4", ".m4s", ".aac", ".m4a"):
                          ext = ".bin"
                      name = f"segment_{len(cache):04d}{ext}"
                      raw = client.call(address, auth=False, limit=50_000_000)
                      total += len(raw)
                      if not raw or total > 65_000_000:
                          raise Stop("hls_segments_size_limit")
                      (folder / name).write_bytes(raw)
                      cache[address] = name
                  return cache[address]

              localized = []
              for line in lines:
                  if line.startswith("#EXT-X-MAP:"):
                      line = re.sub(r'URI="([^"]+)"', lambda m: 'URI="' + download(m[1]) + '"', line)
                  elif not line.startswith("#"):
                      line = download(line)
                  localized.append(line)
              target = folder / "source.m3u8"
              target.write_text("\n".join(localized) + "\n")
              return target


          def validated_video(client, url, output):
              suffix = trusted_video_url(url).path.lower().rsplit(".", 1)[-1]
              if suffix == "m3u8":
                  source, lines, expected_duration = hls_vod(client, url)
                  playlist = localize_playlist(client, source, lines, output.parent)
                  command(["ffmpeg", "-v", "error", "-xerror", "-nostdin", "-allowed_extensions", "ALL",
                           "-protocol_whitelist", "file", "-i", str(playlist),
                           "-map", "0:v:0", "-map", "0:a:0?", "-c", "copy", "-movflags", "+faststart",
                           str(output)], "local_hls_remux_failed")
                  reference = stream_identity(playlist)
              elif suffix in ("mp4", "mov"):
                  raw = client.call(url, auth=False, limit=50_000_000)
                  original = output.with_name("original." + suffix)
                  original.write_bytes(raw)
                  expected_duration = float(media_info(original)["format"]["duration"])
                  reference = stream_identity(original)
                  if suffix == "mp4":
                      original.rename(output)
                  else:
                      command(["ffmpeg", "-v", "error", "-xerror", "-nostdin", "-i", str(original),
                               "-map", "0:v:0", "-map", "0:a:0?", "-c", "copy", "-movflags", "+faststart",
                               str(output)], "mov_remux_failed")
              else:
                  raise Stop("unsupported_video_source_format")
              info = media_info(output)
              duration = float(info["format"]["duration"])
              size = output.stat().st_size
              if not 0 < size <= 50_000_000 or abs(duration - expected_duration) > 0.30:
                  raise Stop("mp4_duration_or_size_outside_limits")
              video, = [s for s in info["streams"] if s["codec_type"] == "video"]
              audio = [s for s in info["streams"] if s["codec_type"] == "audio"]
              if video["codec_name"] not in ("h264", "mpeg4") or any(s["codec_name"] not in ("aac", "mp3") for s in audio):
                  raise Stop("mp4_codec_not_compatible")
              if stream_identity(output) != reference:
                  raise Stop("decoded_picture_or_sound_mismatch")
              return {"source_format": suffix.upper(), "duration_seconds": round(duration, 3),
                      "source_duration_seconds": round(expected_duration, 3), "mp4_bytes": size,
                      "picture_matches": True, "audio_present": bool(audio), "audio_matches": True}


