name: Recover exact approved IP PNG 27Nov
on:
  push:
    branches: [main]
    paths: ['.github/workflows/ip-approved-png-recover-20261127.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: wb-ip-advertising-agent
  cancel-in-progress: false
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 7b5891722c21613d1944b0222b6f9e288ecb3560
          sparse-checkout: |
            *.py
            analytics
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install Pillow==12.3.0 > "$RUNNER_TEMP/dependencies.log" 2>&1
      - name: Execute only original human-approved photo160 action
        run: python ip_daily_png_apply.py --approval-key advertising:ip:daily-png-plan:v1:2026-11-26:approval
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          WB_TOKEN_2: ${{ secrets.WB_TOKEN_2 }}
          ADVERTISING_TELEGRAM_BOT_TOKEN: ${{ secrets.ADVERTISING_TELEGRAM_BOT_TOKEN }}
          ADVERTISING_EXECUTION_ENABLED: 'false'
