name: WB one-card gallery trial
on:
  push:
    branches: [main]
    paths: [.github/workflows/owner-gallery-trial-20261120.yml]
permissions: {}
concurrency:
  group: bot-mpstats-data
  cancel-in-progress: false
jobs:
  apply:
    if: github.run_attempt == 1 && github.event.head_commit.message == '[owner-gallery-trial-20261120] Apply one verified gallery'
    runs-on: ubuntu-latest
    timeout-minutes: 17
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --quiet requests==2.32.5 pillow==11.3.0
      - name: Update and verify one gallery
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          WB_TOKEN_3: ${{ secrets.WB_TOKEN_3 }}
        shell: python
        run: |
          import base64
          import io
          import json
          import os
          import subprocess
          import tempfile
          import time
          from pathlib import Path
          
          import requests
          from PIL import Image, ImageChops, ImageStat
          
          nm = 1473243890
          prefix = "noelbag:20261120:trial:"
          sb = os.environ["SUPABASE_URL"].rstrip("/")
          key = os.environ["SUPABASE_SECRET_KEY"]
          sh = {"apikey": key, "Authorization": "Bearer " + key}
          wh = {"Authorization": os.environ["WB_TOKEN_3"]}
          host = "https://content-api.wildberries.ru"
          cache_url = sb + "/rest/v1/telegram_api_cache"
          bucket = "owner-media-recovery"
          storage = sb + "/storage/v1"
          folder = "noelbag-trial-20261120"
          
          def response(method, url, **kw):
              r = requests.request(method, url, timeout=70, **kw)
              if not r.ok:
                  raise RuntimeError("HTTP " + str(r.status_code))
              return r
          
          def card(full=False):
              cursor = {"limit": 100}
              while True:
                  filt = {"withPhoto": -1}
                  if not full:
                      filt["textSearch"] = str(nm)
                  data = response("POST", host + "/content/v2/get/cards/list", headers=wh,
                                  json={"settings": {"cursor": cursor, "filter": filt}}).json()
                  for c in data["cards"]:
                      if c["nmID"] == nm:
                          if c["vendorCode"].lower() != "595-noelbag-zblack":
                              raise RuntimeError("Wrong card")
                          return c
                  next_cursor = data["cursor"]
                  if not full:
                      return card(True)
                  if next_cursor["total"] < 100:
                      raise RuntimeError("Card missing")
                  cursor = {"limit": 100, "nmID": next_cursor["nmID"], "updatedAt": next_cursor["updatedAt"]}
          
          def record(state, claim=False, **fields):
              prefer = "ignore-duplicates" if claim else "merge-duplicates"
              rows = response("POST", cache_url, headers={**sh, "Prefer": "resolution=" + prefer + ",return=representation"},
                              params={"on_conflict": "cache_key"},
                              json={"cache_key": prefix + "result", "payload": {"status": state, **fields},
                                    "expires_at": "2026-12-20T00:00:00Z"}).json()
              if len(rows) != 1:
                  raise RuntimeError("Already claimed")
          
          def signed(name, raw, mime):
              path = bucket + "/" + folder + "/" + name
              response("POST", storage + "/object/" + path,
                       headers={**sh, "Content-Type": mime, "x-upsert": "false"}, data=raw)
              suffix = response("POST", storage + "/object/sign/" + path, headers=sh,
                                json={"expiresIn": 86400}).json()["signedURL"]
              return sb + ("/storage/v1" if suffix.startswith("/object/") else "") + suffix
          
          def thumbnail(raw):
              with Image.open(io.BytesIO(raw)) as img:
                  assert img.width >= 700 and img.height >= 900
                  return img.convert("RGB").resize((96, 128), Image.Resampling.LANCZOS)
          
          def comparable(c):
              result = {k: v for k, v in c.items() if k not in ("photos", "video", "updatedAt")}
              if "characteristics" in result:
                  result["characteristics"] = sorted(result["characteristics"], key=lambda x: x["id"])
              return result
          
          def video_file(url, target):
              # Remuxing copies the existing video and audio streams.
              subprocess.run(["ffmpeg", "-v", "error", "-nostdin", "-i", url, "-map", "0:v:0",
                              "-map", "0:a?", "-c", "copy", "-movflags", "+faststart", str(target)],
                             check=True, timeout=110, stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL)
              assert 0 < target.stat().st_size <= 50_000_000
          
          def video_signature(source):
              duration_output = subprocess.check_output(
                  ["ffprobe", "-v", "error", "-show_entries", "format=duration",
                   "-of", "default=noprint_wrappers=1:nokey=1", str(source)], timeout=60,
                  stderr=subprocess.DEVNULL)
              duration = float(duration_output.strip())
              assert duration > 0
              frames = []
              for ratio in (0.15, 0.50, 0.85):
                  raw = subprocess.check_output(
                      ["ffmpeg", "-v", "error", "-ss", str(duration * ratio), "-i", str(source),
                       "-frames:v", "1", "-vf", "scale=64:64", "-f", "rawvideo", "-pix_fmt", "rgb24", "-"],
                      timeout=60, stderr=subprocess.DEVNULL)
                  frames.append(Image.frombytes("RGB", (64, 64), raw))
              return duration, frames
          
          def delta(a, b):
              return sum(ImageStat.Stat(ImageChops.difference(a, b)).mean) / 3
          
          record("preparing", claim=True)
          stage = "preparing"
          try:
              assert response("GET", storage + "/bucket/" + bucket, headers=sh).json()["public"] is False
              before = card()
              photos = before["photos"]
              old_count = len(photos)
              assert 6 <= old_count <= 26
              slides = []
              for i in range(1, 5):
                  rows = response("GET", cache_url, headers=sh,
                                  params={"cache_key": "eq." + prefix + f"slide:{i}", "select": "payload"}).json()
                  slides.append(base64.b64decode(rows[0]["payload"]["data"], validate=True))
              originals = [response("GET", p["big"], params={"check": time.time_ns()}).content for p in photos]
              order = originals[:6] + slides + originals[6:]
              expected = [thumbnail(raw) for raw in order]
              urls = []
              for i, raw in enumerate(order, 1):
                  with Image.open(io.BytesIO(raw)) as img:
                      fmt = img.format.lower()
                  ext = {"jpeg": "jpg", "png": "png", "webp": "webp"}[fmt]
                  urls.append(signed(f"{i:02}.{ext}", raw, f"image/{fmt}"))
              signature = None
              if before.get("video"):
                  with tempfile.TemporaryDirectory() as folder_tmp:
                      target = Path(folder_tmp) / "original.mp4"
                      video_file(before["video"], target)
                      signature = video_signature(target)
                      urls.append(signed("original.mp4", target.read_bytes(), "video/mp4"))
              fresh = card()
              assert comparable(fresh) == comparable(before)
              assert fresh["photos"] == photos and fresh.get("video") == before.get("video")
              stage = "submitted"
              record(stage, old_photos=old_count, new_photos=len(order), video_present=bool(signature))
              result = response("POST", host + "/content/v3/media/save", headers=wh,
                                json={"nmId": nm, "data": urls}).json()
              assert result.get("error") is False
              stage = "accepted"
              record(stage, old_photos=old_count, new_photos=len(order), video_present=bool(signature))
              for attempt in range(15):
                  time.sleep(15)
                  after = card(full=True)
                  if len(after.get("photos", [])) != len(order):
                      continue
                  try:
                      errors = [delta(thumb, thumbnail(response("GET", p["big"],
                                     params={"check": time.time_ns()}).content))
                                for thumb, p in zip(expected, after["photos"])]
                  except Exception:
                      continue
                  if max(errors) >= 5:
                      continue
                  if signature:
                      if not after.get("video"):
                          continue
                      try:
                          with tempfile.TemporaryDirectory() as folder_tmp:
                              target = Path(folder_tmp) / "after.mp4"
                              video_file(after["video"], target)
                              duration, frames = video_signature(target)
                          if abs(duration - signature[0]) > 1 or max(delta(a, b) for a, b in zip(signature[1], frames)) > 15:
                              continue
                      except Exception:
                          continue
                  else:
                      assert not after.get("video")
                  assert comparable(after) == comparable(before)
                  record("verified", nm_id=nm, old_photos=old_count, new_photos=len(order),
                         slots=[7, 8, 9, 10], video_present=bool(signature), video_verified=True,
                         other_fields_verified=True, maximum_photo_difference=round(max(errors), 3))
                  print(json.dumps({"status": "verified", "photos": len(order), "video": bool(signature)}))
                  break
              else:
                  record("readback_pending", old_photos=old_count, new_photos=len(order), video_present=bool(signature))
                  raise SystemExit("Readback pending; do not retry write")
          except Exception as error:
              record("failed_" + stage, error_type=type(error).__name__,
                     http_error=str(error) if str(error).startswith("HTTP ") else None)
              raise SystemExit("Failed at " + stage + ": " + type(error).__name__)
