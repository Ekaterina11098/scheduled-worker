name: Owner gray6 approved main cover only
on:
  push:
    branches: [main]
    paths: [.github/workflows/owner-fur-cover18-apply.yml]
permissions: {}
concurrency:
  group: bot-mpstats-data
  cancel-in-progress: false
jobs:
  apply:
    if: github.run_attempt == 1 && github.event.head_commit.message == '[owner-fur-cover18] Replace only approved gray6 main photo'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install --quiet requests==2.32.5 pillow==11.3.0
      - name: Replace exact first image, verify photo and unchanged content
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          WB_TOKEN_3: ${{ secrets.WB_TOKEN_3 }}
        shell: python
        run: |
          import os,json,time,base64,hashlib,io,copy
          from datetime import datetime,timezone
          import requests
          from PIL import Image,ImageChops,ImageStat
          ROOT='china_agent:owner_fur_cover18'
          sb=os.environ['SUPABASE_URL'].rstrip('/');sk=os.environ['SUPABASE_SECRET_KEY']
          sh={'apikey':sk,'Authorization':'Bearer '+sk,'Content-Type':'application/json'};wh={'Authorization':os.environ['WB_TOKEN_3']}
          def stamp():return datetime.now(timezone.utc).isoformat()
          def cache(k):
           r=requests.get(sb+'/rest/v1/telegram_api_cache',headers=sh,params={'cache_key':'eq.'+k,'select':'payload'},timeout=45);r.raise_for_status();rows=r.json();return rows[0]['payload'] if rows else None
          def put(k,p,create=False):
           r=requests.post(sb+'/rest/v1/telegram_api_cache?on_conflict=cache_key',headers={**sh,'Prefer':'resolution='+('ignore-duplicates' if create else 'merge-duplicates')+',return=representation'},json={'cache_key':k,'payload':p,'updated_at':stamp(),'expires_at':'2036-11-18T00:00:00Z'},timeout=45);r.raise_for_status()
           if create:assert len(r.json())==1,'Already claimed'
          def card():
           r=requests.post('https://content-api.wildberries.ru/content/v2/get/cards/list',headers=wh,json={'settings':{'cursor':{'limit':100},'filter':{'textSearch':'2216111729','withPhoto':-1}}},timeout=45);r.raise_for_status();rows=[c for c in r.json()['cards'] if c['nmID']==2216111729];assert len(rows)==1 and rows[0]['vendorCode']=='6-furcoat-gray';return rows[0]
          def price():
           r=requests.get('https://discounts-prices-api.wildberries.ru/api/v2/list/goods/filter',headers=wh,params={'limit':100,'offset':0,'filterNmID':2216111729},timeout=45);r.raise_for_status();rows=[g for g in r.json()['data']['listGoods'] if g['nmID']==2216111729];assert len(rows)==1;return rows[0]
          def core(c):
           d=copy.deepcopy(c)
           for k in ('photos','updatedAt'):d.pop(k,None)
           d['characteristics']=sorted(d.get('characteristics',[]),key=lambda x:str(x['id']))
           return d
          a=cache(ROOT+':approval');assert a and a['status']=='approved' and a['owner_id']==5122667182 and a['photo_number']==1 and not a['other_content_allowed']
          assert datetime.now(timezone.utc)<datetime.fromisoformat(a['expires_at'])
          assert not cache(ROOT+':execution'),'Prior execution exists; never replay'
          parts=[cache(ROOT+':source:part:'+str(i)) for i in range(3)];assert all(p and p['part']==i for i,p in enumerate(parts))
          b=base64.b64decode(''.join(p['data'] for p in parts),validate=True);assert hashlib.sha256(b).hexdigest()==a['image_sha256']
          im=Image.open(io.BytesIO(b)).convert('RGB');assert im.width>=700 and im.height>=900
          reference=im.resize((192,256))
          before=card();prices=price();assert len(before['photos'])==21
          e={'status':'preflight_verified','created_at':stamp(),'before':before,'prices_before':prices,'image_sha256':a['image_sha256'],'approval_key':ROOT+':approval','wb_writes':0,'telegram_calls':0,'price_writes':0,'advertising_writes':0}
          put(ROOT+':execution',e,True)
          def save():put(ROOT+':execution',e)
          try:
           fresh=card();assert core(fresh)==core(before) and fresh['photos']==before['photos'],'Card changed in preparation'
           assert cache(ROOT+':approval')==a
           e.update(status='submitting',submitted_at=stamp(),wb_writes=1);save()
           r=requests.post('https://content-api.wildberries.ru/content/v3/media/file',headers={**wh,'X-Nm-Id':'2216111729','X-Photo-Number':'1'},files={'uploadfile':('gray6-approved-cover.png',b,'image/png')},timeout=90)
           e['http_status']=r.status_code
           if not r.ok:e.update(status='rejected',response=r.text[:500]);save();r.raise_for_status()
           response=r.json();e['response']=response;assert response.get('error') is False
           e['status']='accepted_pending_readback';save()
           for attempt in range(32):
            time.sleep(15);after=card();e['after']=after;e['readback_at']=stamp();e['attempt']=attempt+1
            e['other_card_fields_unchanged']=core(after)==core(before)
            assert e['other_card_fields_unchanged'],'Non-photo content changed'
            assert len(after['photos'])==len(before['photos']),'Photo count changed'
            e['remaining_photo_urls_unchanged']=after['photos'][1:]==before['photos'][1:];assert e['remaining_photo_urls_unchanged'],'Other photos changed'
            r=requests.get(after['photos'][0]['big'],params={'verify':str(int(time.time()))},timeout=45);r.raise_for_status()
            got=Image.open(io.BytesIO(r.content)).convert('RGB');e['photo_size']=[got.width,got.height]
            difference=sum(ImageStat.Stat(ImageChops.difference(got.resize((192,256)),reference)).mean)/3
            e['mean_pixel_difference']=round(difference,4);save()
            if difference<8:break
           else:raise RuntimeError('Photo not yet confirmed; do not re-upload')
           after_prices=price();assert after_prices==prices,'Price changed'
           e.update(status='verified',verified_at=stamp(),prices_unchanged=True);save()
           event={'record_type':'verified_action','event_id':'owner-fur-cover18-gray6','source_key':ROOT+':execution','started_at':e['submitted_at'],'verified_at':e['verified_at'],'action':{'kind':'main_photo_change','nm_ids':[2216111729],'article':'6-furcoat-gray','before':before['photos'][0]['big'],'after':a['image_sha256']},'evaluation':{'excluded_change_day':'2026-11-18','first_full_day':'2026-11-19','early_review':'2026-11-20','normal_review':'2026-11-22','confounders':['price','promotion','description','main_photo'],'causality':'Combined test, not isolated photo uplift'},'grants_action_permission':False,'telegram_allowed':False}
           put('china_agent:experience:v1:owner-fur-cover18-gray6',event,True)
           tk='china_agent:owner_fur_price_test:2026-11-18:v1:tracking';tracking=cache(tk);assert tracking
           tracking['main_photo_intervention']={'execution_key':ROOT+':execution','verified_at':e['verified_at'],'nm_id':2216111729,'combined_test':True};put(tk,tracking)
           e['reporting_registered']=True;save()
           print(json.dumps({k:e[k] for k in ('status','mean_pixel_difference','prices_unchanged','remaining_photo_urls_unchanged','other_card_fields_unchanged','reporting_registered','telegram_calls')}))
          except Exception as ex:
           if e['status']!='rejected':e['status']='needs_readback' if e['wb_writes'] else 'blocked'
           e['reason']=type(ex).__name__+': '+str(ex)[:240];save();raise
          
