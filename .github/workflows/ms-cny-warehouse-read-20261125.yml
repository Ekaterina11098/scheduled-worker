name: Read warehouse cost balances for currency planning
on:
  push:
    branches: [main]
    paths: ['.github/workflows/ms-cny-warehouse-read-20261125.yml']
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: scripts
      - name: Read warehouse stock and cost without changing MS
        shell: python
        env:
          MOYSKLAD_API_TOKEN: ${{ secrets.MOYSKLAD_API_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: |
          import sys,datetime,concurrent.futures
          from decimal import Decimal,ROUND_HALF_UP
          sys.path.insert(0,'scripts')
          import fbs_document_chain as m
          ROOT='ms_currency_cny_plan:20261125:warehouse_balance:v1:'
          class ReadOnly(m.Transport):
           def request(self,base,path,method='GET',body=None,params=None):
            if base==m.MS and method!='GET':raise m.Stop('MS writes prohibited')
            if base==m.WB:raise m.Stop('WB out of scope')
            return super().request(base,path,method,body,params)
          t=ReadOnly();db=m.Cache(t)
          def rows(path,params=None):
           result=[];offset=0
           while True:
            d=t.request(m.MS,path,params={**(params or {}),'limit':1000,'offset':offset})
            if not isinstance(d.get('rows'),list):raise m.Stop('Incomplete report')
            result.extend(d['rows'])
            size=d.get('meta',{}).get('size')
            if size is not None and len(result)>=size:
             assert len(result)==size
             return result
            if not d['rows']:raise m.Stop('Incomplete pagination')
            offset+=len(d['rows'])
          started=m.now()
          moment=datetime.datetime.now(datetime.timezone(datetime.timedelta(hours=3))).strftime('%Y-%m-%d %H:%M:%S')
          stores=rows('entity/store',{'filter':'archived=false'})+rows('entity/store',{'filter':'archived=true'})
          assert len({s['id'] for s in stores})==len(stores)
          currencies=rows('entity/currency')
          assert all(c.get('isoCode')=='RUB' for c in currencies)
          db.put(ROOT+'manifest',{'status':'reading','started_at':started,'moment_msk':moment,'stores':stores,'currencies':currencies,'ms_writes':0})
          def readstore(s):
           tr=ReadOnly();cache=m.Cache(tr);rr=[];offset=0;size=None
           try:
            while True:
             d=tr.request(m.MS,'report/stock/all',params={'filter':'store='+m.href(s),'moment':moment,'stockMode':'all','quantityMode':'all','limit':1000,'offset':offset})
             batch=d.get('rows')
             if not isinstance(batch,list):raise m.Stop('Incomplete stock report')
             size=d.get('meta',{}).get('size')
             cache.put(ROOT+s['id']+':page:'+str(offset),{'store_id':s['id'],'offset':offset,'moment_msk':moment,'meta':d.get('meta'),'rows':batch,'read_at':m.now()})
             rr.extend(batch)
             if size is not None and len(rr)>=size:
              assert len(rr)==size
              break
             if not batch:raise m.Stop('Incomplete pagination')
             offset+=len(batch)
            D=lambda v:Decimal(str(v or 0))
            missing=[r for r in rr if D(r.get('stock'))!=0 and 'sumTotal' not in r]
            balance=sum((D(r.get('sumTotal')) for r in rr),Decimal(0))
            result={'status':'complete' if not missing else 'missing_cost','store_id':s['id'],'name':s['name'],'archived':s.get('archived',False),'rows':len(rr),'stock':str(sum((D(r.get('stock')) for r in rr),Decimal(0))),'reserve':str(sum((D(r.get('reserve')) for r in rr),Decimal(0))),'in_transit':str(sum((D(r.get('inTransit')) for r in rr),Decimal(0))),'cost_minor_rub':str(balance),'target_cny':str((balance/100/12).quantize(Decimal('.01'),rounding=ROUND_HALF_UP)),'missing_cost_rows':len(missing),'negative_stock_rows':sum(D(r.get('stock'))<0 for r in rr),'nonzero_stock_rows':sum(D(r.get('stock'))!=0 for r in rr),'zero_cost_nonzero_stock_rows':sum(D(r.get('stock'))!=0 and D(r.get('sumTotal'))==0 for r in rr),'moment_msk':moment,'finished_at':m.now(),'ms_writes':0}
           except Exception as e:
            result={'status':'failed','store_id':s['id'],'name':s['name'],'error':str(e),'rows_read':len(rr),'finished_at':m.now(),'ms_writes':0}
           cache.put(ROOT+s['id']+':result',result)
           return result
          with concurrent.futures.ThreadPoolExecutor(max_workers=2) as pool:results=list(pool.map(readstore,stores))
          result={'status':'complete' if all(r['status']=='complete' for r in results) else 'incomplete','started_at':started,'finished_at':m.now(),'moment_msk':moment,'warehouses':results,'ms_writes':0}
          db.put(ROOT+'result',result)
          print('Read-only warehouse balance collection finished; results stored privately; MS unchanged.')
          assert result['status']=='complete'
