name: MS exact linked-order repair tests25Nov
on:
  push:
    paths: ['.github/workflows/stock-ms-order-repair-tests-20261125.yml']
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          repository: Ekaterina11098/VESCHI_AI
          ref: f8f658964a7fb6e9fffe6ea843a91b2ba680b5fa
          token: ${{ secrets.SOURCE_READ_TOKEN }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests==2.32.5 python-dotenv==1.1.1 aiogram==3.22.0 simplejson==4.2.0 'psycopg[binary]==3.2.9' cryptography
      - run: python -m unittest test_stock_ms_exact_order_snapshot test_stock_capacity_prefetch test_stock_cancellation_history_batch test_stock_goods_catalogue test_stock_exact_assortments test_stock_scoped_dispatch test_stock_live_capacity test_stock_all_ip_disabled test_stock_ooo_fallback_return test_stock_ms_customer_order_batch test_stock_temporary_transfer_return test_stock_regular_service test_stock_china_mgt_daily test_stock_belt_common_pool test_stock_cancellation_credit test_stock_unposted_orders test_stock_current_order_reserve test_stock_ms_complete_report
