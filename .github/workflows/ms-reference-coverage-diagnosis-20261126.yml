name: Diagnose exact MS order coverage26Nov
on:
  push:
    paths: ['.github/workflows/ms-reference-coverage-diagnosis-20261126.yml']
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Compare linked order query coverage with direct exact reads
        env:
          MS_TOKEN: ${{ secrets.MOYSKLAD_API_TOKEN }}
        run: |
          python - <<'PY'
          import os,json,urllib.request,urllib.parse,gzip
          base='https://api.moysklad.ru/api/remap/1.2'
          def read(path,params=None):
              url=base+path+('?' + urllib.parse.urlencode(params) if params else '')
              req=urllib.request.Request(url,headers={'Authorization':'Bearer '+os.environ['MS_TOKEN'],'Accept-Encoding':'gzip'})
              with urllib.request.urlopen(req,timeout=30) as r:
                  raw=r.read()
                  if r.headers.get('Content-Encoding')=='gzip':raw=gzip.decompress(raw)
                  return json.loads(raw)
          import concurrent.futures,threading
          flt='updated>=2026-11-25 00:00:00;applicable=true;store='+base+'/entity/store/3c67619d-f25d-11ee-0a80-0c6f000a027a'
          headers=[];size=None
          for offset in range(0,100000,1000):
              data=read('/entity/demand',{'filter':flt,'limit':1000,'offset':offset})
              rows=data.get('rows');current=data.get('meta',{}).get('size')
              assert isinstance(rows,list) and type(current) is int and (size is None or size==current)
              size=current;headers.extend(rows)
              if len(rows)<1000:break
          assert len(headers)==size
          ids=sorted({v['customerOrder']['meta']['href'].rsplit('/',1)[-1] for v in headers if v.get('customerOrder')})
          print(json.dumps({'demands':len(headers),'unique_linked_orders':len(ids)}),flush=True)
          stop=threading.Event()
          def coverage(start):
              if stop.is_set():return
              page=ids[start:start+100];query=';'.join('id='+v for v in page)
              try:
                  value=read('/entity/customerorder',{'filter':query,'limit':1})
                  total=value.get('meta',{}).get('size')
                  if total==len(page):return
                  actual=read('/entity/customerorder',{'filter':query,'limit':len(page)})
                  found={r['id'] for r in actual.get('rows',[])}
                  missing=sorted(set(page)-found);stop.set()
                  print(json.dumps({'offset':start,'requested':len(page),'returned':len(actual.get('rows',[])),'meta_size':actual.get('meta',{}).get('size'),'missing':missing,'extra':sorted(found-set(page))}),flush=True)
                  for ident in missing[:3]:
                      try:
                          row=read('/entity/customerorder/'+ident)
                          print(json.dumps({'direct_id':row.get('id'),'archived':row.get('archived'),'deleted':row.get('deleted')}),flush=True)
                      except Exception as e:
                          print(json.dumps({'direct_id':ident,'status':getattr(e,'code',None),'error_type':type(e).__name__}),flush=True)
              except Exception as e:
                  stop.set();print(json.dumps({'batch_offset':start,'status':getattr(e,'code',None),'error_type':type(e).__name__}),flush=True)
          with concurrent.futures.ThreadPoolExecutor(max_workers=8) as pool:list(pool.map(coverage,range(0,len(ids),100)))
          print(json.dumps({'coverage_mismatch_found':stop.is_set()}),flush=True)
          PY
