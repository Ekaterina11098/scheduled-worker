name: Owner IP OOO minimum test preflight Nov23
on:
  push:
    branches: [main]
    paths: ['.github/workflows/owner-ad-tests23-preflight.yml']
permissions: {contents: read}
concurrency:
  group: owner-ad-tests23-preflight
  cancel-in-progress: false
jobs:
  read:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: /scripts/owner_ad_tests23.py
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install requests==2.32.5
      - name: Read live seller scope, campaigns, minima configuration, wallet and candidate stock
        env:
          WB_TOKEN_1: ${{ secrets.WB_TOKEN_1 }}
          WB_TOKEN_2: ${{ secrets.WB_TOKEN_2 }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: python scripts/owner_ad_tests23.py
