name: OOO requested funding composition read
on:
  push:
    branches: [main]
    paths: ['scripts/ooo_funding_recheck26.py']
permissions: {contents: read}
concurrency:
  group: ooo-requested-funding-composition-read
  cancel-in-progress: false
jobs:
  read:
    runs-on: ubuntu-latest
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false, sparse-checkout: scripts}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install requests==2.32.5 --quiet
      - name: Read exact requested campaign; no delivery credentials
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          WB_TOKEN_1: ${{ secrets.WB_TOKEN_1 }}
        run: python -u scripts/ooo_funding_recheck26.py
