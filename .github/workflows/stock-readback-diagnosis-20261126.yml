name: Read stock uncertainty evidence26Nov
on:
  push:
    paths: ['.github/workflows/stock-readback-diagnosis-20261126.yml']
permissions:
  contents: read
concurrency:
  group: bot-stock
  cancel-in-progress: false
jobs:
  stock:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: |
            content_group_destination.py
            stock_deploy_support.py
            warehouse_id_patch.py
            scripts/moysklad_warehouses.py
          sparse-checkout-cone-mode: false
      - uses: actions/checkout@v4
        with:
          repository: Ekaterina11098/VESCHI_AI
          ref: dfd31571926cff5098900cffb3ac405c660d44a6
          token: ${{ secrets.SOURCE_READ_TOKEN }}
          persist-credentials: false
          path: private-source
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests==2.32.5 python-dotenv==1.1.1 aiogram==3.22.0 simplejson==4.2.0 'psycopg[binary]==3.2.9' cryptography > "$RUNNER_TEMP/daily-install.log" 2>&1
      - name: Fresh stock calculation and newly created stock-only notifications
        env:
          PYTHONPATH: ${{ github.workspace }}/private-source:${{ github.workspace }}
          STOCK_DAILY_ENABLED: 'true'
          STOCK_OZON_ENABLED: 'true'
          STOCK_PENDING_RESERVE_ENABLED: 'true'
          STOCK_CANCELLATION_RESTORE_ENABLED: 'true'
          STOCK_RUN_SLOT: ${{ github.event_name == 'workflow_dispatch' && inputs.slot || ((github.event.schedule == '0 2 * * *' || github.event.schedule == '10,20,30,40,50 2 * * *' || github.event.schedule == '*/10 3-8 * * *') && '0700' || '1630') }}
          STOCK_NOTIFICATIONS_ENABLED: 'true'
          STOCK_CLOUD_EXECUTION_ENABLED: 'true'
          STOCK_JOURNAL_IMPORT_ACCEPTED: 'true'
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          WB_TOKEN_1: ${{ secrets.WB_TOKEN_1 }}
          WB_TOKEN_2: ${{ secrets.WB_TOKEN_2 }}
          WB_TOKEN_3: ${{ secrets.WB_TOKEN_3 }}
          WB_FINANCE_TOKEN_1: ${{ secrets.WB_FINANCE_TOKEN_1 }}
          WB_FINANCE_TOKEN_2: ${{ secrets.WB_FINANCE_TOKEN_2 }}
          WB_FINANCE_TOKEN_3: ${{ secrets.WB_TOKEN_3 }}
          WB_STOCK_WAREHOUSE_1: ${{ vars.WB_STOCK_WAREHOUSE_1 }}
          WB_STOCK_WAREHOUSE_2: ${{ vars.WB_STOCK_WAREHOUSE_2 }}
          WB_STOCK_WAREHOUSE_3: ${{ vars.WB_STOCK_WAREHOUSE_3 }}
          MOYSKLAD_API_TOKEN: ${{ secrets.MOYSKLAD_API_TOKEN }}
          MOYSKLAD_STORE_NAME: МСК
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ALLOWED_CHAT_ID: ${{ secrets.TELEGRAM_ALLOWED_CHAT_ID }}
          AUTO_STOCK_FAIL_FAST: '1'
        run: |
          python warehouse_id_patch.py private-source
          python - <<'PY'
          import time,json,collections
          import stock_deploy_support as support,tg_agent_new as g
          from stock_operation_store import canonical,digest
          g.RUN_DEADLINE=time.monotonic()+500
          api=g.api
          def readonly(method,url,*a,**kw):
              assert method in ('GET','POST')
              return api(method,url,*a,**kw)
          g.api=readonly
          root='technical:stock-daily:2026-11-26:0700'
          with support.runtime_db() as db:
              data=json.loads(db.execute('SELECT snapshot FROM stock_runs WHERE id=%s',(root,)).fetchone()[0])
              rows=[]
              for article,rid in data['registry'].items():
                  for seq,body,state in db.execute('SELECT seq,body,state FROM stock_operations WHERE run=%s ORDER BY seq',(rid,)).fetchall():
                      rows.append(dict(article=article,run=rid,seq=seq,state=state,body=json.loads(body)))
          groups=collections.defaultdict(list)
          for row in rows:
              b=row['body']
              assert b['cabinet']<3
              groups[(b['cabinet'],b['location']['warehouse'])].append(row)
          for (cab,wh),items in groups.items():
              values=g.get_real_wb_stocks(g.cabinet_tokens()[cab],[r['body']['location']['chrtId'] for r in items],wh)
              for row in items:
                  row.update(actual=values[row['body']['location']['chrtId']],observed_at=time.time())
          from stock_unposted_source import wb_units
          from datetime import datetime,timezone
          recent=wb_units(g,2,[2126188],datetime.now(timezone.utc),days=1)
          for row in rows:
              if row['state']!='uncertain':continue
              with support.runtime_db() as db:
                  sent=db.execute("SELECT max(at) FROM stock_events WHERE run=%s AND seq=%s AND state='sent'",(row['run'],row['seq'])).fetchone()[0]
              row['orders_after_dispatch']=[u for u in recent if u['article']==row['article'] and datetime.fromisoformat(u['created_at'].replace('Z','+00:00')).timestamp()>sent]
          result=dict(complete=True,root=root,rows=rows,observed_at=time.time(),stock_writes=0)
          with support.runtime_db() as db:
              db.execute('INSERT INTO stock_runs VALUES(%s,%s,%s,%s,%s,%s) ON CONFLICT(id) DO UPDATE SET snapshot=excluded.snapshot',('technical:stock-readback-diagnosis:2026-11-26',canonical(result),'{}',digest({}),'technical-no-executor',time.time()))
          print(json.dumps(dict(complete=True,rows=len(rows),uncertain=sum(r['state']=='uncertain' for r in rows),matched=sum(r['actual']==r['body']['target'] for r in rows),stock_writes=0)))
          PY
