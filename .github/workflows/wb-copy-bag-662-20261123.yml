name: Copy Wildberries bag card 662
on:
  push:
    branches: [ops/wb-copy-bag-662-20261123]
    paths: [.github/workflows/wb-copy-bag-662-20261123.yml]
permissions: {}
concurrency: wb-copy-bag-662
jobs:
  copy:
    if: github.run_attempt == 1 && github.event.head_commit.message == 'Check brand mentions in bag 662 description'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - shell: python
        env:
          CHINA: ${{ secrets.WB_TOKEN_3 }}
        run: |
          import json, os, re, time
          from urllib.error import HTTPError
          from urllib.request import Request, urlopen

          def api(region, token, path, body):
              request = Request(f'https://content-api.wildberries.{region}{path}',
                                data=json.dumps(body).encode(),
                                headers={'Authorization': token, 'Content-Type': 'application/json'})
              try:
                  with urlopen(request, timeout=30) as response:
                      return json.load(response)
              except HTTPError as exc:
                  raise RuntimeError(f'{region} {path}: HTTP {exc.code}') from None

          def cards(region, token, search):
              cursor = {'limit': 100}
              seen = set()
              result = []
              while True:
                  data = api(region, token, '/content/v2/get/cards/list',
                             {'settings': {'cursor': cursor, 'filter': {'withPhoto': -1, **({'textSearch': search} if search else {})}}})
                  result.extend(data['cards'])
                  page = data['cursor']
                  if page['total'] < cursor['limit']:
                      return result
                  marker = (page['updatedAt'], page['nmID'])
                  if marker in seen:
                      raise RuntimeError('Repeated catalog cursor')
                  seen.add(marker)
                  cursor.update(updatedAt=marker[0], nmID=marker[1])

          import unicodedata

          china = os.environ['CHINA']
          code = '662-CelineaBag-blue'
          def select(items):
              return [c for c in items if c['nmID'] == 2342818446 and c['vendorCode'] == code]
          found = select(cards('cn', china, code))
          if not found:
              found = select(cards('cn', china, None))
          if len(found) != 1:
              raise SystemExit('Expected one destination card')
          card = found[0]
          normalize = lambda value: unicodedata.normalize('NFKC', value).casefold()
          brand = card.get('brand', '').strip()
          description = card.get('description', '')
          if not brand:
              raise SystemExit('Brand field empty')
          pattern = r'[\s\W_]*'.join(re.escape(c) for c in normalize(brand) if c.isalnum())
          hits = list(re.finditer(r'(?<!\w)' + pattern + r'(?!\w)', normalize(description)))
          print('Checked card:', card['nmID'], 'brand:', brand, 'description length:', len(description))
          print('Brand mentions:', len(hits))
          for hit in hits:
              print('Matched text:', hit.group())
