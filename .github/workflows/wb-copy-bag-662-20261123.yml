name: Copy Wildberries bag card 662
on:
  push:
    branches: [ops/wb-copy-bag-662-20261123]
    paths: [.github/workflows/wb-copy-bag-662-20261123.yml]
permissions: {}
concurrency: wb-copy-bag-662
jobs:
  copy:
    if: github.run_attempt == 1 && github.event.head_commit.message == 'Locate and clear brand and description on bag 662'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - shell: python
        env:
          CHINA: ${{ secrets.WB_TOKEN_3 }}
        run: |
          import json, os, re, time
          from urllib.error import HTTPError
          from urllib.request import Request, urlopen

          def api(region, token, path, body):
              request = Request(f'https://content-api.wildberries.{region}{path}',
                                data=json.dumps(body).encode(),
                                headers={'Authorization': token, 'Content-Type': 'application/json'})
              try:
                  with urlopen(request, timeout=30) as response:
                      return json.load(response)
              except HTTPError as exc:
                  raise RuntimeError(f'{region} {path}: HTTP {exc.code}') from None

          def cards(region, token, search):
              cursor = {'limit': 100}
              seen = set()
              result = []
              while True:
                  data = api(region, token, '/content/v2/get/cards/list',
                             {'settings': {'cursor': cursor, 'filter': {'withPhoto': -1, **({'textSearch': search} if search else {})}}})
                  result.extend(data['cards'])
                  page = data['cursor']
                  if page['total'] < cursor['limit']:
                      return result
                  marker = (page['updatedAt'], page['nmID'])
                  if marker in seen:
                      raise RuntimeError('Repeated catalog cursor')
                  seen.add(marker)
                  cursor.update(updatedAt=marker[0], nmID=marker[1])

          import unicodedata

          china = os.environ['CHINA']
          code = '662-CelineaBag-blue'
          def select(items):
              return [c for c in items if c['nmID'] == 2342818446 and c['vendorCode'].casefold() == code.casefold()]
          def locate():
              for search in (code, '2342818446', '662', None):
                  found = select(cards('cn', china, search))
                  if found:
                      return found
              return []
          for attempt in range(5):
              found = locate()
              if found:
                  break
              time.sleep(6)
          if len(found) != 1:
              raise SystemExit('Expected one destination card')
          card = found[0]
          def preserved(c):
              return (c['title'], c['subjectID'],
                      {k:v for k,v in c['dimensions'].items() if k != 'isValid'},
                      {a['id']:a['value'] for a in c['characteristics']},
                      [(s['chrtID'], s.get('techSize', ''), s.get('wbSize', ''), s['skus']) for s in c['sizes']],
                      c.get('photos') or [], c.get('video') or '')
          def cleared(c):
              return (c.get('brand', '').strip().casefold() in ('', 'без бренда') and
                      not c.get('description', '').strip())
          if cleared(card):
              print('Brand and description already empty:', card['nmID'])
              raise SystemExit(0)
          payload = {k:card[k] for k in ('nmID', 'vendorCode', 'title')}
          payload.update(brand='', description='')
          payload['dimensions'] = {k:v for k,v in card['dimensions'].items() if k != 'isValid'}
          payload['characteristics'] = [{k:a[k] for k in ('id', 'value')} for a in card['characteristics']]
          payload['sizes'] = [{k:s[k] for k in ('chrtID', 'techSize', 'wbSize', 'skus') if k in s}
                              for s in card['sizes']]
          result = api('cn', china, '/content/v2/cards/update', [payload])
          if result.get('error'):
              print('Wildberries update error:', result.get('errorText'))
              raise SystemExit(1)
          print('Wildberries accepted update')
          for attempt in range(14):
              time.sleep(12)
              current = select(cards('cn', china, code)) or select(cards('cn', china, '2342818446'))
              if current and cleared(current[0]):
                  if preserved(current[0]) != preserved(card):
                      raise SystemExit('Another field changed')
                  print('Verified:', card['nmID'], 'brand:', repr(current[0].get('brand', '')),
                        'description length:', len(current[0].get('description', '')),
                        'characteristics:', len(current[0]['characteristics']),
                        'barcodes:', [s['skus'] for s in current[0]['sizes']],
                        'photos:', len(current[0].get('photos') or []))
                  break
          else:
              if not current:
                  current = select(cards('cn', china, None))
              if current:
                  print('Final brand:', repr(current[0].get('brand', '')),
                        'description length:', len(current[0].get('description', '')))
              raise SystemExit('Update not verified')
