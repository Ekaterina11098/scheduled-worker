name: Align selected invoice and source chain currency references
on:
  push:
    branches: [main]
    paths: ['.github/workflows/cny-invoice-order-demand-align.yml']
permissions:
  contents: read
concurrency:
  group: ms-cny-selected-chain
  cancel-in-progress: false
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: scripts
      - name: Align selected invoice source references
        env:
          MOYSKLAD_API_TOKEN: ${{ secrets.MOYSKLAD_API_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: python scripts/cny_invoice_order_demand_align.py
