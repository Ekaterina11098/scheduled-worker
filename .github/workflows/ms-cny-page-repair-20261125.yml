name: Reconcile missing read-only document page
on:
  push:
    branches: [main]
    paths: ['.github/workflows/ms-cny-page-repair-20261125.yml']
permissions:
  contents: read
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: scripts
      - name: Verify and save missing page privately
        shell: python
        env:
          MOYSKLAD_API_TOKEN: ${{ secrets.MOYSKLAD_API_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: |
          import sys,time,collections,concurrent.futures
          from decimal import Decimal,ROUND_HALF_UP
          sys.path.insert(0,'scripts')
          import fbs_document_chain as m
          ROOT='ms_currency_cny_plan:20261125:detail:v1:'
          TYPES=["cashin","cashout","commissionreportin","commissionreportout","customerorder","demand","enter","facturein","factureout","internalorder","invoicein","invoiceout","loss","move","paymentin","paymentout","prepayment","prepaymentreturn","purchaseorder","purchasereturn","retailsalesreturn","retaildemand","retaildrawercashin","retaildrawercashout","retireorder","salesreturn","supply"]
          FIN={'cashin','cashout','paymentin','paymentout','prepayment','prepaymentreturn','retaildrawercashin','retaildrawercashout'}
          class ReadOnly(m.Transport):
           def request(self,base,path,method='GET',body=None,params=None):
            if base==m.MS and method!='GET':raise m.Stop('Planning only; MS writes prohibited')
            if base==m.WB:raise m.Stop('WB out of scope')
            return super().request(base,path,method,body,params)
          def D(v):return Decimal(str(v or 0))
          def R(v):return v.quantize(Decimal('1'),rounding=ROUND_HALF_UP)
          def save(db,key,value):
           for i in range(5):
            try:db.put(ROOT+key,value);return
            except Exception:
             try:
              if db.get(ROOT+key)==value:return
             except Exception:pass
             if i==4:raise
             time.sleep(2+i)
          t=ReadOnly();db=m.Cache(t)
          curr=t.request(m.MS,'entity/currency',params={'limit':1000})
          codes={m.href(c):c.get('isoCode') for c in curr['rows']}
          assert curr['meta']['size']==len(curr['rows'])
          save(db,'currencies',curr)
          save(db,'status',{'status':'running','started_at':m.now(),'ms_writes':0,'RUB_per_CNY':12})
          
          def process_docs(typ,docs):
           t=ReadOnly();stat=collections.defaultdict(int);stat['sample_issues']=[]
           source=Decimal(0);target=Decimal(0);diffsum=Decimal(0);output=[]
           for d in docs:
            old=D(d.get('sum'));goal=R(old/12);source+=old;target+=goal
            iso=codes.get(m.href(d.get('rate',{}).get('currency',{})),'UNKNOWN')
            stat['missing_currency']+=int(iso=='UNKNOWN')
            stat['non_rub']+=int(iso not in ('RUB','UNKNOWN'))
            stat['rounding_total_docs']+=int(old/12!=goal)
            rec={'id':d['id'],'name':d.get('name'),'type':typ,'moment':d.get('moment'),'updated':d.get('updated'),'sum_minor':str(old),'proposed_sum_minor':str(goal),'currency':iso,'applicable':d.get('applicable'),'organization':m.href(d.get('organization',{})),'vatEnabled':d.get('vatEnabled'),'vatIncluded':d.get('vatIncluded'),'positions':0,'issues':[]}
            pp=d.get('positions');positions=[]
            if isinstance(pp,dict):
             expected=pp.get('meta',{}).get('size')
             if 'rows' in pp:positions=list(pp['rows'])
             while expected is not None and len(positions)<expected:
              extra=t.request(m.MS,'entity/'+typ+'/'+d['id']+'/positions',params={'limit':1000,'offset':len(positions)})
              if not extra.get('rows'):raise m.Stop('Incomplete positions')
              positions.extend(extra['rows'])
             if expected is None or len(positions)!=expected:
              stat['missing_positions_docs']+=1;rec['issues'].append('positions_unverified')
            rec['positions']=len(positions);stat['positions']+=len(positions)
            if positions:
             orig=Decimal(0);new=Decimal(0);priceissues=[]
             for p in positions:
              price=D(p.get('price'));converted=R(price/12)
              qty=D(p.get('quantity'));disc=D(p.get('discount'))
              factor=(Decimal(100)-disc)/100
              vatfactor=Decimal(1)
              if d.get('vatEnabled') and not d.get('vatIncluded') and p.get('vatEnabled',True):vatfactor+=D(p.get('vat'))/100
              orig+=R(price*qty*factor*vatfactor);new+=R(converted*qty*factor*vatfactor)
              if price/12!=converted:
               stat['rounding_price_positions']+=1
               priceissues.append({'position_id':p.get('id'),'assortment':m.href(p.get('assortment',{})),'quantity':str(qty),'price_minor':str(price),'proposed_price_minor':str(converted),'discount':str(disc),'vat':p.get('vat')})
             rec.update(original_model_minor=str(orig),proposed_lines_minor=str(new),line_vs_total_diff_minor=str(new-goal),rounding_positions=priceissues)
             if orig!=old:stat['original_model_mismatch_docs']+=1;rec['issues'].append('original_line_model_differs')
             if new!=goal:
              stat['line_vs_total_diff_docs']+=1;diffsum+=new-goal
              rec['issues'].append('rounded_lines_vs_rounded_document')
            operations=d.get('operations')
            if typ in FIN:
             links=[]
             for op in operations or []:
              if 'linkedSum' not in op:stat['linked_sum_missing']+=1;continue
              amount=D(op['linkedSum'])
              links.append({'href':m.href(op),'linked_minor':str(amount),'proposed_linked_minor':str(R(amount/12))})
             rec['payment_links']=links
             stat['financial_links']+=len(links)
             alloc=sum((D(x['linked_minor']) for x in links),Decimal(0));newalloc=sum((D(x['proposed_linked_minor']) for x in links),Decimal(0))
             rec.update(allocated_minor=str(alloc),proposed_allocated_minor=str(newalloc),unallocated_minor=str(old-alloc),proposed_unallocated_minor=str(goal-newalloc),allocation_rounding_diff_minor=str(newalloc-R(alloc/12)))
             if newalloc!=R(alloc/12):stat['financial_allocation_rounding_docs']+=1;rec['issues'].append('allocation_rounding')
            for k in ('customerOrder','purchaseOrder','demand','supply','salesReturn','purchasereturn','invoiceIn','invoiceOut'):
             if isinstance(d.get(k),dict):rec[k]=m.href(d[k])
            if rec['issues'] and len(stat['sample_issues'])<10:stat['sample_issues'].append({'id':d['id'],'name':d.get('name'),'issues':rec['issues']})
            output.append(rec)
          
           return output
          
          diagnostic={'type':'customerorder','offset':7100,'status':'reading','errors':[],'ms_writes':0}
          save(db,'repair_7100',diagnostic)
          for attempt in range(6):
           try:
            data=t.request(m.MS,'entity/customerorder',params={'limit':100,'offset':7100,'order':'id,asc','expand':'positions'})
            assert data['meta']['size']==38529 and len(data['rows'])==100
            out=[]
            for d in data['rows']:
             try:out.extend(process_docs('customerorder',[d]))
             except Exception as e:
              diagnostic['errors'].append({'id':d['id'],'error':str(e) if isinstance(e,m.Stop) else type(e).__name__})
              raise
            save(db,'customerorder:page:7100',{'type':'customerorder','offset':7100,'records':out,'read_at':m.now()})
            diagnostic.update(status='complete',documents=len(out),finished_at=m.now())
            save(db,'repair_7100',diagnostic)
            print('Missing read-only page verified and saved privately.')
            break
           except Exception as e:
            diagnostic['errors'].append({'attempt':attempt+1,'error':str(e) if isinstance(e,m.Stop) else type(e).__name__})
            save(db,'repair_7100',diagnostic)
            if attempt==5:
             diagnostic.update(status='failed',finished_at=m.now());save(db,'repair_7100',diagnostic)
             raise
            time.sleep(3*(attempt+1))
          
