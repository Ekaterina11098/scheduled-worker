name: China hourly sales API read
on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_call:
    secrets:
      SUPABASE_URL: {required: true}
      SUPABASE_SECRET_KEY: {required: true}
      WB_TOKEN_3: {required: true}
      OPENAI_API_KEY: {required: false}
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/china-hourly-sales-read.yml']
permissions: {contents: read}
concurrency:
  group: china-hourly-sales-read
  cancel-in-progress: false
jobs:
  read:
    outputs:
      source_ready: ${{ steps.collect.outputs.source_ready }}
    if: ${{ github.event_name != 'push' || github.event.head_commit.message == 'Connect China hourly read-only API collection' || github.event.head_commit.message == 'Repair China hourly read-only collection with deduplicated fallback' }}
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /scripts/
            /.github/
            /*request*.json
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install requests==2.32.5
      - name: Verify windows, pagination, money and no-write guard
        run: python scripts/test_china_hourly_sales_read.py
      - name: Verify saved-only analysis, scope and deduplication
        run: python scripts/test_china_hourly_saved_analysis.py
      - name: Verify independent recovery clock and duplicate prevention
        run: node --test scripts/test_china_hourly_clock.mjs
      - name: Collect private dated API snapshots; no marketplace writes or Telegram
        id: collect
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          WB_TOKEN_3: ${{ secrets.WB_TOKEN_3 }}
        run: python scripts/china_hourly_sales_read.py

  analyze:
    needs: read
    if: ${{ needs.read.outputs.source_ready == 'true' }}
    # Owner25Nov: analyze only a complete exact-hour source; no model, WB or Telegram access.
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1
          sparse-checkout: scripts
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install requests==2.32.5
      - name: Analyze frozen hourly evidence without external actions
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          WB_TOKEN_3: ""
          CHINA_TELEGRAM_BOT_TOKEN: ""
          OPENAI_API_KEY: ""
        run: python scripts/china_hourly_saved_analysis.py
