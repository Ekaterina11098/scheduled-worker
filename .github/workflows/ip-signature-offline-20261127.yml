name: IP approved PNG signature offline regression
on:
  push:
    branches: [main]
    paths: ['.github/workflows/ip-signature-offline-20261127.yml']
  workflow_dispatch:
permissions: {contents: read}
concurrency:
  group: ip-signature-offline-20261127
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 9eabfaf3fdacf6b0328f8630d92af3ae8014f93d
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*.py
      - uses: actions/checkout@v4
        with:
          repository: Ekaterina11098/VESCHI_AI
          ref: dfa9651d7f18589ca1c8a1c8de020774be963261
          token: ${{ secrets.SOURCE_READ_TOKEN }}
          persist-credentials: false
          path: private-source
      - name: Apply isolated IP rules review
        uses: actions/checkout@v4
        with:
          ref: 9c5888e8ddc79bd4d62ee86444ac54d55ba28c4b
          path: ip-rules-patch
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /ip_daily_png_contract.py
            /ip_report_analysis.py
            /test_ip_report_analysis.py
            /test_ip_plan_digest.py
      - name: Install reviewed rules module
        run: |
          cp ip-rules-patch/ip_daily_png_contract.py ip-rules-patch/ip_report_analysis.py ip-rules-patch/test_ip_report_analysis.py ip-rules-patch/test_ip_plan_digest.py .
          cp ip-rules-patch/ip_daily_png_contract.py ip-rules-patch/ip_report_analysis.py private-source/
      - name: Apply campaign scope reconciliation
        uses: actions/checkout@v4
        with:
          ref: 22b202d06e3480f8ed526377be158fb42ad979b2
          path: ip-scope-patch
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /ip_report_freeze.py
            /ip_campaign_table_png.py
            /ip_scheduled_source.py
            /test_ip_catalog_scope.py
      - name: Install reviewed scope reconciliation
        run: |
          cp ip-scope-patch/ip_report_freeze.py ip-scope-patch/ip_scheduled_source.py ip-scope-patch/test_ip_catalog_scope.py .
          cp ip-scope-patch/ip_campaign_table_png.py .
          cp ip-scope-patch/ip_campaign_table_png.py private-source/
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install requests==2.32.5 cryptography==46.0.2 Pillow==12.3.0 > "$RUNNER_TEMP/dependencies.log" 2>&1
      - name: Offline economic, scope, budget and dedup regression
        run: python -m unittest test_ip_cloud_dialog test_ip_report_analysis test_full_retained_review test_ip_restrictions test_ip_catalog_scope test_ip_plan_digest
