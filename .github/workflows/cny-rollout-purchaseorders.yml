name: Convert all purchase orders to CNY
on:
  push:
    branches: [main]
    paths: ['.github/workflows/cny-rollout-purchaseorders.yml']
permissions:
  contents: read
concurrency:
  group: ms-cny-document-rollout
  cancel-in-progress: false
jobs:
  convert:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: scripts
      - name: Convert authorized purchase orders and verify each batch
        env:
          MOYSKLAD_API_TOKEN: ${{ secrets.MOYSKLAD_API_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: python scripts/cny_document_rollout.py purchaseorder
