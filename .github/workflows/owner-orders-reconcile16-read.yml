name: Owner order ID reconciliation16
on:
  push:
    branches: [main]
    paths: [.github/workflows/owner-orders-reconcile16-read.yml]
permissions: {contents: read}
concurrency:
  group: bot-mpstats-data
  cancel-in-progress: false
jobs:
  read:
    if: github.run_attempt == 1 && github.event.head_commit.message == '[owner-orders-reconcile16] Read exact three-day order RID timestamps and statuses'
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /scripts/
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install requests==2.32.5
      - env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          WB_TOKEN_3: ${{ secrets.WB_TOKEN_3 }}
          MOYSKLAD_API_TOKEN: ${{ secrets.MOYSKLAD_API_TOKEN }}
          OPENAI_API_KEY: ''
        run: python scripts/owner_orders_reconcile16_read.py
