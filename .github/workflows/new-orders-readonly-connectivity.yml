name: New orders - MoySklad read-only connectivity

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/new-orders-readonly-connectivity.yml

permissions:
  contents: read

concurrency:
  group: new-orders-readonly-connectivity
  cancel-in-progress: false

jobs:
  verify:
    if: >-
      github.run_attempt == 1 &&
      github.event.head_commit.message == 'diagnostic: one-time MoySklad gzip read check 2026-11-16'
    name: Verify MoySklad read only
    runs-on: ubuntu-latest
    timeout-minutes: 4
    env:
      MOYSKLAD_API_TOKEN: ${{ secrets.MOYSKLAD_API_TOKEN }}
    steps:
      - name: Read one MoySklad product
        shell: bash
        run: |
          python3 - <<'PY'
          import gzip
          import json
          import os
          import sys
          import urllib.error
          import urllib.request

          token = os.environ.get("MOYSKLAD_API_TOKEN", "")
          if not token:
              print("MOYSKLAD: NOT_CHECKED (secret missing)")
              sys.exit(1)
          request = urllib.request.Request(
              "https://api.moysklad.ru/api/remap/1.2/entity/product?limit=1",
              method="GET",
              headers={
                  "Authorization": "Bearer " + token,
                  "Accept": "application/json;charset=utf-8",
                  "Accept-Encoding": "gzip",
              },
          )
          try:
              with urllib.request.urlopen(request, timeout=25) as response:
                  if response.status != 200:
                      print(f"MOYSKLAD: HTTP {response.status}")
                      sys.exit(1)
                  raw = response.read(1048576)
                  if response.headers.get("Content-Encoding", "").lower() == "gzip":
                      raw = gzip.decompress(raw)
                  payload = json.loads(raw)
                  rows = payload.get("rows") if isinstance(payload, dict) else None
                  if not isinstance(rows, list):
                      print("MOYSKLAD: HTTP 200, unexpected JSON structure")
                      sys.exit(1)
                  print(f"MOYSKLAD: HTTP 200, records={len(rows)}, read_only=verified")
          except urllib.error.HTTPError as error:
              print(f"MOYSKLAD: HTTP {error.code} (body suppressed)")
              sys.exit(1)
          except Exception as error:
              print(f"MOYSKLAD: {type(error).__name__} (details suppressed)")
              sys.exit(1)
          PY
