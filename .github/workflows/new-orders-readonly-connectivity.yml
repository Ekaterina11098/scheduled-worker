name: SKU 159 errors read
on:
  push:
    branches: [main]
    paths: ['.github/workflows/new-orders-readonly-connectivity.yml']
permissions:
  contents: read
jobs:
  read:
    if: >-
      github.event.head_commit.message == 'diagnostic: 159 WB error details 20261119'
    runs-on: ubuntu-latest
    timeout-minutes: 4
    env:
      WB_TOKEN_3: ${{ secrets.WB_TOKEN_3 }}
    steps:
      - name: Read WB card processing errors
        shell: python
        run: |
          import os,json,gzip,urllib.request,urllib.error
          req=urllib.request.Request("https://content-api.wildberries.cn/content/v2/cards/error/list",headers={"Authorization":os.environ["WB_TOKEN_3"],"Content-Type":"application/json","Accept-Encoding":"gzip"},data=json.dumps({"cursor":{"limit":100},"order":{"ascending":False}}).encode(),method="POST")
          with urllib.request.urlopen(req,timeout=25) as x:
           raw=x.read()
           if x.headers.get("Content-Encoding")=="gzip":raw=gzip.decompress(raw)
           d=json.loads(raw)
          v=d.get("data")
          print("DATA_TYPE",type(v).__name__,"DATA_KEYS",sorted(v) if isinstance(v,dict) else "")
          if isinstance(v,dict):
           for k,items in v.items():
            print("KEY",k,"TYPE",type(items).__name__,"COUNT",len(items) if hasattr(items,"__len__") else "")
            txt=json.dumps(items,ensure_ascii=False)
            if "159-CelineaBag" in txt or "2129309883" in txt:
             print("TARGET_CONTEXT",k,txt[:2200])
          print("RESP_ERROR",d.get("error"),str(d.get("errorText"))[:120])
          
