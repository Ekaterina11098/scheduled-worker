name: One-off SKU 159 schema read
on:
  push:
    branches: [main]
    paths: ['.github/workflows/new-orders-readonly-connectivity.yml']
permissions:
  contents: read
jobs:
  inspect:
    if: >-
      github.event.head_commit.message == 'diagnostic: 159 WB schema 20261119'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      WB_TOKEN_3: ${{ secrets.WB_TOKEN_3 }}
    steps:
      - name: Read target card schema
        shell: python
        run: |
          import os,json,urllib.request,gzip
          token=os.environ["WB_TOKEN_3"]
          req=urllib.request.Request("https://content-api.wildberries.cn/content/v2/get/cards/list",data=json.dumps({"settings":{"filter":{"withPhoto":-1,"textSearch":"159-CelineaBag-coffee"},"cursor":{"limit":100}}}).encode(),method="POST",headers={"Authorization":token,"Content-Type":"application/json","Accept-Encoding":"gzip"})
          with urllib.request.urlopen(req,timeout=30) as r:
           raw=r.read()
           if r.headers.get("Content-Encoding")=="gzip":raw=gzip.decompress(raw)
           data=json.loads(raw)
          cards=[c for c in data.get("cards",[]) if c.get("nmID")==2129309883 and c.get("vendorCode")=="159-CelineaBag-coffee"]
          print("EXACT_MATCHES",len(cards))
          if len(cards)!=1:raise SystemExit(1)
          c=cards[0]
          print("TOP_KEYS",sorted(c))
          print("SIZE_KEYS",[sorted(s) for s in c.get("sizes",[])])
          print("DIM_KEYS",sorted(c.get("dimensions",{})))
          print("CHARACTERISTICS",[(x.get("id"),x.get("name"),x.get("value")) for x in c.get("characteristics",[])])
          print("BRAND",repr(c.get("brand")),"SUBJECTID",c.get("subjectID"),"DOCUMENTS",bool(c.get("documents")),"TAGS",bool(c.get("tags")))
          
