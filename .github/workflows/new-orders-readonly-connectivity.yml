name: SKU 159 WB post-update readback
on:
  push:
    branches: [main]
    paths: ['.github/workflows/new-orders-readonly-connectivity.yml']
permissions:
  contents: read
jobs:
  verify:
    if: >-
      github.event.head_commit.message == 'diagnostic: WB 159 post update status 20261119'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      WB_TOKEN_3: ${{ secrets.WB_TOKEN_3 }}
    steps:
      - name: Check status and errors (read only)
        shell: python
        run: |
          import os,json,gzip,urllib.request,urllib.error
          token=os.environ["WB_TOKEN_3"]
          base="https://content-api.wildberries.cn"
          def get(endpoint,body):
           req=urllib.request.Request(base+endpoint,headers={"Authorization":token,"Content-Type":"application/json","Accept-Encoding":"gzip"},method="POST",data=json.dumps(body).encode())
           with urllib.request.urlopen(req,timeout=30) as resp:
            raw=resp.read()
            if resp.headers.get("Content-Encoding")=="gzip":raw=gzip.decompress(raw)
            return json.loads(raw)
          for article in ["159-CelineaBag-coffee","159-CelineaBag-darkchocolate"]:
           try:
            d=get("/content/v2/get/cards/list",{"settings":{"filter":{"withPhoto":-1,"textSearch":article},"cursor":{"limit":100}}})
            cc=[c for c in d.get("cards",[]) if c.get("vendorCode")==article]
            print("CURRENT",article,"count",len(cc))
            for c in cc:
             print("CARD",c.get("nmID"),"skus",[s.get("skus") for s in c.get("sizes",[])],"colors",[v.get("value") for v in c.get("characteristics",[]) if v.get("id")==14177449])
           except Exception as e:print("CARD_READ_ERROR",type(e).__name__,getattr(e,"code",""))
          try:
           d=get("/content/v2/cards/error/list",{"cursor":{"limit":100},"order":{"ascending":False}})
           print("ERROR_LIST_KEYS",sorted(d))
           batches=d.get("data",[])
           print("ERROR_BATCHES",len(batches) if isinstance(batches,list) else type(batches).__name__)
           for b in batches if isinstance(batches,list) else []:
            as_text=json.dumps(b,ensure_ascii=False)
            if "159-CelineaBag" in as_text or "2129309883" in as_text:
             print("TARGET_ERROR",as_text[:1500])
          except Exception as e:print("ERROR_LIST_FAILURE",type(e).__name__,getattr(e,"code",""))
          
