name: Retire superseded24Nov stock reader
on:
  push:
    paths: ['.github/workflows/stock-retire-old-reader-20261124.yml']
permissions:
  actions: write
  contents: read
jobs:
  cancel:
    runs-on: ubuntu-latest
    steps:
      - name: Cancel exact superseded run so repaired continuation can acquire stock lease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import os,json,urllib.request
          base='https://api.github.com/repos/Ekaterina11098/scheduled-worker/actions/runs/45458560224'
          headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'}
          r=json.load(urllib.request.urlopen(urllib.request.Request(base,headers=headers)))
          assert r['name']=='Stock daily 05:00 and 20:00 MSK'
          if r['status'] not in ('completed',):
              urllib.request.urlopen(urllib.request.Request(base+'/cancel',data=b'',headers=headers,method='POST')).read()
          print(json.dumps({'run':r['id'],'status_before':r['status'],'action':'retire_superseded_version'}))
          PY
