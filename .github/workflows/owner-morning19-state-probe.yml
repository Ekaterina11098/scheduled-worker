name: Owner morning report state transport probe
on:
  push:
    branches: [main]
    paths: [.github/workflows/owner-morning19-state-probe.yml]
permissions: {}
jobs:
  probe:
    if: github.run_attempt == 1 && github.event.head_commit.message == '[morning19-state] Diagnose exact cached report update'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install --quiet requests==2.32.5
      - env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        shell: python
        run: |
          import os,json,requests,time
          from datetime import datetime,timezone
          base=os.environ['SUPABASE_URL'].rstrip('/')+'/rest/v1/telegram_api_cache'
          secret=os.environ['SUPABASE_SECRET_KEY'];h={'apikey':secret,'Content-Type':'application/json'}
          if not secret.startswith('sb_secret_'):h['Authorization']='Bearer '+secret
          key='china_agent:advertising_source:2026-11-19:v2'
          r=requests.get(base,params={'cache_key':'eq.'+key,'select':'payload,updated_at'},headers=h,timeout=90);r.raise_for_status();row=r.json()[0]
          body=json.dumps(row,ensure_ascii=False,separators=(',',':')).encode()
          started=time.time()
          response=requests.post(os.environ['SUPABASE_URL'].rstrip('/')+'/rest/v1/rpc/china_advertising_report_state_v1',headers=h,data=json.dumps({'p_key':key,'p_payload':row['payload'],'p_create':False},ensure_ascii=False,separators=(',',':')).encode(),timeout=(10,90))
          value={'status':'diagnosed','http_status':response.status_code,'response':response.text[:1500],'request_bytes':len(body),'elapsed':time.time()-started,'wb_writes':0,'telegram_calls':0,'observed_at':datetime.now(timezone.utc).isoformat()}
          r=requests.post(base+'?on_conflict=cache_key',headers={**h,'Prefer':'resolution=merge-duplicates'},json={'cache_key':'china_agent:morning_state_probe:2026-11-19:v2','payload':value,'updated_at':value['observed_at'],'expires_at':'2026-12-19T00:00:00Z'},timeout=45);r.raise_for_status()
          print(json.dumps({'http_status':response.status_code,'request_bytes':len(body),'elapsed':value['elapsed']}))
