name: Move Guangzhou stock2373413 to2393088 by owner command26Nov
on:
  push:
    paths: ['.github/workflows/stock-gz-migration-20261126.yml']
permissions:
  contents: read
concurrency:
  group: bot-stock
  cancel-in-progress: false
jobs:
  stock:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: |
            content_group_destination.py
            stock_deploy_support.py
            warehouse_id_patch.py
            scripts/moysklad_warehouses.py
          sparse-checkout-cone-mode: false
      - uses: actions/checkout@v4
        with:
          repository: Ekaterina11098/VESCHI_AI
          ref: 40c6a7ef4a34f7ecb739578091e26af1295e55da
          token: ${{ secrets.SOURCE_READ_TOKEN }}
          persist-credentials: false
          path: private-source
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests==2.32.5 python-dotenv==1.1.1 aiogram==3.22.0 simplejson==4.2.0 'psycopg[binary]==3.2.9' cryptography > "$RUNNER_TEMP/daily-install.log" 2>&1
      - name: Fresh stock calculation and newly created stock-only notifications
        env:
          PYTHONPATH: ${{ github.workspace }}/private-source:${{ github.workspace }}
          STOCK_DAILY_ENABLED: 'true'
          STOCK_OZON_ENABLED: 'true'
          STOCK_PENDING_RESERVE_ENABLED: 'true'
          STOCK_CANCELLATION_RESTORE_ENABLED: 'true'
          STOCK_RUN_SLOT: ${{ github.event_name == 'workflow_dispatch' && inputs.slot || ((github.event.schedule == '0 2 * * *' || github.event.schedule == '10,20,30,40,50 2 * * *' || github.event.schedule == '*/10 3-8 * * *') && '0700' || '1630') }}
          STOCK_NOTIFICATIONS_ENABLED: 'true'
          STOCK_CLOUD_EXECUTION_ENABLED: 'true'
          STOCK_JOURNAL_IMPORT_ACCEPTED: 'true'
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          WB_TOKEN_1: ${{ secrets.WB_TOKEN_1 }}
          WB_TOKEN_2: ${{ secrets.WB_TOKEN_2 }}
          WB_TOKEN_3: ${{ secrets.WB_TOKEN_3 }}
          WB_FINANCE_TOKEN_1: ${{ secrets.WB_FINANCE_TOKEN_1 }}
          WB_FINANCE_TOKEN_2: ${{ secrets.WB_FINANCE_TOKEN_2 }}
          WB_FINANCE_TOKEN_3: ${{ secrets.WB_TOKEN_3 }}
          WB_STOCK_WAREHOUSE_1: ${{ vars.WB_STOCK_WAREHOUSE_1 }}
          WB_STOCK_WAREHOUSE_2: ${{ vars.WB_STOCK_WAREHOUSE_2 }}
          WB_STOCK_WAREHOUSE_3: ${{ vars.WB_STOCK_WAREHOUSE_3 }}
          MOYSKLAD_API_TOKEN: ${{ secrets.MOYSKLAD_API_TOKEN }}
          MOYSKLAD_STORE_NAME: МСК
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ALLOWED_CHAT_ID: ${{ secrets.TELEGRAM_ALLOWED_CHAT_ID }}
          AUTO_STOCK_FAIL_FAST: '1'
        run: |
          python warehouse_id_patch.py private-source
          python - <<'PY'
          import os,time,json,math
          import stock_deploy_support as support,tg_agent_new as g
          import stock_guangzhou_relocate_20261126 as migration
          from stock_operation_store import Store,canonical,digest,Stopped
          from stock_execution_fence import cloud_writer
          from stock_shared_requests import SharedRequests
          from stock_storage_health import verify_runtime_storage
          g.RUN_DEADLINE=time.monotonic()+3300
          g.STOCK_FURCOAT_ENABLED=True
          os.environ['STOCK_STORAGE_PROOF_FILE']=os.path.join(os.environ['RUNNER_TEMP'],'guangzhou-migration-proof.json')
          os.environ['STOCK_STORAGE_PROOF_SCOPE']=migration.ROOT
          with cloud_writer(support.runtime_db()):
              with support.runtime_db() as db:
                  store=Store(db,postgres=True)
                  shared=SharedRequests(store,budget=g.check_run_budget)
                  g.STOCK_SHARED_ORDERS=shared;g.STOCK_REQUEST_GATE=shared
                  g._CACHE_GET=shared.get;g._CACHE_SET=shared.put
                  key='technical:gz-migration-storage-proof:2026-11-26'
                  def write(value):
                      with store.transaction():store.sql('INSERT INTO stock_runs VALUES(?,?,?,?,?,?) ON CONFLICT(id) DO UPDATE SET snapshot=excluded.snapshot',(key,canonical(value),'{}',digest({}),'technical-no-executor',time.time()))
                  def read():
                      value=store.sql('SELECT snapshot FROM stock_runs WHERE id=?',(key,)).fetchone();db.commit()
                      return json.loads(value[0])
                  verify_runtime_storage(write,read,dict(scope=migration.ROOT,nonce=os.urandom(16).hex()))
                  for attempt in range(12):
                      try:
                          result=migration.publish(g,store)
                          print(json.dumps(dict(status=result['status'],complete=result['execution_complete'],old_warehouse=migration.FROM,new_warehouse=migration.TO,units=result.get('transferred_units'),positive_sizes=result.get('transferred_sizes'),held_by_capacity=result.get('held_by_capacity'))),flush=True)
                          break
                      except Exception as e:
                          wait=getattr(e,'wait',0)
                          asynchronous='waiting for WB readback' in str(e)
                          print(json.dumps(dict(attempt=attempt+1,error_type=type(e).__name__,error=str(e),readback_wait=asynchronous,provider_wait=wait)),flush=True)
                          if attempt==11 or not (asynchronous or wait):raise
                          delay=max(30,math.ceil(wait))
                          while delay>0:
                              part=min(30,delay);g.check_run_budget();time.sleep(part);delay-=part
          PY
