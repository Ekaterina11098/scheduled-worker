name: Verify bag feedback and sales
on:
  push:
    branches: [ops/wb-check-zont-123-20261123]
    paths: [.github/workflows/check-bag-ratings-sales-20261123.yml]
permissions: {}
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - shell: python
        env:
          WB: ${{ secrets.WB_TOKEN_3 }}
        run: |
          import urllib.request,os,json,gzip,base64,subprocess,time
          from pathlib import Path
          from collections import defaultdict
          from concurrent.futures import ThreadPoolExecutor
          from datetime import datetime, timedelta
          ids=["1473243902","1473245510","1473243453","1473244355","1473244000","1594309320","1473243091","1473245492","1473243440","1594295903","1473244359","1473243907","1473243827","1473245506","1473244341","1473242587","1473244360","1473244353","1473244344","1473243447","1473243445","1473243455","1473242578","1473244354","1473243909","1473243239","1473244989"]
          token=os.environ['WB']
          def get(url):
              for k in range(4):
                  try:
                      with urllib.request.urlopen(urllib.request.Request(url,headers={'Authorization':token}),timeout=35) as f:
                          return json.load(f)
                  except Exception as e:
                      code=getattr(e,'code',None)
                      if code not in (429,500,502,503,504) or k==3:
                          return {'error':code or type(e).__name__}
                      time.sleep(3*(k+1))
          def reviews(n):
              rows={}
              errors={}
              counts={}
              for a in ('true','false'):
                  d=get(f'https://feedbacks-api.wildberries.ru/api/v1/feedbacks?isAnswered={a}&take=100&skip=0&nmId={n}')
                  dd=d.get('data') or {}
                  if not dd and d.get('error'): errors[a]=d['error']
                  counts[a]=[dd.get('countArchive'),dd.get('countUnanswered')]
                  for x in dd.get('feedbacks') or []:
                      if str(x.get('productDetails',{}).get('nmId'))!=n:continue
                      rows[x['id']]=[x.get('productValuation'),x.get('createdDate'),str(x.get('text') or '')[:500],str(x.get('pros') or '')[:300],str(x.get('cons') or '')[:300],len(x.get('photoLinks') or []),bool(x.get('video'))]
              return [list(rows.values()),errors,counts]
          def sales():
              d=get('https://statistics-api.wildberries.ru/api/v1/supplier/sales?dateFrom=2026-11-09&flag=0')
              if isinstance(d,dict): return d
              summary={n:defaultdict(lambda:[0,0]) for n in ids}
              for x in d:
                  n=str(x.get('nmId'))
                  date=str(x.get('date') or '')[:10]
                  sid=str(x.get('saleID') or '')
                  if n not in summary or not '2026-11-09'<=date<='2026-11-22':continue
                  if sid.startswith('S'): summary[n][date][0]+=1
                  if sid.startswith('R'): summary[n][date][1]+=1
              return {'received':len(d),'by_day':summary}
          with ThreadPoolExecutor(max_workers=3) as pool:
              sell=pool.submit(sales)
              rr=dict(zip(ids,pool.map(reviews,ids)))
              result={'reviews':rr,'sales':sell.result()}
          Path('/tmp/review_pub.pem').write_text("-----BEGIN PUBLIC KEY-----\r\nMIIBIjANBgkqhkiG9w0BAQEFAAOCAQ8AMIIBCgKCAQEA6qqxdhFzZ8DguEH28C05\r\nbHPNQOQMGy+i3rRSMJ3BgnSVNtY+TIU2cvEBZ3rMRSxShzaZpLBnagQ/0ySO/82L\r\nCxGcg/sLOSoDD9f0H+D0TdlAvkRn61y2ADBRc+CODMUttKzPfYG/Ot36zSpCpYJ7\r\nOqUxF3TiSANIsaF6wo/Qfsv3lXk7WYIEenN9/h0EK+6bAQYYqOKKT5zsvjL9mlVj\r\nyOWLtk+mK3UQbsaoBlFoi1HKQhPVBcO1GdHOyCEv5dhTSHUccTtXNweYhzyGSzeY\r\nZvDuzR52qWuW9rK9YkqdBuENx0ect1rIbqDzjU59syBI5SaVDmCOKRtBGwy7CTvB\r\nyQIDAQAB\r\n-----END PUBLIC KEY-----")
          raw=gzip.compress(json.dumps(result,ensure_ascii=False).encode())
          for i in range(0,len(raw),180):
              cipher=subprocess.check_output(['openssl','pkeyutl','-encrypt','-pubin','-inkey','/tmp/review_pub.pem','-pkeyopt','rsa_padding_mode:oaep','-pkeyopt','rsa_oaep_md:sha256'],input=raw[i:i+180])
              print('REV_ENCRYPTED',base64.b64encode(cipher).decode())
