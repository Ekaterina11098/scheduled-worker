name: Celinea362 read-only care verification16Nov
on:
  push:
    branches: [main]
    paths: ['.github/workflows/celinea362-care-readback-20261116.yml']
permissions: {}
concurrency:
  group: celinea362-media
  cancel-in-progress: false
jobs:
  upload:
    if: github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install --quiet requests==2.32.5 pillow==11.3.0
      - name: Upload exact approved order and verify content
        env:
          WB_TOKEN_3: ${{ secrets.WB_TOKEN_3 }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        shell: python
        run: |
          import os,json,time,base64,hashlib,io
          from datetime import datetime,timezone
          from urllib.parse import quote
          import requests
          from PIL import Image,ImageChops,ImageStat
          sb=os.environ['SUPABASE_URL'].rstrip('/')
          sk=os.environ['SUPABASE_SECRET_KEY']
          sh={'apikey':sk,'Authorization':'Bearer '+sk,'Content-Type':'application/json'}
          wh={'Authorization':os.environ['WB_TOKEN_3']}
          host='https://content-api.wildberries.cn'
          nm=2245828239;article='362-CelineaBag-black'
          key='celinea_care_corrected:362:20261116:readback:v2'
          def stamp():return datetime.now(timezone.utc).isoformat()
          def cache(k):
           r=requests.get(sb+'/rest/v1/telegram_api_cache',headers=sh,params={'cache_key':'eq.'+k,'select':'payload'},timeout=40);r.raise_for_status()
           rows=r.json();return rows[0]['payload'] if rows else None
          def put(e):
           r=requests.post(sb+'/rest/v1/telegram_api_cache?on_conflict=cache_key',headers={**sh,'Prefer':'resolution=merge-duplicates,return=minimal'},json={'cache_key':key,'payload':e,'updated_at':stamp(),'expires_at':'2099-01-01T00:00:00Z'},timeout=40);r.raise_for_status()
          if cache(key):raise SystemExit('Execution exists; no replay')
          def card():
           cur={'limit':100}
           for page in range(40):
            r=requests.post(host+'/content/v2/get/cards/list',headers=wh,json={'settings':{'cursor':cur,'filter':{'withPhoto':-1}}},timeout=45);r.raise_for_status();j=r.json()
            cs=[c for c in j.get('cards',[]) if c.get('vendorCode')==article]
            if cs:
             assert len(cs)==1 and cs[0]['nmID']==nm,'Identity mismatch'
             return cs[0]
            cu=j.get('cursor',{})
            if cu.get('total',0)<100:break
            cur={'limit':100,'updatedAt':cu['updatedAt'],'nmID':cu['nmID']};time.sleep(0.7)
           raise RuntimeError('Exact card missing from full pagination')
          def core(c):
           d={k:v for k,v in c.items() if k not in ('photos','video','updatedAt')}
           d['characteristics']=sorted(d.get('characteristics',[]),key=lambda x:str(x['id']))
           return d
          current=card()
          prior=cache('celinea_care_corrected:362:20261116:v1:execution')
          assert prior and prior.get('before')
          result={'status':'read','wb_writes':0,'article':article,'observed_at':stamp(),'after':current,'non_media_unchanged':core(current)==core(prior['before']),'photo_count':len(current.get('photos',[]))}
          refs=[]
          for source in ['celinea_media:362:20261116:owner_shape_v2:07','celinea_care_corrected:362:20261116:v1:07']:
           p=cache(source);assert p
           refs.append(Image.open(io.BytesIO(base64.b64decode(p['data']))).convert('RGB'))
          if len(current.get('photos',[]))==8:
           r=requests.get(current['photos'][6]['big'],params={'verify':str(int(time.time()))},timeout=40);r.raise_for_status()
           live=Image.open(io.BytesIO(r.content)).convert('RGB').resize(refs[0].size)
           box=(70,320,705,775)
           scores=[round(sum(ImageStat.Stat(ImageChops.difference(live.crop(box),ref.crop(box))).mean)/3,4) for ref in refs]
           result['care_text_difference_old_corrected']=scores
           result['corrected_applied']=scores[1]<scores[0] and scores[1]<12
          put(result)
          print('Read-only verification saved')
