name: Normalize incoming currency references and verify quantities
on:
  push:
    branches: [main]
    paths: ['.github/workflows/cny-incoming-refs-apply.yml']
permissions:
  contents: read
concurrency:
  group: ms-cny-selected-chain
  cancel-in-progress: false
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: scripts
      - name: Normalize incoming currency references
        env:
          MOYSKLAD_API_TOKEN: ${{ secrets.MOYSKLAD_API_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: python scripts/cny_incoming_refs_apply.py

# Resume from verified private checkpoints; never replay prior intents.
