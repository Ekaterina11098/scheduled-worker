name: OOO exact umbrella archive once
on:
  push:
    branches: [main]
    paths: ['scripts/ooo_umbrella_archive16.py', '.github/workflows/ooo-umbrella-archive16.yml']
permissions: {contents: read}
concurrency:
  group: ooo-token1-owner-writes
  cancel-in-progress: false
jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false, sparse-checkout: scripts}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install requests==2.32.5 --quiet
      - env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          WB_TOKEN_1: ${{ secrets.WB_TOKEN_1 }}
        run: python -u scripts/ooo_umbrella_archive16.py
