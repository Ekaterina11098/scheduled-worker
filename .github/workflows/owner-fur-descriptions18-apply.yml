name: Owner fur6-7 approved descriptions API only
on:
  push:
    branches: [main]
    paths: [.github/workflows/owner-fur-descriptions18-apply.yml]
permissions: {}
concurrency:
  group: bot-mpstats-data
  cancel-in-progress: false
jobs:
  apply:
    if: github.run_attempt == 1 && github.event.head_commit.message == '[owner-fur-descriptions18] Apply approved descriptions only, no Telegram'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install --quiet requests==2.32.5
      - name: Preserve card fields, update two descriptions, verify WB and register test
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          WB_TOKEN_3: ${{ secrets.WB_TOKEN_3 }}
        shell: python
        run: |
          import os,json,time,copy,hashlib
          from datetime import datetime,timezone,timedelta
          import requests
          ROOT='china_agent:owner_fur_description18'
          DRAFT='china_agent:shared_memory:v1:work:note:fur6-7-semantic-final-drafts-owner-review-20261118'
          IDS={2216111729:'6-furcoat-gray',2216167898:'7-furcoat-black'}
          sb=os.environ['SUPABASE_URL'].rstrip('/')
          sk=os.environ['SUPABASE_SECRET_KEY']
          sh={'apikey':sk,'Authorization':'Bearer '+sk,'Content-Type':'application/json'}
          wh={'Authorization':os.environ['WB_TOKEN_3']}
          def stamp():return datetime.now(timezone.utc).isoformat()
          def db(method,key,p=None,create=False):
           url=sb+'/rest/v1/telegram_api_cache'
           params={'cache_key':'eq.'+key,'select':'payload'} if method=='GET' else {'on_conflict':'cache_key'}
           headers=dict(sh)
           if method!='GET':headers['Prefer']='resolution='+('ignore-duplicates' if create else 'merge-duplicates')+',return=representation'
           r=requests.request(method,url,headers=headers,params=params,json=None if method=='GET' else {'cache_key':key,'payload':p,'updated_at':stamp(),'expires_at':'2036-11-18T00:00:00Z'},timeout=45)
           r.raise_for_status();rows=r.json()
           if method=='GET':return rows[0]['payload'] if rows else None
           if create:assert len(rows)==1,'Already claimed; no replay'
           return p
          def get(k):return db('GET',k)
          def put(k,p):db('POST',k,p)
          def create(k,p):db('POST',k,p,True)
          def wb(path,body=None,params=None,host='content-api.wildberries.ru'):
           r=requests.request('POST' if body is not None else 'GET','https://'+host+path,headers=wh,json=body,params=params,timeout=45)
           r.raise_for_status();j=r.json();assert not j.get('error'),str(j)[:200];return j
          def card(nm):
           j=wb('/content/v2/get/cards/list',{'settings':{'cursor':{'limit':100},'filter':{'textSearch':str(nm),'withPhoto':-1}}})
           rows=[c for c in j['cards'] if c['nmID']==nm]
           assert len(rows)==1 and rows[0]['vendorCode']==IDS[nm],'Exact identity not found'
           return rows[0]
          def price(nm):
           j=wb('/api/v2/list/goods/filter',params={'limit':100,'offset':0,'filterNmID':nm},host='discounts-prices-api.wildberries.ru')
           rows=[c for c in j['data']['listGoods'] if c['nmID']==nm];assert len(rows)==1;return rows[0]
          def stable(c):
           d=copy.deepcopy(c)
           for k in ('description','updatedAt'):d.pop(k,None)
           d['characteristics']=sorted(d.get('characteristics',[]),key=lambda x:str(x['id']))
           return d
          def sha(s):return hashlib.sha256(s.encode()).hexdigest()
          approval=get(ROOT+':approval')
          assert approval and approval['status']=='approved' and approval['owner_id']==5122667182
          assert datetime.now(timezone.utc)<datetime.fromisoformat(approval['expires_at'])
          drafts=approval['drafts'];assert drafts==get(DRAFT)['drafts'] and set(drafts)=={str(n) for n in IDS}
          assert approval['description_only'] and not any(approval[k] for k in ('telegram_allowed','advertising_allowed','price_allowed'))
          if get(ROOT+':execution'):raise SystemExit('Prior execution exists: read back, never replay')
          before={str(n):card(n) for n in IDS}
          prices={str(n):price(n) for n in IDS}
          payload=[]
          for n in IDS:
           c=before[str(n)]
           assert c.get('description') and c.get('characteristics') and c.get('sizes') and c.get('dimensions')
           p={k:copy.deepcopy(c[k]) for k in ('nmID','vendorCode','brand','title','dimensions','characteristics','sizes') if k in c}
           for k in ('kizMarked',):
            if k in c:p[k]=c[k]
           p['dimensions']={k:v for k,v in p['dimensions'].items() if k in ('length','width','height','weightBrutto')}
           p['characteristics']=[{k:x[k] for k in ('id','value')} for x in p['characteristics']]
           p['sizes']=[{k:s[k] for k in ('chrtID','techSize','wbSize','skus') if k in s} for s in p['sizes']]
           p['description']=drafts[str(n)]
           assert 1000<len(p['description'])<5000 and 'тёплой зимы' in p['description']
           payload.append(p)
          e={'status':'preflight_verified','created_at':stamp(),'before':before,'prices_before':prices,'request':payload,'approval_key':ROOT+':approval','wb_writes':0,'price_writes':0,'advertising_writes':0,'telegram_calls':0,'model_calls':0}
          create(ROOT+':execution',e)
          def save():put(ROOT+':execution',e)
          try:
           assert get(ROOT+':approval')==approval,'Approval changed'
           for n in IDS:assert stable(card(n))==stable(before[str(n)]),'Content changed in preflight'
           if all(before[str(n)]['description']==drafts[str(n)] for n in IDS):
            e['status']='already_at_target';e['submitted_at']=stamp()
           else:
            e.update(status='submitting',submitted_at=stamp(),wb_writes=1);save()
            response=wb('/content/v2/cards/update',payload)
            e.update(status='accepted_pending_readback',response=response);save()
           for attempt in range(24):
            time.sleep(15)
            after={str(n):card(n) for n in IDS}
            e.update(after=after,observed_at=stamp(),readback_attempt=attempt+1)
            if not all(stable(after[str(n)])==stable(before[str(n)]) for n in IDS):
             e['changed_non_description_fields']={str(n):[k for k in set(stable(after[str(n)]))|set(stable(before[str(n)])) if stable(after[str(n)]).get(k)!=stable(before[str(n)]).get(k)] for n in IDS}
             raise AssertionError('Non-description content differs; inspect private receipt')
            exact={str(n):after[str(n)].get('description')==drafts[str(n)] for n in IDS}
            e['description_exact']=exact;save()
            if all(exact.values()):break
           else:raise RuntimeError('Description readback not yet complete; do not replay')
           after_prices={str(n):price(n) for n in IDS}
           e['prices_after']=after_prices
           assert after_prices==prices,'Price readback differs'
           at=stamp();e.update(status='verified',verified_at=at,prices_unchanged=True,other_card_fields_unchanged=True,description_sha256={str(n):sha(drafts[str(n)]) for n in IDS});save()
           for n in IDS:
            event={'record_type':'verified_action','event_id':'fur-description18-'+str(n),'source_key':ROOT+':execution','started_at':e['submitted_at'],'verified_at':at,'action':{'kind':'description_change','nm_ids':[n],'article':IDS[n],'before':sha(before[str(n)]['description']),'after':sha(drafts[str(n)])},'evaluation':{'excluded_change_day':'2026-11-18','first_full_day':'2026-11-19','early_review':'2026-11-20','normal_review':'2026-11-22','normal_completed_days':3,'concurrent_changes':['price','promotion','description'],'causality':'Combined test: cannot attribute results to description or price alone'},'grants_action_permission':False,'telegram_allowed':False}
            k='china_agent:experience:v1:owner-fur-description18-'+str(n)
            prior=get(k)
            if prior is None:create(k,event)
            else:assert prior['source_key']==event['source_key']
           tracking_key='china_agent:owner_fur_price_test:2026-11-18:v1:tracking'
           tracking=get(tracking_key);assert tracking
           tracking['description_intervention']={'execution_key':ROOT+':execution','verified_at':at,'nm_ids':list(IDS),'causality':'Price, promotion and descriptions changed same MSK day; report combined outcome, not isolated causal uplift','first_complete_msk_day':'2026-11-19','first_early_review_msk_day':'2026-11-20','normal_review_msk_day':'2026-11-22'}
           put(tracking_key,tracking)
           e['reporting_registered']=True;save()
           print(json.dumps({'status':e['status'],'description_exact':e['description_exact'],'prices_unchanged':True,'wb_writes':e['wb_writes'],'telegram_calls':0}))
          except Exception as ex:
           e.update(status='needs_readback' if e['wb_writes'] else 'blocked',reason=type(ex).__name__+': '+str(ex)[:220]);save();raise
          
