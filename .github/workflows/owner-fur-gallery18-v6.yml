name: Owner gray6 gallery v6 photo slots only
on:
  push:
    branches: [main]
    paths: [.github/workflows/owner-fur-gallery18-v6.yml]
permissions: {}
concurrency:
  group: bot-mpstats-data
  cancel-in-progress: false
jobs:
  apply:
    if: github.run_attempt == 1 && github.event.head_commit.message == '[owner-fur-gallery18-v6] Approved eleven photo slots preserve video'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install --quiet requests==2.32.5 pillow==11.3.0
      - name: Apply approved photo slots with unchanged video
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          WB_TOKEN_3: ${{ secrets.WB_TOKEN_3 }}
        shell: python
        run: |
          import os,json,time,base64,hashlib,io
          from datetime import datetime,timezone
          import requests
          from PIL import Image,ImageChops,ImageStat
          ROOT='china_agent:owner_fur_gallery18_v6'
          sb=os.environ['SUPABASE_URL'].rstrip('/');sk=os.environ['SUPABASE_SECRET_KEY']
          sh={'apikey':sk,'Authorization':'Bearer '+sk,'Content-Type':'application/json'};wh={'Authorization':os.environ['WB_TOKEN_3']}
          def stamp():return datetime.now(timezone.utc).isoformat()
          def cache(k):
           r=requests.get(sb+'/rest/v1/telegram_api_cache',headers=sh,params={'cache_key':'eq.'+k,'select':'payload'},timeout=45);r.raise_for_status();rows=r.json();return rows[0]['payload'] if rows else None
          def put(k,p,create=False):
           r=requests.post(sb+'/rest/v1/telegram_api_cache?on_conflict=cache_key',headers={**sh,'Prefer':'resolution='+('ignore-duplicates' if create else 'merge-duplicates')+',return=representation'},json={'cache_key':k,'payload':p,'updated_at':stamp(),'expires_at':'2036-11-18T00:00:00Z'},timeout=45);r.raise_for_status()
           if create:assert len(r.json())==1,'Already claimed; no replay'
          def card():
           r=requests.post('https://content-api.wildberries.ru/content/v2/get/cards/list',headers=wh,json={'settings':{'cursor':{'limit':100},'filter':{'textSearch':'2216111729','withPhoto':-1}}},timeout=45);r.raise_for_status();rows=[c for c in r.json()['cards'] if c['nmID']==2216111729];assert len(rows)==1 and rows[0]['vendorCode']=='6-furcoat-gray';return rows[0]
          def price():
           r=requests.get('https://discounts-prices-api.wildberries.ru/api/v2/list/goods/filter',headers=wh,params={'limit':100,'offset':0,'filterNmID':2216111729},timeout=45);r.raise_for_status();rows=[g for g in r.json()['data']['listGoods'] if g['nmID']==2216111729];assert len(rows)==1;return rows[0]
          def stable(c):
           return {k:c.get(k) for k in ('nmID','vendorCode','title','description','brand','video','characteristics','dimensions')}
          a=cache(ROOT+':approval');assert a and a['status']=='approved' and a['nm_id']==2216111729 and a['preserve_video']
          assert datetime.now(timezone.utc)<datetime.fromisoformat(a['expires_at'])
          assert not cache(ROOT+':execution'),'Execution exists; do not replay'
          sources=[]
          for i in range(1,12):
           p=cache(ROOT+':source:'+str(i));assert p and p['slot']==i
           b=base64.b64decode(p['data'],validate=True);assert hashlib.sha256(b).hexdigest()==p['sha256']
           im=Image.open(io.BytesIO(b)).convert('RGB');assert im.size==(1086,1448)
           sources.append((p,b,im.resize((192,256))))
          assert [p['source_slide'] for p,b,im in sources]==[2,1,3,4,5,6,7,8,9,10,11]
          before=card();prices=price();assert len(before['photos'])==21 and before.get('video')
          e={'status':'preflight_verified','created_at':stamp(),'before':before,'prices_before':prices,'approval_key':ROOT+':approval','slots':[],'wb_writes':0,'telegram_calls':0,'price_writes':0,'advertising_writes':0,'method':'media/file only; no media/save; old surplus removal separate UI step'}
          put(ROOT+':execution',e,True)
          def save():put(ROOT+':execution',e)
          try:
           assert stable(card())==stable(before),'Card changed before submission'
           for p,b,reference in sources:
            assert cache(ROOT+':approval')==a
            step={'slot':p['slot'],'source_slide':p['source_slide'],'sha256':p['sha256'],'status':'submitting','submitted_at':stamp()}
            e['slots'].append(step);e.update(status='submitting',wb_writes=e['wb_writes']+1);save()
            r=requests.post('https://content-api.wildberries.ru/content/v3/media/file',headers={**wh,'X-Nm-Id':'2216111729','X-Photo-Number':str(p['slot'])},files={'uploadfile':('gray6-v6-'+str(p['slot'])+'.jpg',b,'image/jpeg')},timeout=90)
            step['http_status']=r.status_code
            if not r.ok:step.update(status='rejected',response=r.text[:500]);save();r.raise_for_status()
            step['response']=r.json();assert step['response'].get('error') is False
            step['status']='accepted';save();time.sleep(10)
           e['status']='accepted_pending_readback';save();time.sleep(30)
           for attempt in range(8):
            after=card();e.update(after=after,readback_at=stamp(),attempt=attempt+1)
            assert after.get('video')==before['video'],'Video mismatch; stop'
            assert stable(after)==stable(before),'Other content mismatch; stop'
            assert len(after['photos'])==21,'Unexpected photo count'
            matches=[]
            for p,b,reference in sources:
             r=requests.get(after['photos'][p['slot']-1]['big'],params={'verify':str(int(time.time()))},timeout=45);r.raise_for_status()
             got=Image.open(io.BytesIO(r.content)).convert('RGB').resize((192,256))
             difference=sum(ImageStat.Stat(ImageChops.difference(got,reference)).mean)/3
             matches.append({'slot':p['slot'],'mean_pixel_difference':round(difference,4),'matches':difference<8})
            e['photo_verification']=matches;save()
            if all(m['matches'] for m in matches):break
            time.sleep(30)
           else:raise RuntimeError('Readback pending; no re-upload')
           assert price()==prices,'Price mismatch'
           e.update(status='photo_slots_verified_pending_surplus_removal',photo_slots_verified_at=stamp(),video_unchanged=True,other_content_unchanged=True,prices_unchanged=True);save()
           print(json.dumps({'status':e['status'],'verified_slots':11,'video_unchanged':True,'telegram_calls':0}))
          except Exception as ex:
           e['status']='needs_readback_no_replay';e['reason']=type(ex).__name__+': '+str(ex)[:250];save();raise
