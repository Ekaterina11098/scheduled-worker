name: Recover WB ООО 320452931 exact 2 items in yuan
on:
  push:
    branches: [main]
    paths: ['.github/workflows/recover-ooo-320452931.yml']
permissions:
  contents: read
concurrency:
  group: fbs-document-chain-production
  cancel-in-progress: false
jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate exact original WB ООО pick list and post MS CNY chain with duplicate and stock safeguards
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          MOYSKLAD_API_TOKEN: ${{ secrets.MOYSKLAD_API_TOKEN }}
          WB_TOKEN_3: ${{ secrets.WB_TOKEN_1 }}
          FBS_EXECUTION_KIND: manual
          FBS_OWNER_APPROVAL_ID: ooo-320452931-20261126
        run: python scripts/recover_ooo_320452931.py
