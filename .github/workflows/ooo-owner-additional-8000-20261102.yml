name: Owner OOO approved additional 8000 KGS topups
on:
  push:
    branches: [main]
    paths: ['.github/workflows/ooo-owner-additional-8000-20261102.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: wb-ooo-advertising-owner
  cancel-in-progress: false
jobs:
  execute:
    if: github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false, sparse-checkout: scripts}
      - uses: actions/checkout@v4
        with:
          repository: Ekaterina11098/VESCHI_AI
          ref: d9590af00baa6ce80598945f8009700e04a4c96e
          token: ${{ secrets.SOURCE_READ_TOKEN }}
          persist-credentials: false
          path: private-source
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install requests==2.32.5
      - run: python -m py_compile scripts/ooo_owner_additional_8000_20261102.py
      - name: Execute exact owner-approved OOO scope with durable no-replay journal
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          WB_TOKEN_1: ${{ secrets.WB_TOKEN_1 }}
        run: python scripts/ooo_owner_additional_8000_20261102.py
