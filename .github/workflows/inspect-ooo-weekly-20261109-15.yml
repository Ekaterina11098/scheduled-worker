name: Inspect requested OOO weekly report November 9-15
on:
  push:
    branches: [main]
    paths: [".github/workflows/inspect-ooo-weekly-20261109-15.yml"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: inspect-ooo-weekly-20261109-15
  cancel-in-progress: false
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: scripts
      - name: Read products stock and historical return bases
        shell: python
        env:
          MOYSKLAD_API_TOKEN: ${{ secrets.MOYSKLAD_API_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: |
          import sys,json,collections,datetime as dt,decimal,hashlib
          from decimal import Decimal,ROUND_FLOOR,ROUND_HALF_UP
          sys.path.insert(0,"scripts")
          import fbs_document_chain as m
          t=m.Transport();db=m.Cache(t);w=m.Worker(t,db,{})
          ROOT="weekly_report_review:ooo:20261109_20261115:"
          req=db.get(ROOT+"request:v1") or {}
          assert req.get("source_requests_authorized") is True and req.get("writes_authorized") is True
          proof=db.get(ROOT+"source_proof:v1");inp=db.get(ROOT+"input:v1");p=db.get(ROOT+"prepare:v1")
          assert proof.get("pagination_exhausted") is True and inp.get("source_complete") is True and p.get("source_complete") is True
          assert p["status"]=="prepared" and not any(p[k] for k in ("stock_exceptions","missing_basis","missing_costs","duplicates"))
          assert (dt.datetime.now(dt.timezone.utc)-m.stamp(p["completed_at"])).total_seconds()<1800
          assert not db.get(ROOT+"execution:v1"),"Prior execution must be reconciled"
          assert db.claim(ROOT+"execution_claim:v1",{"at":m.now(),"run":__import__("os").environ["GITHUB_RUN_ID"]}),"Execution already claimed"
          out={"status":"checking","at":m.now(),"documents":{}}
          def save():db.put(ROOT+"execution:v1",out)
          def norm(x):return m.href(x).split("?")[0]
          def api(path,method="GET",body=None,params=None):return t.request(m.MS,path,method,body,params)
          def ps(kind,ident,stock=False):
           result=[];offset=0
           while True:
            d=api("entity/"+kind+"/"+ident+"/positions",params={"expand":"assortment","fields":"stock" if stock else "", "limit":50,"offset":offset})
            result+=d["rows"];offset+=len(d["rows"])
            if offset>=d["meta"]["size"]:return result
            assert d["rows"]
          def comp(rows):
           c=collections.Counter()
           for r in rows:c[norm(r["assortment"])]+=r["quantity"]
           return c
          def verify(kind,d,wanted,basis=None):
           live=api("entity/"+kind+"/"+d["id"]);pos=ps(kind,d["id"])
           assert live["applicable"] is True and live["sum"]==0 and all(x["price"]==0 for x in pos)
           assert comp(pos)==wanted
           for k in ("organization","agent","store"):assert norm(live[k])==norm(p[k])
           if basis:assert norm(live[basis[0]])==norm(basis[1])
           return live
          def ensure(kind,body):
           ext=hashlib.sha256((ROOT+kind+body.get("description","")).encode()).hexdigest()[:40]
           body["externalCode"]=ext
           def find():return w.ms_rows("entity/"+kind,{"filter":"externalCode="+ext})
           existing=find();assert len(existing)<=1
           if existing:return existing[0]
           save()
           try:return api("entity/"+kind,"POST",body)
           except Exception:
            existing=find()
            if len(existing)==1:return existing[0]
            raise
          try:
           org=api("entity/organization/"+p["organization"]["id"]);agent=api("entity/counterparty/"+p["agent"]["id"]);store=api("entity/store/"+p["store"]["id"])
           assert all(norm(a)==norm(b) and a["name"]==b["name"] for a,b in ((org,p["organization"]),(agent,p["agent"]),(store,p["store"])))
           moment=dt.datetime.now(dt.timezone(dt.timedelta(hours=3))).strftime("%Y-%m-%d %H:%M:%S")
           wanted={norm(p["products"][a][0]):q for a,q in inp["sales"].items()}
           for at in (None,moment):
            pars={"filter":"store="+norm(store)+";stockMode=all;quantityMode=all"}
            if at:pars["moment"]=at
            stocks={norm(x):x for x in w.ms_rows("report/stock/all",pars)}
            shortages=[{"article":a,"needed":q,"stock":stocks.get(norm(p["products"][a][0]),{}).get("stock",0),"available":stocks.get(norm(p["products"][a][0]),{}).get("quantity",0)} for a,q in inp["sales"].items() if min(stocks.get(norm(p["products"][a][0]),{}).get("stock",0),stocks.get(norm(p["products"][a][0]),{}).get("quantity",0))<q]
            if shortages:out.update(status="insufficient_stock",shortages=shortages);save();raise m.Stop("Stock check blocked")
           bases=collections.defaultdict(dict)
           for a,q in inp["returns"].items():bases[p["basis"][a]["id"]][a]=q
           templates={}
           for ident,articles in bases.items():
            demand=api("entity/demand/"+ident);assert demand["applicable"]
            for k in ("organization","agent","store"):assert norm(demand[k])==norm(p[k])
            available=comp(ps("demand",ident))
            for ref in demand.get("returns",[]):
             rd=api(norm(ref)[len(m.MS):])
             if rd["applicable"]:available.subtract(comp(ps("salesreturn",rd["id"])))
            assert all(available[norm(p["products"][a][0])]>=q for a,q in articles.items())
            templates[ident]=api("entity/salesreturn/new","PUT",{"demand":m.meta(demand)})
           state=next(s for s in p["states"] if s["name"]=="Доставлен")
           positions=[{"quantity":q,"price":0,"discount":0,"vat":org.get("companyVat__ru",{}).get("defaultCompanyVat",5),"assortment":m.meta(p["products"][a][0])} for a,q in inp["sales"].items()]
           body={k:m.meta(p[k]) for k in ("organization","agent","store")}
           body.update(name=inp["name"],description=inp["comment"],applicable=True,moment=moment,rate=p["rate"],state=m.meta(state),positions=positions)
           order=ensure("customerorder",body);out["documents"]["customerorder"]=order;save()
           order=verify("customerorder",order,wanted);assert norm(order["state"])==norm(state)
           draft=api("entity/demand/new","PUT",{"customerOrder":m.meta(order)})
           body={k:draft[k] for k in ("organization","agent","store","rate","vatEnabled","vatIncluded") if k in draft}
           body.update(customerOrder=m.meta(order),description=inp["comment"],applicable=True,moment=moment,positions=positions)
           demand=ensure("demand",body);out["documents"]["demand"]=demand;save()
           demand=verify("demand",demand,wanted,("customerOrder",order))
           cost=Decimal(0);valuation=[]
           for row in ps("demand",demand["id"],True):
            q=Decimal(str(row["quantity"]));c=Decimal(str(row.get("stock",{}).get("cost",0)))
            assert c>0
            unit=(c/q).to_integral_value(rounding=ROUND_FLOOR)
            cost+=unit*q/100;valuation.append({"article":row["assortment"].get("article"),"quantity":str(q),"cost_kopecks":str(c),"unit_kopecks":str(unit)})
           ret=sum(Decimal(p["CK_RUB"][a])*q for a,q in inp["returns"].items())
           net=cost-ret;factor=Decimal(p["comment_factor"]);som=(net*factor).quantize(Decimal(".01"),rounding=ROUND_HALF_UP)
           description=f"Опт: {cost:.2f} руб − рыжие возвраты {ret:.2f} руб = {net:.2f} руб = {som:.2f} сом"
           api("entity/demand/"+demand["id"],"PUT",{"description":description})
           out.update(wholesale_rub=str(cost),returns_rub=str(ret),net_rub=str(net),net_kgs=str(som),description=description,valuation=valuation);save()
           out["documents"]["salesreturns"]=[]
           for ident,articles in bases.items():
            draft=templates[ident];contents=[]
            for a,q in articles.items():
             candidates=[x for x in draft["positions"] if norm(x["assortment"])==norm(p["products"][a][0])]
             assert len(candidates)==1
             row=candidates[0]
             contents.append({**{k:row[k] for k in ("assortment","vat","vatEnabled") if k in row},"quantity":q,"price":0,"discount":0})
            body={k:draft[k] for k in ("organization","agent","store","demand","rate","vatEnabled","vatIncluded") if k in draft}
            body.update(description="рыжие возвраты из "+inp["comment"],moment=moment,applicable=True,positions=contents)
            rd=ensure("salesreturn",body);out["documents"]["salesreturns"].append(rd);save()
            verify("salesreturn",rd,{norm(p["products"][a][0]):q for a,q in articles.items()},("demand",{"meta":{"href":m.MS+"entity/demand/"+ident}}))
           order=verify("customerorder",order,wanted)
           demand=verify("demand",demand,wanted,("customerOrder",order));assert demand["description"]==description
           assert any(norm(x)==norm(demand) for x in order.get("demands",[]))
           out["documents"]["customerorder"]=order;out["documents"]["demand"]=demand
           out.update(status="complete",completed_at=m.now());save()
           print("Authorized document chain verified; private receipts saved.")
          except Exception as exc:
           out.update(status=out["status"] if out["status"]=="insufficient_stock" else "stopped",error_type=type(exc).__name__,error=str(exc)[:1000],stopped_at=m.now());save()
           print("Document processing stopped; private diagnostic saved.")
           raise SystemExit(1)
          