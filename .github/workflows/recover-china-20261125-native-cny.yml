name: Resume 25 Nov missed China chains with native MoySklad CNY
on:
  push:
    branches: [main]
    paths: ['.github/workflows/recover-china-20261125-native-cny.yml']
permissions:
  contents: read
concurrency:
  group: fbs-document-chain-production
  cancel-in-progress: false
jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Retry only three rejected orders with original CNY config and verify posted currencies
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          MOYSKLAD_API_TOKEN: ${{ secrets.MOYSKLAD_API_TOKEN }}
          WB_TOKEN_3: ${{ secrets.WB_TOKEN_3 }}
          FBS_EXECUTION_KIND: manual
          FBS_OWNER_APPROVAL_ID: china-20261125-native-cny-resume
        run: python scripts/recover_china_20261125_cny_default.py
