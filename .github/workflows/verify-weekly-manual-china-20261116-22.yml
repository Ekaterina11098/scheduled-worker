name: Verify posted owner-reviewed weekly documents
on:
  push:
    branches: [main]
    paths: ['.github/workflows/verify-weekly-manual-china-20261116-22.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: weekly-report-accounting-ms
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: scripts
          filter: blob:none
      - name: Validate verifier syntax
        run: python -m py_compile scripts/verify_weekly_workbook_documents.py
      - name: Verify live documents without changing accounting
        env:
          MOYSKLAD_API_TOKEN: ${{ secrets.MOYSKLAD_API_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          WEEKLY_MANUAL_ROOT: 'weekly_report_review:china:20261116_20261122:'
        run: python scripts/verify_weekly_workbook_documents.py
