name: AngelaBag China verified four-slide insert
on:
  push:
    branches: [angelabag-media-preflight-20261124]
    paths: ['.github/workflows/angelabag-media-insert.yml']
permissions:
  contents: read
concurrency:
  group: angelabag-media-insert-20261124
  cancel-in-progress: true
jobs:
  insert:
    if: github.ref == 'refs/heads/angelabag-media-preflight-20261124'
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install Pillow==11.3.0 requests==2.32.5
      - name: Insert and verify approved galleries
        env:
          WB_TOKEN_3: ${{ secrets.WB_TOKEN_3 }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          SUPABASE_URL: https://abxgjoqlddhtcmjcjwxw.supabase.co
        run: |
          python - <<'PYTHON'
          import sys, types
          for name, source in [("content_photo_drive", "\"\"\"Private photo archive delivery to one owner-approved Google Drive folder.\n\nNo connector-token extraction, public sharing, WB writes or arbitrary destinations.\nThe caller supplies an HTTP transport and a dedicated offline Google authorization.\n\"\"\"\nimport hashlib\nimport re\nimport time\nimport uuid\n\nFOLDER = '1zw7vwx-Qj5Zi_AcIzX0v9L3DxwgMBUr1'\nSCOPE = 'https://www.googleapis.com/auth/drive.file'\nAPI = 'https://www.googleapis.com/drive/v3/files'\nMAX_BYTES = 102 * 1024 * 1024\n\n\nclass DriveError(Exception):\n    pass\n\n\ndef file_id(value):\n    if not isinstance(value, str) or not re.fullmatch(r'[A-Za-z0-9_-]{10,150}', value):\n        raise DriveError('invalid_drive_file_identity')\n    return value\n\n\nclass Delivery:\n    def __init__(self, credentials, transport):\n        if credentials.get('folder_id') != FOLDER:\n            raise DriveError('drive_folder_mismatch')\n        if set(str(credentials.get('scope', '')).split()) != {SCOPE}:\n            raise DriveError('drive_scope_mismatch')\n        if not all(isinstance(credentials.get(k), str) and credentials[k] for k in\n                   ('client_id', 'client_secret', 'refresh_token')):\n            raise DriveError('drive_authorization_missing')\n        self.credentials = credentials\n        self.transport = transport\n        self.token = None\n\n    def refresh(self):\n        r = self.transport('POST', 'https://oauth2.googleapis.com/token', data={\n            'grant_type': 'refresh_token', 'client_id': self.credentials['client_id'],\n            'client_secret': self.credentials['client_secret'],\n            'refresh_token': self.credentials['refresh_token'],\n        }, timeout=(20, 60), allow_redirects=False)\n        if r.status_code != 200:\n            raise DriveError('drive_authorization_refresh_failed')\n        b = r.json()\n        if 'scope' in b and set(b['scope'].split()) != {SCOPE}:\n            raise DriveError('drive_scope_mismatch')\n        if not b.get('access_token') or b.get('token_type', '').lower() != 'bearer':\n            raise DriveError('drive_access_token_invalid')\n        self.token = b['access_token']\n\n    def call(self, method, url, **kwargs):\n        # Access tokens must never follow a redirect or reach a non-Google endpoint.\n        if not url.startswith('https://www.googleapis.com/'):\n            raise DriveError('drive_endpoint_rejected')\n        r = self.transport(method, url, headers={\n            **kwargs.pop('headers', {}), 'Authorization': 'Bearer ' + self.token,\n        }, timeout=(20, 90), allow_redirects=False, **kwargs)\n        if 300 <= r.status_code < 400 and r.status_code != 308:\n            raise DriveError('drive_redirect_rejected')\n        return r\n\n    def metadata(self, ident):\n        ident = file_id(ident)\n        r = self.call('GET', API + '/' + ident, params={\n            'fields': 'id,mimeType,parents,size,md5Checksum,trashed,appProperties,capabilities(canAddChildren)',\n        })\n        if r.status_code != 200:\n            raise DriveError('drive_metadata_unavailable')\n        return r.json()\n\n"), ("content_photo_bridge", "\"\"\"Private WB China photo export. No WB mutations, models or public artifacts.\"\"\"\nimport collections\nimport datetime as dt\nimport hashlib\nimport http.client\nimport io\nimport json\nimport os\nimport re\nimport time\nimport urllib.error\nimport urllib.parse\nimport urllib.request\nimport uuid\nimport zipfile\nimport requests\nfrom PIL import Image\nfrom content_photo_drive import Delivery as DriveDelivery\n\nPROJECT = 'abxgjoqlddhtcmjcjwxw'\nROOT = 'content_photo_bridge:v1:'\nBUCKET = 'owner-media-recovery'\nSTORAGE_ROOT = 'content-photo-bridge/v1/'\nMAX_FILES = 600\nMAX_BYTES = 100 * 1024 * 1024\nURL_TTL = 3600\nSTORAGE_BUDGET = 256 * 1024 * 1024\n\nclass Stop(Exception):\n    pass\n\ndef stamp():\n    return dt.datetime.now(dt.timezone.utc).isoformat()\n\ndef valid_request(value):\n    if value.get('operation','source') not in ('source','gallery'):\n        raise Stop('operation_not_supported')\n    if value.get('cabinet') != 'china':\n        raise Stop('cabinet_not_supported')\n    articles, family = value.get('articles') or [], value.get('family')\n    if bool(articles) == bool(family):\n        raise Stop('choose_articles_or_family')\n    if not isinstance(articles,list) or len(articles)>60 or any(not isinstance(s,str) or not re.fullmatch(r'[\\w .-]{1,120}',s) for s in articles):\n        raise Stop('invalid_articles')\n    if family and (not isinstance(family,str) or not re.fullmatch(r'[A-Za-z][A-Za-z0-9]{1,39}',family)):\n        raise Stop('invalid_family')\n    limit = value.get('max_photos',24)\n    if type(limit) is not int or not 1 <= limit <= 24:\n        raise Stop('invalid_photo_limit')\n    return articles,family,limit\n\ndef select_cards(cards, request):\n    articles,family,limit = valid_request(request)\n    by_nm = {}\n    for card in cards:\n        nm = card.get('nmID')\n        if type(nm) is not int or nm <= 0 or nm in by_nm:\n            raise Stop('invalid_or_duplicate_card_identity')\n        by_nm[nm]=card\n    wanted={s.casefold() for s in articles}\n    selected=[c for c in cards if str(c.get('vendorCode','')).casefold() in wanted] if articles else [c for c in cards if len(str(c.get('vendorCode','')).split('-'))>1 and c['vendorCode'].split('-')[1].casefold()==family.casefold()]\n    counts=collections.Counter(str(c['vendorCode']).casefold() for c in selected)\n    if any(n!=1 for n in counts.values()):\n        raise Stop('ambiguous_article')\n    if articles and set(counts) != {s.casefold() for s in articles}:\n        raise Stop('requested_articles_missing')\n    if not selected or len(selected)>60:\n        raise Stop('selection_empty_or_too_large')\n    selected.sort(key=lambda c:(c['vendorCode'].casefold(),c['nmID']))\n    if any(not isinstance(c.get('photos'),list) or not c['photos'] for c in selected):\n        raise Stop('card_without_photos')\n    if sum(min(limit,len(c['photos'])) for c in selected)>MAX_FILES:\n        raise Stop('photo_count_limit_select_smaller_batch')\n    return selected,limit\n\ndef photo_url(photo):\n    url=photo.get('big') or photo.get('c516x688')\n    parsed=urllib.parse.urlsplit(url or '')\n    if parsed.scheme!='https' or parsed.username or parsed.password or parsed.port or not re.fullmatch(r'basket-\\d+\\.(?:wbbasket\\.ru|wbcontent\\.net)',parsed.hostname or ''):\n        raise Stop('unexpected_photo_host')\n    if not re.fullmatch(r'/vol\\d+/part\\d+/\\d+/images/(?:big|c516x688)/\\d+\\.(?:webp|jpg|jpeg|png)',parsed.path) or parsed.query or parsed.fragment:\n        raise Stop('unexpected_photo_path')\n    return url\n\nclass NoRedirect(urllib.request.HTTPRedirectHandler):\n    def redirect_request(self,*args,**kwargs):\n        raise Stop('redirect_prohibited')\n\nclass Client:\n    def __init__(self):\n        self.base=os.environ['SUPABASE_URL'].rstrip('/')\n        if self.base!='https://'+PROJECT+'.supabase.co':raise Stop('project_mismatch')\n        self.key=os.environ['SUPABASE_SECRET_KEY']\n        self.opener=urllib.request.build_opener(NoRedirect())\n        self.last_wb=0\n    def call(self,url,method='GET',body=None,headers=None,limit=MAX_BYTES,auth=True):\n        headers=dict(headers or {})\n        if auth and url.startswith(self.base+'/'):\n            headers['apikey']=self.key\n            if not self.key.startswith('sb_secret_'):headers['Authorization']='Bearer '+self.key\n        data=body if isinstance(body,bytes) else json.dumps(body).encode() if body is not None else None\n        if body is not None and not isinstance(body,bytes):headers['Content-Type']='application/json'\n        req=urllib.request.Request(url,data=data,headers=headers,method=method)\n        retryable = method=='GET' or url=='https://content-api.wildberries.cn/content/v2/get/cards/list'\n        for attempt in range(3):\n            try:\n                with requests.request(method,url,data=data,headers=headers,timeout=(20,90),allow_redirects=False,stream=True) as response:\n                    if 300<=response.status_code<400:raise Stop('redirect_prohibited')\n                    if response.status_code in (429,500,502,503,504) and retryable and attempt<2:\n                        time.sleep(2*(attempt+1));continue\n                    if response.status_code>=400:raise Stop('http_'+str(response.status_code))\n                    chunks=[];size=0\n                    for chunk in response.iter_content(65536):\n                        size+=len(chunk)\n                        if size>limit:raise Stop('response_size_limit')\n                        chunks.append(chunk)\n                    return b''.join(chunks)\n            except urllib.error.HTTPError as error:\n                if error.code in (429,500,502,503,504) and retryable and attempt<2:\n                    time.sleep(2*(attempt+1));continue\n                raise Stop('http_'+str(error.code)) from None\n            except (TimeoutError,urllib.error.URLError,http.client.IncompleteRead,ConnectionError,requests.exceptions.RequestException):\n                if retryable and attempt<2:time.sleep(2*(attempt+1));continue\n                raise Stop('transport_error') from None\n    def cache(self,query,method='GET',body=None,prefer='return=representation'):\n        raw=self.call(self.base+'/rest/v1/telegram_api_cache?'+urllib.parse.urlencode(query),method,body,{'Prefer':prefer})\n        return json.loads(raw) if raw else []\n    def get(self,key):\n        rows=self.cache({'cache_key':'eq.'+key,'select':'payload'})\n        if len(rows)>1:raise Stop('duplicate_cache_record')\n        return rows[0]['payload'] if rows else None\n    def put(self,key,payload):\n        if not key.startswith(ROOT):raise Stop('cache_scope')\n        expiry='2030-01-01T00:00:00Z' if key.startswith((ROOT+'artifact:',ROOT+'gallery_asset:')) else (dt.datetime.now(dt.timezone.utc)+dt.timedelta(days=8)).isoformat()\n        body={'cache_key':key,'payload':payload,'updated_at':stamp(),'expires_at':expiry}\n        self.cache({'on_conflict':'cache_key'},'POST',body,'resolution=merge-duplicates,return=representation')\n        if self.get(key)!=payload:raise Stop('cache_readback_mismatch')\n    def claim(self,ident):\n        body={'cache_key':ROOT+'claim:'+ident,'payload':{'at':stamp(),'run_id':os.environ.get('GITHUB_RUN_ID')},'updated_at':stamp(),'expires_at':'2030-01-01T00:00:00Z'}\n        return bool(self.cache({'on_conflict':'cache_key'},'POST',body,'resolution=ignore-duplicates,return=representation'))\n    def catalog(self):\n        cursor={'limit':100};cards=[];seen=set()\n        for page in range(40):\n            time.sleep(max(0,1-(time.monotonic()-self.last_wb)));self.last_wb=time.monotonic()\n            body={'settings':{'sort':{'ascending':True},'cursor':cursor,'filter':{'withPhoto':-1}}}\n            raw=self.call('https://content-api.wildberries.cn/content/v2/get/cards/list','POST',body,{'Authorization':os.environ['WB_TOKEN_3']},limit=8_000_000)\n            data=json.loads(raw);data=data.get('data',data) if 'cards' not in data else data\n            rows=data['cards']\n            if not isinstance(rows,list):raise Stop('invalid_card_page')\n            cards.extend(rows)\n            if len(rows)<100:return cards\n            marker=(data['cursor']['updatedAt'],data['cursor']['nmID'])\n            if marker in seen:raise Stop('pagination_loop')\n            seen.add(marker);cursor={'limit':100,'updatedAt':marker[0],'nmID':marker[1]}\n        raise Stop('incomplete_catalog')\n    def storage_upload(self,path,raw,mime):\n        if not path.startswith(STORAGE_ROOT):raise Stop('storage_scope')\n        encoded=urllib.parse.quote(BUCKET+'/'+path,safe='/')\n        self.call(self.base+'/storage/v1/object/'+encoded,'POST',raw,{'Content-Type':mime,'x-upsert':'true'},limit=10000)\n    def signed_url(self,path):\n        raw=self.call(self.base+'/storage/v1/object/sign/'+urllib.parse.quote(BUCKET+'/'+path,safe='/'),'POST',{'expiresIn':URL_TTL},limit=10000)\n        value=json.loads(raw)['signedURL']\n        if not value.startswith('/object/sign/'+BUCKET+'/'):raise Stop('unexpected_signed_path')\n        return self.base+'/storage/v1'+value\n")]:
              module = types.ModuleType(name)
              sys.modules[name] = module
              exec(compile(source, name, "exec"), module.__dict__)
          import datetime as dt
          import hashlib
          import io
          import os
          import re
          import time
          from urllib.parse import urlsplit

          import requests
          from PIL import Image, ImageChops, ImageOps, ImageStat

          from content_photo_drive import API, FOLDER, Delivery
          from content_photo_bridge import Client

          ROOT = "angelabag_media_insert7:v1:"
          PRECHECK = "angelabag_media_insert7:v2:read_only:20261124"
          RESULT = ROOT + "write_result:20261124:r4"
          INPUT = ROOT + "approved_input:20261124"
          PILOT = 1473244338
          EXCLUDED = 1473244337
          HOST = "https://content-api.wildberries.cn"
          SHA = (
              "a37a9793029f6daa8920ce7fb0f035f1dea128146c5d9d18e393695326fbb558",
              "9ea239ca285ce492a6d0cb478cc79387c4e605bf71b6034af9f0fe2fe980619e",
              "5006616f95df18800198d4bff2e4b5d2d142f68739380cd7d618246cd55d55a1",
              "ed4a7562b02aafd9686d375db64894e21711564b377a3d3f65ae4ecfd2b93d71",
          )


          class Stop(Exception):
              pass


          def sha(raw):
              return hashlib.sha256(raw).hexdigest()


          def image(raw):
              with Image.open(io.BytesIO(raw)) as im:
                  return ImageOps.fit(im.convert("RGB"), (192, 256))


          def difference(a, b):
              return sum(ImageStat.Stat(ImageChops.difference(a, b)).mean) / 3


          def matches(slides, photos):
              return [[i for i, photo in enumerate(photos) if difference(slide, photo) <= 5]
                      for slide in slides]


          def media_urls(card):
              urls = []
              for photo in card.get("photos") or []:
                  url = photo.get("big")
                  u = urlsplit(url or "")
                  if (u.scheme != "https" or not re.fullmatch(r"basket-\d+\.(wbbasket\.ru|wbcontent\.net)", u.netloc)
                          or not re.fullmatch(r"/vol\d+/part\d+/\d+/images/big/\d+\.(webp|jpg|jpeg|png)", u.path)
                          or u.query or u.fragment):
                      raise Stop("unexpected_photo_url")
                  urls.append(url)
              return urls


          def photos(client, urls, fresh=False):
              stamp = str(time.time_ns())
              return [client.call(url + ("?verify=" + stamp if fresh else ""),
                                  auth=False, limit=32_000_000) for url in urls]


          def core(card):
              return {k: v for k, v in card.items() if k not in ("photos", "video", "updatedAt", "characteristics")}


          def read_card(client, nm, article):
              body = {"settings": {"cursor": {"limit": 100}, "filter": {"withPhoto": -1, "textSearch": str(nm)}}}
              import json
              raw = client.call(HOST + "/content/v2/get/cards/list", "POST", body,
                                {"Authorization": os.environ["WB_TOKEN_3"]})
              data = json.loads(raw)
              hits = [c for c in data.get("data", data)["cards"] if c.get("nmID") == nm]
              if not hits:
                  hits = [c for c in client.catalog() if c.get("nmID") == nm]
              if len(hits) != 1 or hits[0].get("vendorCode") != article:
                  raise Stop("card_identity_not_verified")
              return hits[0]


          def save(client, report, claim=False):
              now = dt.datetime.now(dt.timezone.utc)
              body = {"cache_key": RESULT, "payload": report, "updated_at": now.isoformat(),
                      "expires_at": (now + dt.timedelta(days=30)).isoformat()}
              mode = "ignore" if claim else "merge"
              rows = client.cache({"on_conflict": "cache_key"}, "POST", body,
                                  f"resolution={mode}-duplicates,return=representation")
              if len(rows) != 1 or client.get(RESULT) != report:
                  raise Stop("journal_not_verified_or_run_already_claimed")


          def assets(client):
              import json
              import base64
              material = []
              for idx, expected in enumerate(SHA, 1):
                  prefix = ROOT + f"private_asset:{idx:02d}:"
                  rows = client.cache({"cache_key": "like." + prefix + "*",
                                       "select": "payload", "order": "cache_key.asc", "limit": 10})
                  parts = [row["payload"] for row in rows]
                  if [part["part"] for part in parts] != list(range((5, 5, 6, 6)[idx - 1])):
                      raise Stop("private_asset_chunks_missing")
                  raw = b"".join(base64.b64decode(part["chunk"], validate=True) for part in parts)
                  if sha(raw) != expected:
                      raise Stop("private_asset_hash_mismatch")
                  with Image.open(io.BytesIO(raw)) as im:
                      if im.format != "PNG" or im.size != (1086, 1448):
                          raise Stop("asset_format_changed")
                      im.verify()
                  material.append(raw)
              bucket = json.loads(client.call(client.base + "/storage/v1/bucket/owner-media-recovery"))
              if bucket.get("public") is not False:
                  raise Stop("asset_bucket_not_private")
              signed = []
              for raw, expected in zip(material, SHA):
                  path = "content-photo-bridge/v1/angelabag-insert7/approved/" + expected + ".png"
                  client.storage_upload(path, raw, "image/png")
                  url = client.signed_url(path)
                  if sha(client.call(url, auth=False, limit=1_000_000)) != expected:
                      raise Stop("signed_asset_readback_mismatch")
                  signed.append(url)
              return [image(raw) for raw in material], signed


          def verify(client, nm, article, baseline, old, slides):
              for delay in (8, 12, 20, 30, 40, 50, 60, 75):
                  time.sleep(delay)
                  card = read_card(client, nm, article)
                  if card.get("video") or core(card) != core(baseline):
                      raise Stop("video_or_non_media_fields_changed")
                  actual = [image(raw) for raw in photos(client, media_urls(card), fresh=True)]
                  if len(actual) == len(old) and all(difference(a, b) <= 3 for a, b in zip(old, actual)):
                      continue
                  if len(actual) != len(old) + 4:
                      raise Stop(f"unexpected_photo_count_{len(actual)}_expected_{len(old) + 4}")
                  if matches(slides, actual) != [[6], [7], [8], [9]]:
                      raise Stop("slide_positions_or_duplicates_differ")
                  if any(difference(a, b) > 3 for a, b in zip(old, actual[:6] + actual[10:])):
                      raise Stop("old_photo_order_or_content_changed")
                  return
              raise Stop("write_not_visible_originals_unchanged")


          def process(client, report, record, article, slides, signed):
              nm = record["nmID"]
              card = read_card(client, nm, article)
              if card.get("video"):
                  return "skipped_video"
              urls = media_urls(card)
              if nm == PILOT and len(urls) != 14:
                  raise Stop(f"pilot_photo_count_{len(urls)}_expected_14")
              if len(urls) < 6:
                  return "skipped_photo_count"
              original_bytes = photos(client, urls, fresh=True)
              old = [image(blob) for blob in original_bytes]
              duplicates = matches(slides, old)
              if duplicates == [[6], [7], [8], [9]]:
                  return "already_at_positions"
              if any(duplicates) or any(difference(slide, photo) < 10 for slide in slides for photo in old):
                  return "skipped_existing_or_ambiguous_slides"
              if len(urls) > 26:
                  return "skipped_photo_count"
              current = read_card(client, nm, article)
              if current.get("video"):
                  return "skipped_video"
              if current.get("photos") != card.get("photos") or core(current) != core(card):
                  raise Stop("card_changed_before_write")
              if [sha(blob) for blob in photos(client, media_urls(current), fresh=True)] != [sha(blob) for blob in original_bytes]:
                  raise Stop("photo_content_or_order_changed_before_write")
              record["status"] = "write_pending_readback"
              save(client, report)
              try:
                  response = requests.post(HOST + "/content/v3/media/save",
                                           headers={"Authorization": os.environ["WB_TOKEN_3"]},
                                           json={"nmId": nm, "data": urls[:6] + signed + urls[6:]},
                                           timeout=90, allow_redirects=False)
                  record["write_response"] = "accepted" if response.status_code == 200 and response.json().get("error") is False else "rejected_or_uncertain"
              except (ValueError, requests.RequestException):
                  record["write_response"] = "uncertain"
              verify(client, nm, article, card, old, slides)
              return "updated_verified"


          def main():
              client = Client()
              report = {"run_id": os.environ["GITHUB_RUN_ID"], "status": "preparing", "cards": []}
              save(client, report, claim=True)
              try:
                  baseline = client.get(PRECHECK)
                  approved = {r["nmID"]: r["vendorCode"] for r in baseline if not r["has_video"] and r["nmID"] != EXCLUDED}
                  if len(approved) != 19 or approved.get(PILOT) != "208-AngelaBag-black":
                      raise Stop("approved_target_set_mismatch")
                  slides, signed = assets(client)
                  for nm in [PILOT] + sorted(set(approved) - {PILOT}):
                      record = {"nmID": nm, "status": "reading"}
                      report["cards"].append(record)
                      record["status"] = process(client, report, record, approved[nm], slides, signed)
                      save(client, report)
                      if nm == PILOT and record["status"] != "updated_verified":
                          raise Stop("pilot_not_updated_and_verified")
                  report["status"] = "complete"
              except Exception as error:
                  report["status"] = "stopped"
                  report["reason"] = str(error) if isinstance(error, Stop) or type(error).__name__ == "DriveError" else type(error).__name__
                  save(client, report)
                  raise SystemExit("AngelaBag upload stopped") from None
              save(client, report)
              print("AngelaBag upload verified")


          if __name__ == "__main__":
              main()
          PYTHON
