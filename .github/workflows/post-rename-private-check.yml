name: Post rename private comparison tests and FBS diagnosis
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  private-comparison-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          repository: Ekaterina11098/VESCHI_AI
          ref: b4cd153a6f53e5027d27a0475a3c2e646bbd15e5
          token: ${{ secrets.SOURCE_READ_TOKEN }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests==2.32.5 python-dotenv==1.1.1
      - name: Validate free WB sources and historical comparisons without API writes
        run: |
          python -m unittest discover -s tests -p test_wb_sources.py -v
          python -m unittest discover -s tests -p test_campaign_review.py -v
  rejected-return-diagnosis:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read existing rejected return links and save the diagnosis privately
        env:
          MOYSKLAD_API_TOKEN: ${{ secrets.MOYSKLAD_API_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        shell: python
        run: |
          import os,json,gzip,re,datetime,urllib.request,urllib.parse,urllib.error
          assert os.environ['GITHUB_REPOSITORY']=='Ekaterina11098/scheduled-worker'
          sb=os.environ['SUPABASE_URL'].rstrip('/')+'/rest/v1/telegram_api_cache'
          sh={'apikey':os.environ['SUPABASE_SECRET_KEY'],'Content-Type':'application/json'}
          ms='https://api.moysklad.ru/api/remap/1.2/'
          mh={'Authorization':'Bearer '+os.environ['MOYSKLAD_API_TOKEN'],'Accept':'application/json;charset=utf-8','Accept-Encoding':'gzip'}
          def get(url,headers):
              with urllib.request.urlopen(urllib.request.Request(url,headers=headers,method='GET'),timeout=30) as r:
                  raw=r.read(3_000_000)
                  if r.headers.get('Content-Encoding','').lower()=='gzip':raw=gzip.decompress(raw)
                  return json.loads(raw)
          query=urllib.parse.urlencode({'cache_key':'like.fbs_document_chain:china:supply:v1:*','payload->>status':'eq.salesreturn_rejected','select':'cache_key,payload','limit':10})
          states=get(sb+'?'+query,sh);results=[]
          def facts(doc):
              return {k:doc.get(k) for k in ('id','name','externalCode','description','applicable','sum','moment','store','organization','agent','demand','salesReturns') if k in doc}
          for row in states:
              state=row['payload'];ident=state.get('documents',{}).get('demand',{}).get('id')
              if not ident:continue
              assert re.fullmatch('[0-9a-f-]{36}',ident)
              demand=get(ms+'entity/demand/'+ident,mh)
              item={'cache_key':row['cache_key'],'demand':facts(demand),'demand_positions':get(ms+'entity/demand/'+ident+'/positions?limit=1000',mh).get('rows',[])}
              item['demand_fields']=sorted(demand)
              item['demand_linked_returns']=demand.get('returns',demand.get('salesReturns'))
              try:
                  external=demand.get('externalCode','').rsplit(':',1)[0]+':salesreturn'
                  url=ms+'entity/salesreturn?'+urllib.parse.urlencode({'filter':'externalCode='+external,'limit':100})
                  returns=get(url,mh).get('rows',[])
                  item['returns']=[facts(d) for d in returns]
                  item['return_positions']={d['id']:get(ms+'entity/salesreturn/'+d['id']+'/positions?limit=1000',mh).get('rows',[]) for d in returns}
                  recent=get(ms+'entity/salesreturn?'+urllib.parse.urlencode({'filter':'moment>='+demand['moment'][:10]+' 00:00:00','limit':1000}),mh)
                  assert recent.get('meta',{}).get('size',0)<=1000,'Recent return list exceeds diagnostic bound'
                  matched=[d for d in recent.get('rows',[]) if (d.get('demand')or{}).get('meta',{}).get('href')==ms+'entity/demand/'+ident]
                  item['all_linked_returns']=[facts(d) for d in matched]
                  item['all_linked_return_positions']={d['id']:get(ms+'entity/salesreturn/'+d['id']+'/positions?limit=1000',mh).get('rows',[]) for d in matched}
              except urllib.error.HTTPError as e:item['linked_return_read_http']=e.code
              # /new computes a template only; it does not create or post a document.
              try:
                  request=urllib.request.Request(ms+'entity/salesreturn/new',data=json.dumps({'demand':{'meta':demand['meta']}}).encode(),headers={**mh,'Content-Type':'application/json'},method='PUT')
                  with urllib.request.urlopen(request,timeout=30) as response:
                      raw=response.read(3_000_000)
                      if response.headers.get('Content-Encoding','').lower()=='gzip':raw=gzip.decompress(raw)
                      template=json.loads(raw)
                      item['return_template']={k:v for k,v in template.items() if k in ('positions','store','organization','agent','demand','applicable','sum','vatEnabled','vatIncluded')}
              except urllib.error.HTTPError as e:
                  raw=e.read()
                  if e.headers.get('Content-Encoding','').lower()=='gzip':raw=gzip.decompress(raw)
                  item['template_http']=e.code
                  try:item['template_errors']=json.loads(raw).get('errors',[])
                  except Exception:item['template_errors']=[{'error':'Response body could not be decoded'}]
              results.append(item)
          record={'cache_key':'diagnostic:fbs_rejected_returns:20261117','payload':{'observed_at':datetime.datetime.now(datetime.timezone.utc).isoformat(),'run_id':os.environ['GITHUB_RUN_ID'],'results':results,'moysklad_writes':0},'expires_at':'2026-12-17T00:00:00Z'}
          request=urllib.request.Request(sb+'?on_conflict=cache_key',data=json.dumps(record).encode(),headers={**sh,'Prefer':'resolution=merge-duplicates'},method='POST')
          with urllib.request.urlopen(request,timeout=30) as r:assert r.status in (200,201,204)
          print('Read-only return diagnosis saved privately; no MoySklad documents changed')
  fbs-read-only-diagnosis:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read the unknown warehouse and save its identity only to private state
        env:
          WB_TOKEN_3: ${{ secrets.WB_TOKEN_3 }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        shell: python
        run: |
          import os,json,datetime,urllib.request
          assert os.environ['GITHUB_REPOSITORY']=='Ekaterina11098/scheduled-worker'
          request=urllib.request.Request('https://marketplace-api.wildberries.ru/api/v3/warehouses',headers={'Authorization':os.environ['WB_TOKEN_3']},method='GET')
          with urllib.request.urlopen(request,timeout=30) as r:rows=json.load(r)
          assert isinstance(rows,list)
          selected=[{k:v for k,v in x.items() if k in ('id','name','officeId','cargoType','deliveryType')} for x in rows if x.get('id')==2373413]
          result={'observed_at':datetime.datetime.now(datetime.timezone.utc).isoformat(),'unknown_origin':selected,'found':len(selected)==1,'wb_writes':0,'moysklad_writes':0,'run_id':os.environ['GITHUB_RUN_ID']}
          record={'cache_key':'diagnostic:fbs_warehouse_identity:20261117','payload':result,'expires_at':'2026-12-17T00:00:00Z'}
          request=urllib.request.Request(os.environ['SUPABASE_URL'].rstrip('/')+'/rest/v1/telegram_api_cache?on_conflict=cache_key',data=json.dumps(record).encode(),headers={'apikey':os.environ['SUPABASE_SECRET_KEY'],'Content-Type':'application/json','Prefer':'resolution=merge-duplicates'},method='POST')
          with urllib.request.urlopen(request,timeout=30) as r:assert r.status in (200,201,204)
          print('WB warehouse read completed; diagnosis saved privately; no WB or MoySklad changes')
