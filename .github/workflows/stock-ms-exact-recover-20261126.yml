name: Recover stock exact MS diagnosis 26Nov
on:
  push:
    paths: ['.github/workflows/stock-ms-exact-recover-20261126.yml']
# Daily05:00/20:00MSK; legacy0700 journal identity retained; bounded10-minute checks resume unfinished slots only.
# Completed slots and unexpired Retry-After are skipped without business API calls.
# Owner approved daily stock execution and new stock notifications, 2026-10-15.
permissions:
  contents: read
concurrency:
  group: bot-stock
  cancel-in-progress: false
jobs:
  stock:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: |
            content_group_destination.py
            stock_deploy_support.py
            warehouse_id_patch.py
            scripts/moysklad_warehouses.py
          sparse-checkout-cone-mode: false
      - uses: actions/checkout@v4
        with:
          repository: Ekaterina11098/VESCHI_AI
          ref: 5100d7bcf35a3715942b5115f70ef8613eaae2df
          token: ${{ secrets.SOURCE_READ_TOKEN }}
          persist-credentials: false
          path: private-source
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests==2.32.5 python-dotenv==1.1.1 aiogram==3.22.0 simplejson==4.2.0 'psycopg[binary]==3.2.9' cryptography > "$RUNNER_TEMP/daily-install.log" 2>&1
      - name: Fresh stock calculation and newly created stock-only notifications
        env:
          PYTHONPATH: ${{ github.workspace }}/private-source:${{ github.workspace }}
          STOCK_DAILY_ENABLED: 'true'
          STOCK_OZON_ENABLED: 'true'
          STOCK_PENDING_RESERVE_ENABLED: 'true'
          STOCK_CANCELLATION_RESTORE_ENABLED: 'true'
          STOCK_RUN_SLOT: '0700'
          STOCK_NOTIFICATIONS_ENABLED: 'true'
          STOCK_CLOUD_EXECUTION_ENABLED: 'true'
          STOCK_JOURNAL_IMPORT_ACCEPTED: 'true'
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          WB_TOKEN_1: ${{ secrets.WB_TOKEN_1 }}
          WB_TOKEN_2: ${{ secrets.WB_TOKEN_2 }}
          WB_TOKEN_3: ${{ secrets.WB_TOKEN_3 }}
          WB_FINANCE_TOKEN_1: ${{ secrets.WB_FINANCE_TOKEN_1 }}
          WB_FINANCE_TOKEN_2: ${{ secrets.WB_FINANCE_TOKEN_2 }}
          WB_FINANCE_TOKEN_3: ${{ secrets.WB_TOKEN_3 }}
          WB_STOCK_WAREHOUSE_1: ${{ vars.WB_STOCK_WAREHOUSE_1 }}
          WB_STOCK_WAREHOUSE_2: ${{ vars.WB_STOCK_WAREHOUSE_2 }}
          WB_STOCK_WAREHOUSE_3: ${{ vars.WB_STOCK_WAREHOUSE_3 }}
          MOYSKLAD_API_TOKEN: ${{ secrets.MOYSKLAD_API_TOKEN }}
          MOYSKLAD_STORE_NAME: МСК
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ALLOWED_CHAT_ID: ${{ secrets.TELEGRAM_ALLOWED_CHAT_ID }}
          AUTO_STOCK_FAIL_FAST: '1'
        run: |
          python warehouse_id_patch.py private-source
          python -c "import stock_deploy_support, stock_regular_job"
          python - <<'PY'
          import stock_deploy_support,stock_unposted_source as m,runpy,json
          from stock_operation_store import Stopped
          original=m.referenced_customer_orders
          def detailed(g,headers,known):
              api=g.api;last={}
              def tracked(method,url,token,**kw):
                  value=api(method,url,token,**kw)
                  if url.rstrip('/')==g.MS_API+'/entity/customerorder':
                      last.clear();last.update(params=kw.get('params',{}),value=value)
                  return value
              g.api=tracked
              try:return original(g,headers,known)
              except Stopped as exc:
                  if str(exc)!='Referenced customer order batch incomplete or duplicate':raise
                  value=last.get('value',{});rows=value.get('rows');params=last.get('params',{})
                  wanted={x[3:] for x in params.get('filter','').split(';') if x.startswith('id=')}
                  found=[r.get('id') for r in rows] if isinstance(rows,list) else []
                  missing=sorted(wanted-set(found));extra=sorted(set(found)-wanted)
                  detail=dict(requested=len(wanted),returned=len(found),meta_size=value.get('meta',{}).get('size'),missing=missing,extra=extra,duplicates=len(found)-len(set(found)),direct=[])
                  for ident in missing[:3]:
                      try:
                          row=api('GET',g.MS_API+'/entity/customerorder/'+ident,g.MS_TOKEN,wb=False,retry_read_network=True)
                          detail['direct'].append(dict(requested=ident,id=row.get('id'),archived=row.get('archived'),deleted=row.get('deleted')))
                      except Exception as direct_error:detail['direct'].append(dict(requested=ident,error=str(direct_error)))
                  print('EXACT_MS_COVERAGE '+json.dumps(detail),flush=True)
                  raise Stopped('MS exact linked order coverage: '+json.dumps(detail)) from exc
              finally:g.api=api
          m.referenced_customer_orders=detailed
          import sys
          sys.argv=['content_group_destination.py','private-source/stock_regular_job.py']
          runpy.run_path('content_group_destination.py',run_name='__main__')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: owner-encrypted-stock-daily-receipt
          path: ${{ runner.temp }}/stock-deploy-proof
          retention-days: 90

