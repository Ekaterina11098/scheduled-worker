name: One-off China Jam CSV API availability check
on:
  push:
    branches: [main]
    paths: ['.github/workflows/china-jam-csv-probe-20261124.yml']
permissions: {}
concurrency:
  group: china-jam-csv-probe-20261124
  cancel-in-progress: false
jobs:
  probe:
    if: github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install requests==2.32.5 > "$RUNNER_TEMP/dependencies.log" 2>&1
      - name: Check extended report API; private receipt only, no marketplace mutations
        env:
          WB_TOKEN_3: ${{ secrets.WB_TOKEN_3 }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        shell: python
        run: |
          import os,json,time,uuid,io,csv,zipfile,base64,hashlib,requests
          from datetime import datetime,timezone
          ROOT='china_agent:jam_csv_probe:20261124:v1'
          SB=os.environ['SUPABASE_URL'].rstrip('/')
          KEY=os.environ['SUPABASE_SECRET_KEY'].strip()
          SH={'apikey':KEY,'Content-Type':'application/json'}
          if not KEY.startswith('sb_secret_'):SH['Authorization']='Bearer '+KEY
          WH={'Authorization':os.environ['WB_TOKEN_3'].strip()}
          HOST='https://seller-analytics-api.wildberries.ru'
          def stamp():return datetime.now(timezone.utc).isoformat()
          def get(k):
           r=requests.get(SB+'/rest/v1/telegram_api_cache',headers=SH,params={'cache_key':'eq.'+k,'select':'payload','limit':1},timeout=40);r.raise_for_status()
           a=r.json();return a[0]['payload']if a else None
          def put(k,p,once=False):
           r=requests.post(SB+'/rest/v1/telegram_api_cache?on_conflict=cache_key',headers={**SH,'Prefer':'resolution='+('ignore'if once else'merge')+'-duplicates,return=representation'},json={'cache_key':k,'payload':p,'updated_at':stamp(),'expires_at':'2027-11-24T00:00:00Z'},timeout=40);r.raise_for_status()
           return len(r.json())==1
          
          parent=get(ROOT)
          assert parent and parent.get('create_http_status')==200
          KEY_RESULT=ROOT+':download'
          prior=get(KEY_RESULT)
          if prior and prior.get('status')=='complete':raise SystemExit('Verified archive retained; no repeat')
          rid=parent['report_id']
          s=dict(status='checking_generated_report',report_id=rid,observed_at=stamp(),run_id=os.environ.get('GITHUB_RUN_ID'),wb_writes=0,telegram_calls=0,model_calls=0,report_create_calls=0)
          def save():put(KEY_RESULT,s)
          save()
          try:
           for attempt in range(8):
            if attempt:time.sleep(30)
            r=requests.get(HOST+'/api/v2/nm-report/downloads',headers=WH,params={'filter[downloadIds]':rid},timeout=(10,50))
            s['status_http']=r.status_code
            if r.status_code!=200:s.update(status='status_unavailable',error=body(r));save();break
            j=r.json();s['report_list']=j
            item=next((a for a in j.get('data',[])if a.get('id')==rid),{})
            s['report_status']=item.get('status');save()
            if item.get('status')=='FAILED':s['status']='generation_failed';save();break
            if item.get('status')!='SUCCESS':continue
            r=requests.get(HOST+'/api/v2/nm-report/downloads/file/'+rid,headers=WH,timeout=(10,90))
            s['file_http']=r.status_code
            if r.status_code!=200:s.update(status='download_unavailable',error=body(r));save();break
            raw=r.content
            with zipfile.ZipFile(io.BytesIO(raw))as z:
             assert z.testzip()is None
             tables=[]
             for name in z.namelist():
              if not name.lower().endswith('.csv'):continue
              content=z.read(name)
              try:text=content.decode('utf-8-sig')
              except UnicodeDecodeError:text=content.decode('cp1251')
              try:dialect=csv.Sniffer().sniff(text[:12000],delimiters=';,\t')
              except csv.Error:dialect=csv.excel
              rows=list(csv.reader(io.StringIO(text),dialect))
              headers=next((row for row in rows[:8]if any('nm' in x.lower()or'артикул'in x.lower()for x in row)),rows[0]if rows else[])
              tables.append(dict(name=name,headers=headers,rows=len(rows),sample=rows[:5]))
            assert tables,'No CSV in generated archive'
            put(ROOT+':archive',dict(report_id=rid,sha256=hashlib.sha256(raw).hexdigest(),data=base64.b64encode(raw).decode(),tables=tables,observed_at=stamp()))
            headers=[h for t in tables for h in t['headers']]
            s.update(status='complete',archive_sha256=hashlib.sha256(raw).hexdigest(),archive_bytes=len(raw),tables=tables,
             has_ctr=any('ctr'in h.lower()for h in headers),has_impressions=any(any(t in h.lower()for t in('показ','impression','showcount','viewcount'))for h in headers),finished_at=stamp())
            save();print(json.dumps({k:s[k]for k in('status','has_ctr','has_impressions','wb_writes','report_create_calls')}));break
           else:s['status']='pending';save()
          except Exception as ex:
           s.update(status='diagnostic_error',error_type=type(ex).__name__);save();raise SystemExit('Private diagnostic retained')
