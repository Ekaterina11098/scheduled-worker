name: Verify WB ООО comment normalization
on:
  push:
    branches: [main]
    paths: ['.github/workflows/verify-ooo-comment-once.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run comment tests with no API writes
        run: python -m unittest discover -s scripts -p test_fbs_ip_categories.py -v
