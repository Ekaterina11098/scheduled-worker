name: Convert selected linked payment and receipt to CNY
on:
  push:
    branches: [main]
    paths: ['.github/workflows/cny-linked-convert.yml']
permissions:
  contents: read
concurrency:
  group: cny-single-document-test
  cancel-in-progress: false
jobs:
  convert:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: scripts
      - name: Snapshot, convert two authorized documents and reconcile
        env:
          MOYSKLAD_API_TOKEN: ${{ secrets.MOYSKLAD_API_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: python scripts/cny_selected_linked_documents.py
