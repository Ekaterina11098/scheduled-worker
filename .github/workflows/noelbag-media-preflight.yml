name: NoelBag insert at 7 - live read-only preflight
# v4: 4 PNG read from SHA-verified private Supabase cache; WB writes disabled
# Verify private Supabase staged hashes and current 45 cards; WB read-only.
on:
  push:
    branches: [noelbag-media-insert7-preflight-20261120]
    paths: ['.github/workflows/noelbag-media-preflight.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: noelbag-live-readonly-preflight-v1
  cancel-in-progress: true
jobs:
  check:
    if: github.ref == 'refs/heads/noelbag-media-insert7-preflight-20261120'
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: |
            scripts/noelbag_media_insert7.py
            scripts/noelbag_media_execute.py
            scripts/test_noelbag_media_insert7.py
            scripts/noelbag_media_manifest.csv
            scripts/content_photo_drive.py
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install Pillow==11.3.0 requests==2.32.5
      - name: Run isolated unit tests without WB credentials
        run: python -m unittest discover -s scripts -p 'test_noelbag_media_insert7.py' -v
      - name: Verify four private Google Drive PNGs and inspect 45 WB cards (READ ONLY)
        env:
          WB_TOKEN_3: ${{ secrets.WB_TOKEN_3 }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: python scripts/noelbag_media_insert7.py

# Video-bearing cards: check slide presence first; any new insertion remains blocked pending separate video-safe validation.
