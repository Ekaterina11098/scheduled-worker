name: Celinea157 authoritative reference read only
on:
  push:
    branches: [main]
    paths: ['.github/workflows/celinea157-reference-20261116.yml']
permissions: {}
concurrency:
  group: celinea362-media
  cancel-in-progress: true
jobs:
  read:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install --quiet requests==2.32.5
      - env:
          WB_TOKEN_3: ${{ secrets.WB_TOKEN_3 }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        shell: python
        run: |
          import requests,os,time,datetime
          host='https://content-api.wildberries.cn';cur={'limit':100};found={}
          for page in range(40):
           r=requests.post(host+'/content/v2/get/cards/list',headers={'Authorization':os.environ['WB_TOKEN_3']},json={'settings':{'cursor':cur,'filter':{'withPhoto':-1}}},timeout=45);r.raise_for_status();j=r.json()
           for c in j.get('cards',[]):
            if c.get('vendorCode') in ['157-CelineaBag-black','362-CelineaBag-black']:found[c['vendorCode']]=c
           if len(found)==2:break
           cu=j.get('cursor',{})
           if cu.get('total',0)<100:break
           cur={'limit':100,'updatedAt':cu['updatedAt'],'nmID':cu['nmID']};time.sleep(.7)
          assert len(found)==2
          sb=os.environ['SUPABASE_URL'].rstrip('/');sk=os.environ['SUPABASE_SECRET_KEY']
          r=requests.post(sb+'/rest/v1/telegram_api_cache?on_conflict=cache_key',headers={'apikey':sk,'Authorization':'Bearer '+sk,'Content-Type':'application/json','Prefer':'resolution=merge-duplicates,return=minimal'},json={'cache_key':'celinea157_reference:20261116:v1','payload':{'status':'read','cards':found,'wb_writes':0},'updated_at':datetime.datetime.now(datetime.timezone.utc).isoformat(),'expires_at':'2099-01-01T00:00:00Z'},timeout=40);r.raise_for_status()
          print('Authoritative157 and current362 read privately; no WB writes')
