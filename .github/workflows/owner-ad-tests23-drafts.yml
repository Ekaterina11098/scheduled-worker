name: Owner IP OOO zero-budget test drafts Nov23
on:
  push:
    branches: [main]
    paths: ['.github/workflows/owner-ad-tests23-drafts.yml']
permissions: {contents: read}
concurrency:
  group: owner-ad-tests23-drafts
  cancel-in-progress: false
jobs:
  draft:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /scripts/owner_ad_tests23.py
            /scripts/owner_ad_tests23_drafts.py
            /scripts/test_owner_ad_tests23_drafts.py
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install requests==2.32.5
      - run: PYTHONPATH=scripts python -m unittest discover -s scripts -p test_owner_ad_tests23_drafts.py
      - name: Prepare exact owner-requested drafts; no deposits or activation methods exist in this worker
        env:
          WB_TOKEN_1: ${{ secrets.WB_TOKEN_1 }}
          WB_TOKEN_2: ${{ secrets.WB_TOKEN_2 }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: python scripts/owner_ad_tests23_drafts.py
