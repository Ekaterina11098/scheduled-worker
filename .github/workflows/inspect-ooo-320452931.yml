name: Inspect missed WB ООО 320452931
on:
  push:
    branches: [main]
    paths: ['.github/workflows/inspect-ooo-320452931.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Read exact WB ООО supply, product stock and MS documents
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          MOYSKLAD_API_TOKEN: ${{ secrets.MOYSKLAD_API_TOKEN }}
          WB_TOKEN_3: ${{ secrets.WB_TOKEN_1 }}
        run: python scripts/inspect_ooo_320452931.py
