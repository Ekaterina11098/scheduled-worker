name: Create approved two manishki search draft 27Nov
on:
  push:
    branches: [main]
    paths: ['.github/workflows/ip-manishki-search2-create-20261127.yml']
  workflow_dispatch:
permissions: {contents: read}
concurrency:
  group: wb-ip-advertising-agent
  cancel-in-progress: false
jobs:
  read:
    runs-on: ubuntu-latest
    timeout-minutes: 270
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 9bec1fb28acfd025143a0dda55b25626427e3d96
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            scripts/ip_manishki_search2_create_20261127.py
            scripts/owner_ad_tests23.py
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install requests==2.32.5 > "$RUNNER_TEMP/dependencies.log" 2>&1
      - name: Create and verify exact search draft; no funding or old campaign writes
        run: python scripts/ip_manishki_search2_create_20261127.py
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          WB_TOKEN_2: ${{ secrets.WB_TOKEN_2 }}
