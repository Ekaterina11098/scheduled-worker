name: Verify migration batch read semantics
on:
  push:
    branches: [main]
    paths: ['.github/workflows/ms-cny-batch-read-check-20261125.yml']
permissions:
  contents: read
jobs:
  read:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: scripts
      - name: Verify exact document selection and position completeness
        shell: python
        env:
          MOYSKLAD_API_TOKEN: ${{ secrets.MOYSKLAD_API_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: |
          import sys
          sys.path.insert(0,'scripts')
          import cny_migration_backup_20261125 as b
          t=b.ReadOnly();db=b.m.Cache(t)
          docs=db.get(b.ROOT+'backup:customerorder:page:0')['documents'][:3]
          ids={d['id'] for d in docs}
          result=t.request(b.m.MS,'entity/customerorder',params={'filter':';'.join('id='+i for i in sorted(ids)),'expand':'positions','limit':1000})
          assert result['meta']['size']==len(ids) and {d['id'] for d in result['rows']}==ids
          assert all(d['positions']['meta']['size']==len(d['positions'].get('rows',[])) for d in result['rows'])
          b.put(db,'batch_read_proof:v1',{'status':'complete','at':b.m.now(),'selected':len(ids),'exact_ids':True,'positions_complete':True,'ms_writes':0})
          print('Exact batch-read semantics and position expansion verified.')
