          MOYSKLAD_API_TOKEN: ${{ secrets.MOYSKLAD_API_TOKEN }}
          CHINA_TELEGRAM_BOT_TOKEN: ""
        run: PYTHONPATH=scripts:source python scripts/china_owner_kirov_finance27.py






