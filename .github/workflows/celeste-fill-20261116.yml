name: Celeste owner approved four cards fill16Nov
on:
  push:
    branches: [main]
    paths: ['.github/workflows/celeste-fill-20261116.yml']
permissions: {}
concurrency:
  group: celeste-content
  cancel-in-progress: false
jobs:
  fill:
    if: github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install --quiet requests==2.32.5
      - env:
          WB_TOKEN_3: ${{ secrets.WB_TOKEN_3 }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        shell: python
        run: |
          import os,json,time,copy,datetime,requests
          sb=os.environ['SUPABASE_URL'].rstrip('/');sk=os.environ['SUPABASE_SECRET_KEY'];token=os.environ['WB_TOKEN_3']
          sh={'apikey':sk,'Authorization':'Bearer '+sk,'Content-Type':'application/json'};wh={'Authorization':token};host='https://content-api.wildberries.cn'
          key='celeste_fill:china:20261116:execution:v1'
          def now():return datetime.datetime.now(datetime.timezone.utc).isoformat()
          def get(k):
           r=requests.get(sb+'/rest/v1/telegram_api_cache',headers=sh,params={'cache_key':'eq.'+k,'select':'payload'},timeout=40);r.raise_for_status();a=r.json();return a[0]['payload'] if a else None
          def put(k,p,create=False):
           r=requests.post(sb+'/rest/v1/telegram_api_cache?on_conflict=cache_key',headers={**sh,'Prefer':'resolution='+('ignore-duplicates' if create else 'merge-duplicates')+',return=representation'},json={'cache_key':k,'payload':p,'updated_at':now(),'expires_at':'2099-01-01T00:00:00Z'},timeout=40);r.raise_for_status();return bool(r.json())
          if get(key):raise SystemExit('Existing execution; never replay')
          spec=get('celeste_fill:china:20261116:approved_input:v1');pre=get('celeste_fill:china:20261116:preflight:v1')
          assert spec and pre['status']=='read';ids=spec['ids'];assert len(ids)==4
          schema={x['charcID']:x for x in pre['schema']['data']};allowed={x['name'] for x in pre['colors']['data']}
          assert all(len(v)==5 and set(v)<=allowed for v in spec['colors'].values())
          assert any(str(x['tnved'])=='4202210000' for x in pre['tnved']['data'])
          for i,v in spec['characteristics'].items():
           sc=schema[int(i)];assert not sc['existNamedField']
           if isinstance(v,list):assert len(v)<=sc['maxCount']
          def call(path,body=None,base=host):
           r=requests.get(base+path,headers=wh,timeout=45) if body is None else requests.post(base+path,headers=wh,json=body,timeout=45)
           r.raise_for_status();j=r.json();assert not j.get('error');return j
          def cards():
           found={};cur={'limit':100}
           for page in range(40):
            j=call('/content/v2/get/cards/list',{'settings':{'cursor':cur,'filter':{'withPhoto':-1}}})
            for c in j.get('cards',[]):
             if c.get('vendorCode') in ids:
              assert c['nmID']==ids[c['vendorCode']];found[c['vendorCode']]=c
            if len(found)==4:return found
            cu=j.get('cursor',{})
            if cu.get('total',0)<100:break
            cur={'limit':100,'updatedAt':cu['updatedAt'],'nmID':cu['nmID']};time.sleep(.7)
           raise RuntimeError('Incomplete exact four card pagination')
          def core(c):
           d={k:v for k,v in c.items() if k not in ('photos','video','updatedAt')}
           d['characteristics']=sorted(d.get('characteristics',[]),key=lambda x:x['id']);return d
          def prices(nm):
           j=call('/api/v2/list/goods/filter?limit=100&filterNmID='+str(nm),base='https://discounts-prices-api.wildberries.ru')
           rows=[x for x in j['data']['listGoods'] if x['nmID']==nm];assert len(rows)==1 and rows[0]['currencyIsoCode4217']=='CNY';return rows[0]
          def price_state(p):return {'discount':p.get('discount'),'currency':p.get('currencyIsoCode4217'),'sizes':sorted([{'id':s['sizeID'],'price':s['price']} for s in p['sizes']],key=lambda x:x['id'])}
          before=cards();payload=[];p_before={}
          for a,c in before.items():
           assert c['subjectID']==50 and c.get('brand','')==''
           assert core(c)==core(pre['cards'][a]),'Content changed since preflight'
           pr=prices(c['nmID']);p_before[a]=price_state(pr);by={x['sizeID']:x['price'] for x in pr['sizes']}
           attrs={x['id']:{'id':x['id'],'value':x['value']} for x in c.get('characteristics',[])}
           attrs.update({int(i):{'id':int(i),'value':v} for i,v in spec['characteristics'].items()});attrs[14177449]={'id':14177449,'value':spec['colors'][a]}
           p={'nmID':c['nmID'],'vendorCode':a,'brand':c.get('brand',''),'title':spec['title'],'description':spec['descriptions'][a],'dimensions':spec['dimensions'],'kizMarked':c.get('kizMarked',False),'characteristics':list(attrs.values()),'sizes':[{**{k:v for k,v in x.items() if k in ('chrtID','techSize','wbSize','skus')},'price':by[x['chrtID']]} for x in c['sizes']],'documents':{'excludeDocuments':c.get('documents',{}).get('excludeDocuments',False)}}
           assert len(p['description'])<=2000 and '\\n' not in p['description']
           payload.append(p)
          e={'status':'prepared','before':before,'requests':payload,'prices_before':p_before,'wb_write_requests':0,'prepared_at':now()}
          assert put(key,e,True),'Already claimed'
          canonical={'status':'owner_approved','source':'Owner Celeste specification16Nov2026','cards':payload,'ids':ids,'created_at':now()}
          assert put('wb_content_protection:celeste:20261116:v1',canonical,True),'Canonical already exists; inspect instead'
          try:
           fresh=cards()
           for a in ids:
            assert core(fresh[a])==core(before[a]) and fresh[a].get('photos')==before[a].get('photos') and fresh[a].get('video')==before[a].get('video'),'Concurrent card edit'
           e.update(status='submitting',wb_write_requests=1,submitted_at=now());put(key,e)
           r=requests.post(host+'/content/v2/cards/update',headers=wh,json=payload,timeout=60);e['http_status']=r.status_code
           if not r.ok:
            e.update(status='rejected',response=r.text[:500]);put(key,e);raise RuntimeError('WB rejected')
           j=r.json();e['response']=j
           if j.get('error'):
            e['status']='rejected';put(key,e);raise RuntimeError('WB content rejected')
           e['status']='accepted_pending_verification';put(key,e)
           def attr_equal(a,b):
            if isinstance(a,list) and isinstance(b,list):return sorted(a)==sorted(b)
            return a==b
           for attempt in range(18):
            time.sleep(10);after=cards();checks={}
            for p in payload:
             a=p['vendorCode'];c=after[a];attrs={x['id']:x['value'] for x in c.get('characteristics',[])}
             checks[a]={'title':c.get('title')==p['title'],'description':c.get('description')==p['description'],'characteristics':all(attr_equal(attrs.get(x['id']),x['value']) for x in p['characteristics']),'dimensions':all(abs(float(c.get('dimensions',{}).get(k,-1))-v)<1e-6 for k,v in p['dimensions'].items()),'brand':c.get('brand')==before[a].get('brand'),'identity':all(c.get(k)==before[a].get(k) for k in ('nmID','imtID','vendorCode','nmUUID')),'sizes_barcodes':c.get('sizes')==before[a].get('sizes'),'photos':c.get('photos')==before[a].get('photos') and c.get('video')==before[a].get('video')}
            e.update(after=after,checks=checks,observed_at=now())
            if all(all(v.values()) for v in checks.values()):
             price_checks={a:price_state(prices(nm))==p_before[a] for a,nm in ids.items()};e['prices_unchanged']=price_checks
             assert all(price_checks.values()),'Price changed'
             e.update(status='verified',completed_at=now());put(key,e);print('Verified four Celeste cards; photos IDs barcodes prices preserved');break
            if attempt in (2,10,17):
             e['validation_errors']=call('/content/v2/cards/error/list',{'settings':{'cursor':{'limit':100},'sort':{'ascending':False}}})
            put(key,e)
           else:e['status']='verification_pending';put(key,e);print('Accepted; verification pending; no replay')
          except Exception as ex:
           if e.get('status')=='submitting':e['status']='uncertain'
           e['error']=type(ex).__name__;put(key,e);raise SystemExit('Stopped; inspect private Celeste audit')
