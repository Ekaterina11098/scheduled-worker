name: Read China singleton stocks and transit 20261116
on:
  push:
    branches: ['review/china-bag-groups-20261116']
    paths: ['.github/workflows/china-singleton-stocks-review-20261116.yml']
permissions: {}
concurrency:
  group: china-singleton-stock-read-20261116
  cancel-in-progress: false
jobs:
  read:
    if: github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install --quiet requests==2.32.5 cryptography
      - name: Read six singletons stocks without changing inventory or cards
        shell: python
        env:
          WB_TOKEN_3: ${{ secrets.WB_TOKEN_3 }}
          MOYSKLAD_API_TOKEN: ${{ secrets.MOYSKLAD_API_TOKEN }}
        run: |
          import os,time,json,requests,re,math,collections,traceback,gzip,base64,secrets
          from datetime import datetime,timezone
          from urllib.parse import urlparse
          from cryptography.hazmat.primitives import serialization,hashes
          from cryptography.hazmat.primitives.asymmetric import padding
          from cryptography.hazmat.primitives.ciphers.aead import AESGCM
          TARGETS=json.loads("[{\"vendorCode\":\"119-NoelBag-darkblack\",\"nmID\":1473243898,\"imtID\":4219890915,\"subjectID\":136,\"subjectName\":\"Клатчи\",\"title\":\"Клатч натуральная кожа маленький без ремня\"},{\"vendorCode\":\"23-Zont-pink\",\"nmID\":1556488190,\"imtID\":4377848193,\"subjectID\":61,\"subjectName\":\"Зонты\",\"title\":\"Зонт автомат антиветер складной\"},{\"vendorCode\":\"400-CymeBag-brown\",\"nmID\":1473243932,\"imtID\":4497360049,\"subjectID\":50,\"subjectName\":\"Сумки\",\"title\":\"Сумка тоут из экокожи большая\"},{\"vendorCode\":\"472-StellaBag-beige\",\"nmID\":1473242770,\"imtID\":4377856663,\"subjectID\":50,\"subjectName\":\"Сумки\",\"title\":\"Сумка натуральная кожа через плечо маленькая\"},{\"vendorCode\":\"482-RiginaBag-red\",\"nmID\":1900202932,\"imtID\":4429896656,\"subjectID\":50,\"subjectName\":\"Сумки\",\"title\":\"Сумка из натуральной кожи маленькая с цепочкой\"},{\"vendorCode\":\"616-MayaBag-black\",\"nmID\":1473243457,\"imtID\":4377840042,\"subjectID\":50,\"subjectName\":\"Сумки\",\"title\":\"Сумка натуральная кожа через плечо\"}]")
          PUBLIC_KEY="-----BEGIN PUBLIC KEY-----\nMIIBojANBgkqhkiG9w0BAQEFAAOCAY8AMIIBigKCAYEAqZNUrOvZ4UeO29b+p61F\niH/TYX0CFHtnqndnmHR4leDh/pqkTFqC+EryTPqjLJBylfgeqPqc0Bywo7WeHNxe\nvbOmih5rb9wRTYgJRBx7ruUJaWiJLP0yp2KwLMf8Vc0tRxRBIfXV/CHQjVIIc0rY\nOEW8+gwrAgsqFgs0944OpliDwm0aI9UX+j4gCTCmktk5swzFuqyxcDUH7fOUDKe1\nOOSqDB/lODw3333K6mjuHxRcDUD69EdTOS+hJb+ZqQOCT9JGtE2b6H9+Uf6B9cYs\nKu7JDPUD/5ETgxz3Oa3YgM7XPWwamcn5MYq8HMJ2e4F2B1x/mxSpUk6RFDR8hW/W\nFpqmg+JxpZpKwuSgBhegRpWwJ1+gS0z0h31a58XweTDtA8nd7WJjhiegbmSwItLM\npC3FVE8HzAeP6h8C+7l2r/Vl81y59CE+VHvgSmUobNRmHdY+laFAU2v8PfuebV5C\nDku+Uuz+AjUYKOtflqUc8HQQHGldtkkXG1iafKKIpZyTAgMBAAE=\n-----END PUBLIC KEY-----\n"
          MS='https://api.moysklad.ru/api/remap/1.2'
          TOKEN=os.environ['WB_TOKEN_3'];MS_TOKEN=os.environ['MOYSKLAD_API_TOKEN']
          OUT={'status':'started','wbWrites':0,'stageErrors':{},'startedAt':datetime.now(timezone.utc).isoformat(),'rows':[{'article':t['vendorCode'],'nmID':t['nmID'],'MSK':None,'Guangzhou':None,'FBS':None,'FBO':None,'toClient':None,'returnToWB':None,'pendingToWB':None} for t in TARGETS]}
          ROW={r['nmID']:r for r in OUT['rows']}
          def now():return datetime.now(timezone.utc).isoformat()
          def error(stage,exc):OUT['stageErrors'][stage]={'type':type(exc).__name__,'message':str(exc)}
          def api(method,url,wb=True,**kwargs):
              host=urlparse(url).netloc;path=urlparse(url).path
              assert host in ('content-api.wildberries.cn','marketplace-api.wildberries.cn','seller-analytics-api.wildberries.cn','supplies-api.wildberries.cn') if wb else host=='api.moysklad.ru' and path.startswith('/api/remap/1.2/')
              assert method=='GET' or method=='POST' and (path=='/content/v2/get/cards/list' or re.fullmatch('/api/v3/stocks/[0-9]+',path) or path=='/api/v1/supplies')
              for attempt in range(4):
                  time.sleep(.85 if 'content-api' in host else .25)
                  try:r=requests.request(method,url,headers={'Authorization':TOKEN if wb else 'Bearer '+MS_TOKEN,'Accept-Encoding':'gzip'},timeout=60,**kwargs)
                  except requests.RequestException:
                      if attempt==3:raise RuntimeError('Read network failure '+host+path)
                      time.sleep(2);continue
                  if r.status_code==429:
                      wait=int(float(r.headers.get('X-Ratelimit-Retry') or r.headers.get('Retry-After') or 65))+2
                      if wait>180:raise RuntimeError('Read cooldown '+str(wait)+' seconds '+host+path)
                      time.sleep(wait);continue
                  if not r.ok:raise RuntimeError('Read HTTP '+str(r.status_code)+' '+host+path)
                  if r.status_code==204:return []
                  d=r.json()
                  if isinstance(d,dict) and d.get('error'):raise RuntimeError('Read error '+host+path)
                  return d
              raise RuntimeError('Read retry limit '+host+path)
          def msrows(url,**params):
              out=[];expected=None
              for offset in range(0,100000,1000):
                  d=api('GET',url,False,params={**params,'limit':1000,'offset':offset})
                  assert isinstance(d.get('rows'),list) and type(d.get('meta',{}).get('size')) is int
                  size=d['meta']['size']
                  if expected is None:expected=size
                  assert expected==size,'MS catalog changed during pagination'
                  out.extend(d['rows'])
                  if len(d['rows'])<1000:
                      assert len(out)==expected,'MS response incomplete'
                      return out
              raise RuntimeError('MS pagination limit')
          def catalog():
              for attempt in range(3):
                  cs=[];cursor={'limit':100};seen=set()
                  for page in range(50):
                      d=api('POST','https://content-api.wildberries.cn/content/v2/get/cards/list',json={'settings':{'sort':{'ascending':True},'cursor':cursor,'filter':{'withPhoto':-1}}})
                      if not isinstance(d.get('cards'),list):d=d.get('data',{})
                      assert isinstance(d.get('cards'),list) and isinstance(d.get('cursor'),dict)
                      cs.extend(d['cards'])
                      if len(d['cards'])<100:break
                      marker=(d['cursor'].get('updatedAt'),d['cursor'].get('nmID'))
                      assert all(marker) and marker not in seen
                      seen.add(marker);cursor={'limit':100,'updatedAt':marker[0],'nmID':marker[1]}
                  else:raise RuntimeError('WB pagination limit')
                  if cs and len({c['nmID'] for c in cs})==len(cs):return cs
                  time.sleep(3)
              raise RuntimeError('Unstable WB catalog')
          def numeric(value):
              assert type(value) in (float,int) and math.isfinite(value),'Numeric quantity missing'
              return value
          try:
              cards=catalog();byid={c['nmID']:c for c in cards};group_sizes=collections.Counter(c['imtID'] for c in cards)
              selected=[]
              for target in TARGETS:
                  c=byid[target['nmID']];assert c['vendorCode'].lower()==target['vendorCode'].lower()
                  assert group_sizes[c['imtID']]==1,'Card is no longer single'
                  assert c.get('sizes')
                  selected.append(c);ROW[c['nmID']].update(imtID=c['imtID'],sizes=c['sizes'],subject=c.get('subjectName'))
              OUT['catalogCount']=len(cards);OUT['catalogAt']=now()
              try:
                  wh=api('GET','https://marketplace-api.wildberries.cn/api/v3/warehouses')
                  assert isinstance(wh,list)
                  active=[w for w in wh if w.get('deliveryType')==1 and not w.get('isDeleting')]
                  assert active,'No active FBS warehouses'
                  OUT['warehouses']=wh
                  allids=sorted({int(s['chrtID']) for c in selected for s in c['sizes']})
                  fbs={}
                  for w in active:
                      d=api('POST','https://marketplace-api.wildberries.cn/api/v3/stocks/'+str(w['id']),json={'chrtIds':allids})
                      assert isinstance(d.get('stocks'),list)
                      bysize={int(i['chrtId']):numeric(i['amount']) for i in d['stocks']}
                      fbs[w['id']]={'name':w.get('name'),'processing':w.get('isProcessing',False),'stocks':bysize,'raw':d}
                  OUT['fbsRaw']=fbs
                  for c in selected:
                      per={}
                      for wid,read in fbs.items():
                          sizeids={int(s['chrtID']) for s in c['sizes']}
                          qty=sum(read['stocks'][i] for i in sizeids) if sizeids.issubset(read['stocks']) and not read['processing'] else None
                          per[str(wid)]={'name':read['name'],'quantity':qty,'missingSizeIDs':sorted(sizeids-set(read['stocks']))}
                      values=[entry['quantity'] for entry in per.values()]
                      ROW[c['nmID']].update(FBSByWarehouse=per,FBS=sum(values) if all(v is not None for v in values) else None,FBSKnownMinimum=sum(v for v in values if v is not None))
                  OUT['fbsAt']=now()
              except Exception as exc:error('FBS',exc)
              try:
                  goods=msrows(MS+'/entity/assortment',filter='archived=false;archived=true')
                  stores=msrows(MS+'/entity/store')
                  bindings={'MSK':'3c67619d-f25d-11ee-0a80-0c6f000a027a','Guangzhou':'2233c6a7-d906-11f1-0a80-197e004df0d2'}
                  paths=collections.defaultdict(set)
                  for p in goods:
                      if p.get('article'):paths[p['article'].lower()].add(urlparse(p['meta']['href']).path)
                  OUT['msStores']=[]
                  for key,storeid in bindings.items():
                      found=[s for s in stores if s.get('id')==storeid and not s.get('archived')]
                      assert len(found)==1,'Bound MS store missing '+key
                      store=found[0];OUT['msStores'].append({'role':key,'id':storeid,'name':store.get('name')})
                      values={};transit={};raw={}
                      for row in msrows(MS+'/report/stock/bystore',filter='store='+store['meta']['href']+';stockMode=all'):
                          a=row.get('assortment') or {};path=urlparse((a.get('meta') or row.get('meta') or {}).get('href','')).path
                          entries=[e for e in row.get('stockByStore',[]) if e.get('meta',{}).get('href')==store['meta']['href']]
                          if len(entries)==1 and type(entries[0].get('stock')) in (float,int):
                              assert path not in values,'Duplicate MS stock row'
                              values[path]=numeric(entries[0]['stock'])
                              transit[path]=entries[0].get('inTransit')
                              if any(path in paths[t['vendorCode'].lower()] for t in TARGETS):raw[path]=entries[0]
                      for t in TARGETS:
                          matches=paths.get(t['vendorCode'].lower(),set())
                          path=next(iter(matches)) if len(matches)==1 else None
                          qty=values.get(path) if path else None
                          ROW[t['nmID']][key]=qty
                          ROW[t['nmID']][key+'InTransit']=transit.get(path) if path else None
                          ROW[t['nmID']][key+'Evidence']=raw.get(path) if path else None
                  OUT['msAt']=now()
              except Exception as exc:error('MS',exc)
              try:
                  base='https://seller-analytics-api.wildberries.cn/api/v1/warehouse_remains'
                  task=api('GET',base,params={'locale':'ru','groupByNm':'true','groupBySa':'true','groupByBarcode':'false','groupBySize':'false','filterPics':0,'filterVolume':0})
                  taskid=task['data']['taskId'];OUT['reportTask']=taskid;OUT['reportCreatedAt']=now()
                  time.sleep(20)
                  status=api('GET',base+'/tasks/'+taskid+'/status');OUT['reportStatus']=status
                  assert status['data']['status']=='done','WB report still preparing'
                  report=api('GET',base+'/tasks/'+taskid+'/download')
                  assert isinstance(report,list),'WB stock report incomplete'
                  bynm={}
                  for row in report:
                      nm=row.get('nmId');assert type(nm) is int and nm not in bynm and isinstance(row.get('warehouses'),list)
                      bynm[nm]=row
                  for t in TARGETS:
                      row=bynm.get(t['nmID']);amounts={}
                      for w in row.get('warehouses',[]) if row else []:
                          name=w['warehouseName'];assert name not in amounts
                          amounts[name]=numeric(w['quantity'])
                      physical=amounts.get('Всего находится на складах',sum(q for name,q in amounts.items() if not name.startswith(('В пути','Всего')) and name!='Маркетплейс'))
                      transit=sum(q for name,q in amounts.items() if name.startswith('В пути'))
                      ROW[t['nmID']].update(FBO=physical,toClient=amounts.get('В пути до получателей',0),returnToWB=amounts.get('В пути возвраты на склад WB',0),WBTransitTotal=transit,WBReportAmounts=amounts,absentFromCompleteReport=row is None,WBReportAllZero=all(q==0 for q in amounts.values()))
                  OUT['reportRows']=len(report);OUT['wbReportAt']=now()
              except Exception as exc:error('WB_REPORT',exc)
              try:
                  base='https://supplies-api.wildberries.cn/api/v1/supplies'
                  supply=[];offset=0
                  while True:
                      d=api('POST',base,json={'statusIDs':[2,3,4,6]},params={'limit':1000,'offset':offset});assert isinstance(d,list)
                      supply.extend(d)
                      if len(d)<1000:break
                      offset+=len(d);time.sleep(2.1)
                  pending=collections.defaultdict(float)
                  for s in supply:
                      sid=s.get('supplyID') or s.get('preorderID');assert sid
                      offset=0
                      while True:
                          time.sleep(2.1)
                          d=api('GET',base+'/'+str(sid)+'/goods',params={'isPreorderID':'false' if s.get('supplyID') else 'true','limit':1000,'offset':offset});assert isinstance(d,list)
                          for item in d:
                              nm=item.get('nmID')
                              if nm in ROW:pending[nm]+=max(numeric(item['quantity'])-numeric(item.get('readyForSaleQuantity',0)),0)
                          if len(d)<1000:break
                          offset+=len(d)
                  for row in OUT['rows']:row['pendingToWB']=pending[row['nmID']]
                  OUT['suppliesCount']=len(supply);OUT['suppliesAt']=now()
              except Exception as exc:error('SUPPLIES',exc)
              OUT['status']='read_finished'
          except Exception as exc:
              error('CATALOG',exc);OUT['status']='incomplete'
          for row in OUT['rows']:
              required=('MSK','Guangzhou','FBS','FBO','WBTransitTotal','pendingToWB')
              row['zeroConfirmed']=all(row.get(k)==0 for k in required) and row.get('WBReportAllZero') is True and all(row.get(k) in (None,0) for k in ('MSKInTransit','GuangzhouInTransit'))
              row['knownNonzero']={k:row[k] for k in ('MSK','Guangzhou','FBS','FBSKnownMinimum','FBO','WBTransitTotal','pendingToWB','MSKInTransit','GuangzhouInTransit') if type(row.get(k)) in (int,float) and row[k]!=0}
              row['unknownFields']=[k for k in required if row.get(k) is None]
          OUT['finishedAt']=now()
          key=secrets.token_bytes(32);nonce=secrets.token_bytes(12);pub=serialization.load_pem_public_key(PUBLIC_KEY.encode());b=lambda v:base64.b64encode(v).decode()
          envelope={'key':b(pub.encrypt(key,padding.OAEP(mgf=padding.MGF1(hashes.SHA256()),algorithm=hashes.SHA256(),label=None))),'nonce':b(nonce),'ciphertext':b(AESGCM(key).encrypt(nonce,gzip.compress(json.dumps(OUT,ensure_ascii=False).encode()),None))}
          encoded=b(json.dumps(envelope).encode())
          for i in range(0,len(encoded),18000):print('SINGLETON_STOCK_ENCRYPTED '+str(i//18000)+' '+encoded[i:i+18000],flush=True)
          print('SINGLETON_STOCK_READ_FINISHED',flush=True)
          
