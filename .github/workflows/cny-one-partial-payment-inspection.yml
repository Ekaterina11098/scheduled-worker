name: Inspect selected payment chain currencies
on:
  push:
    branches: [main]
    paths: ['.github/workflows/cny-one-partial-payment-inspection.yml']
permissions:
  contents: read
concurrency:
  group: ms-cny-selected-chain
  cancel-in-progress: false
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: scripts
      - name: Read selected chain and currency metadata
        env:
          MOYSKLAD_API_TOKEN: ${{ secrets.MOYSKLAD_API_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: python scripts/cny_one_partial_payment_inspection.py
