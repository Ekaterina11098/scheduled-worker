name: OOO replace approved report PNGs once
on:
  push:
    branches: [main]
    paths: ['scripts/ooo_replace17.py', '.github/workflows/ooo-replace17.yml']
permissions: {contents: read}
concurrency:
  group: ooo-report-exact-edits
  cancel-in-progress: false
jobs:
  replace:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false, sparse-checkout: scripts}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install requests==2.32.5 --quiet
      - env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          OOO_TELEGRAM_BOT_TOKEN: ${{ secrets.OOO_TELEGRAM_BOT_TOKEN }}
        run: python -u scripts/ooo_replace17.py
