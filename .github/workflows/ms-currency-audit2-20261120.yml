name: Complete read-only document currency audit
on:
  push:
    branches: [main]
    paths: ['.github/workflows/ms-currency-audit2-20261120.yml']
permissions:
  contents: read
concurrency:
  group: ms-currency-audit2-20261120
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: scripts
      - name: Check every document currency with small verified checkpoints
        shell: python
        env:
          MOYSKLAD_API_TOKEN: ${{ secrets.MOYSKLAD_API_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: |
          import sys,time,collections,concurrent.futures,threading
          sys.path.insert(0,'scripts')
          import fbs_document_chain as m
          ROOT='ms_currency_normalize:20261120:audit2:'
          TYPES=["cashin","cashout","commissionreportin","commissionreportout","customerorder","demand","enter","facturein","factureout","internalorder","invoicein","invoiceout","loss","move","paymentin","paymentout","prepayment","prepaymentreturn","purchaseorder","purchasereturn","retailsalesreturn","retaildemand","retaildrawercashin","retaildrawercashout","retireorder","salesreturn","supply"]
          class ReadOnly(m.Transport):
           def request(self,base,path,method='GET',body=None,params=None):
            if base==m.MS and method!='GET':raise m.Stop('MS mutation prohibited')
            return super().request(base,path,method,body,params)
          def save(db,key,value):
           for attempt in range(5):
            try:
             db.put(key,value);return
            except Exception:
             try:
              if db.get(key)==value:return
             except Exception:pass
             if attempt==4:raise
             time.sleep(2*(attempt+1))
          t=ReadOnly();db=m.Cache(t)
          curr=t.request(m.MS,'entity/currency',params={'limit':1000})
          assert curr['meta']['size']==len(curr['rows'])
          currencies={m.href(c):c.get('isoCode') for c in curr['rows']}
          save(db,ROOT+'currencies',curr)
          start=m.now()
          save(db,ROOT+'status',{'status':'running','started_at':start,'types':TYPES})
          def audit(typ):
           t=ReadOnly();db=m.Cache(t);offset=0;total=None;counts=collections.Counter()
           result={'type':typ,'status':'reading','count':0,'pages':0,'currencies':{},'missing_rate':0,'non_rub':0,'exceptions':[],'started_at':m.now()}
           try:
            while True:
             data=t.request(m.MS,'entity/'+typ,params={'limit':1000,'offset':offset,'order':'id,asc'})
             size=data['meta']['size']
             if total is None:total=size
             if size!=total:raise m.Stop('Collection size changed; fresh pass required')
             batch=data['rows']
             for d in batch:
              ref=m.href(d.get('rate',{}).get('currency',{}))
              if not ref:result['missing_rate']+=1
              else:
               iso=currencies.get(ref,'UNKNOWN');counts[iso]+=1
               if iso!='RUB':
                result['non_rub']+=1
                if len(result['exceptions'])<20:result['exceptions'].append({'id':d['id'],'currency':iso})
             offset+=len(batch)
             result.update(count=offset,total=total,pages=result['pages']+1,currencies=dict(counts),updated_at=m.now())
             save(db,ROOT+typ,result)
             if offset==total:break
             if not batch or offset>total:raise m.Stop('Incomplete pagination')
            result['status']='complete'
           except Exception as e:
            result.update(status='failed',error=str(e) if isinstance(e,m.Stop) else type(e).__name__)
           result['finished_at']=m.now()
           save(db,ROOT+typ,result)
           return result
          with concurrent.futures.ThreadPoolExecutor(max_workers=3) as pool:
           results=list(pool.map(audit,TYPES))
          after=t.request(m.MS,'entity/currency',params={'limit':1000})
          assert {m.href(c):c.get('isoCode') for c in after['rows']}==currencies
          summary={'status':'complete' if all(r['status']=='complete' for r in results) else 'incomplete','started_at':start,'finished_at':m.now(),'documents':sum(r['count'] for r in results),'non_rub':sum(r['non_rub'] for r in results),'missing_rate':sum(r['missing_rate'] for r in results),'types':results,'currencies_unchanged_during_audit':True,'document_writes':0}
          save(db,ROOT+'result',summary)
          save(db,ROOT+'status',{'status':summary['status'],'finished_at':summary['finished_at']})
          print('Read-only currency audit finished; detailed result stored privately.')
          
