name: Add only approved Stella472 to China group8 20261116
on:
  push:
    branches: ['review/china-bag-groups-20261116']
    paths: ['.github/workflows/china-stella472-add-only-20261116.yml']
permissions: {}
concurrency:
  group: china-stella472-add-only
  cancel-in-progress: false
jobs:
  apply:
    if: github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install --quiet requests==2.32.5 cryptography
      - name: Add Stella only when a place is available without regrouping
        shell: python
        env:
          WB_TOKEN_3: ${{ secrets.WB_TOKEN_3 }}
        run: |
          import os,json,time,requests,collections,gzip,base64,secrets,traceback
          from datetime import datetime,timezone
          from cryptography.hazmat.primitives import serialization,hashes
          from cryptography.hazmat.primitives.asymmetric import padding
          from cryptography.hazmat.primitives.ciphers.aead import AESGCM
          NM=1473242770;ARTICLE='472-StellaBag-beige';TARGET=4014564758
          TOKEN=os.environ['WB_TOKEN_3'];HOST='https://content-api.wildberries.cn'
          PUBLIC_KEY="-----BEGIN PUBLIC KEY-----\nMIIBojANBgkqhkiG9w0BAQEFAAOCAY8AMIIBigKCAYEAqZNUrOvZ4UeO29b+p61F\niH/TYX0CFHtnqndnmHR4leDh/pqkTFqC+EryTPqjLJBylfgeqPqc0Bywo7WeHNxe\nvbOmih5rb9wRTYgJRBx7ruUJaWiJLP0yp2KwLMf8Vc0tRxRBIfXV/CHQjVIIc0rY\nOEW8+gwrAgsqFgs0944OpliDwm0aI9UX+j4gCTCmktk5swzFuqyxcDUH7fOUDKe1\nOOSqDB/lODw3333K6mjuHxRcDUD69EdTOS+hJb+ZqQOCT9JGtE2b6H9+Uf6B9cYs\nKu7JDPUD/5ETgxz3Oa3YgM7XPWwamcn5MYq8HMJ2e4F2B1x/mxSpUk6RFDR8hW/W\nFpqmg+JxpZpKwuSgBhegRpWwJ1+gS0z0h31a58XweTDtA8nd7WJjhiegbmSwItLM\npC3FVE8HzAeP6h8C+7l2r/Vl81y59CE+VHvgSmUobNRmHdY+laFAU2v8PfuebV5C\nDku+Uuz+AjUYKOtflqUc8HQQHGldtkkXG1iafKKIpZyTAgMBAAE=\n-----END PUBLIC KEY-----\n"
          R={'status':'started','verified':False,'article':ARTICLE,'nmID':NM,'targetIMT':TARGET,'targetGroup':'Связка 8','requests':[],'authorizedConstraint':'only add Stella; no other membership changes'}
          def now():return datetime.now(timezone.utc).isoformat()
          def seal(tag,obj):
              pub=serialization.load_pem_public_key(PUBLIC_KEY.encode());key=secrets.token_bytes(32);nonce=secrets.token_bytes(12)
              b=lambda v:base64.b64encode(v).decode()
              env={'key':b(pub.encrypt(key,padding.OAEP(mgf=padding.MGF1(hashes.SHA256()),algorithm=hashes.SHA256(),label=None))),'nonce':b(nonce),'ciphertext':b(AESGCM(key).encrypt(nonce,gzip.compress(json.dumps(obj,ensure_ascii=False,default=str).encode()),None))}
              encoded=b(json.dumps(env).encode())
              for i in range(0,len(encoded),18000):print(tag+' '+str(i//18000)+' '+encoded[i:i+18000],flush=True)
          def page(body):
              for attempt in range(4):
                  time.sleep(.85)
                  try:r=requests.post(HOST+'/content/v2/get/cards/list',headers={'Authorization':TOKEN},json=body,timeout=60)
                  except requests.RequestException:
                      if attempt==3:raise RuntimeError('Catalog network failure')
                      time.sleep(2);continue
                  if r.status_code==429:
                      wait=int(float(r.headers.get('X-Ratelimit-Retry') or r.headers.get('Retry-After') or 65))+2
                      assert wait<=180
                      time.sleep(wait);continue
                  if not r.ok:raise RuntimeError('Catalog HTTP '+str(r.status_code))
                  d=r.json()
                  if not isinstance(d.get('cards'),list):d=d.get('data',{})
                  assert isinstance(d.get('cards'),list) and isinstance(d.get('cursor'),dict)
                  return d
              raise RuntimeError('Catalog retry limit')
          def catalog():
              for attempt in range(3):
                  cards=[];cursor={'limit':100};seen=set()
                  for p in range(50):
                      d=page({'settings':{'sort':{'ascending':True},'cursor':cursor,'filter':{'withPhoto':-1}}})
                      cards.extend(d['cards'])
                      if len(d['cards'])<100:break
                      mark=(d['cursor'].get('updatedAt'),d['cursor'].get('nmID'));assert all(mark) and mark not in seen
                      seen.add(mark);cursor={'limit':100,'updatedAt':mark[0],'nmID':mark[1]}
                  else:raise RuntimeError('Pagination limit')
                  if cards and len({c['nmID'] for c in cards})==len(cards):return cards
                  time.sleep(3)
              raise RuntimeError('Unstable catalog')
          def membership(cards):return [{k:c.get(k) for k in ('nmID','vendorCode','imtID','subjectID','subjectName')} for c in cards]
          def protected(c):
              fields=('nmID','nmUUID','subjectID','vendorCode','brand','title','description','sizes','photos','video','characteristics','dimensions','kizMarked','needKiz')
              out={k:c.get(k) for k in fields}
              out['characteristics']=sorted(out.get('characteristics') or [],key=lambda x:x.get('id',0))
              out['sizes']=sorted(out.get('sizes') or [],key=lambda x:x.get('chrtID',0))
              if isinstance(out.get('dimensions'),dict):out['dimensions']={k:v for k,v in out['dimensions'].items() if k!='isValid'}
              return out
          def move_one():
              payload={'targetIMT':TARGET,'nmIDs':[NM]}
              assert payload=={'targetIMT':4014564758,'nmIDs':[1473242770]}
              for attempt in range(4):
                  time.sleep(.95);entry={'payload':payload,'at':now()};R['requests'].append(entry)
                  try:r=requests.post(HOST+'/content/v2/cards/moveNm',headers={'Authorization':TOKEN},json=payload,timeout=60)
                  except requests.RequestException:entry['status']='network_outcome_unknown';return
                  entry['http']=r.status_code
                  if r.status_code==429:
                      entry['status']='rate_limited'
                      wait=int(float(r.headers.get('X-Ratelimit-Retry') or r.headers.get('Retry-After') or 65))+2
                      assert wait<=180
                      time.sleep(wait);continue
                  try:d=r.json()
                  except ValueError:entry['status']='response_outcome_unknown';return
                  entry['response']=d;entry['status']='accepted' if r.ok and not d.get('error') else 'rejected'
                  assert entry['status']=='accepted','WB rejected addition'
                  return
              raise RuntimeError('Move retry limit')
          try:
              before=catalog();bi={c['nmID']:c for c in before};card=bi.get(NM)
              assert card and card['vendorCode'].lower()==ARTICLE.lower(),'Card absent or identity changed'
              old_members={c['nmID'] for c in before if c['imtID']==TARGET};assert old_members,'Destination group absent'
              R.update(before=card,membershipBefore=membership(before),beforeCount=len(before),beforeGroupSize=len(old_members),beforeIMT=card['imtID'])
              others=[c for c in before if c['nmID']!=NM and c['vendorCode'].split('-')[1].lower()=='stellabag']
              assert all(c['imtID']==TARGET for c in others),'Other Stella colors would require regrouping'
              assert card['subjectID']==bi[next(iter(old_members))]['subjectID'],'Subcategory mismatch'
              if card['imtID']!=TARGET:
                  assert sum(c['imtID']==card['imtID'] for c in before)==1,'Card no longer singleton'
                  assert len(old_members)<30,'No place without regrouping'
                  seal('STELLA_BACKUP',{'card':card,'membershipBefore':R['membershipBefore']})
                  move_one()
              for attempt in range(18):
                  time.sleep(7);after=catalog();ai={c['nmID']:c for c in after};R['membershipLatest']=membership(after)
                  if NM in ai and ai[NM]['imtID']==TARGET:break
              else:raise RuntimeError('Addition not yet confirmed')
              assert set(ai)==set(bi),'Active card set changed'
              assert all(ai[n]['imtID']==c['imtID'] for n,c in bi.items() if n!=NM),'Other cards changed groups'
              expected=old_members|{NM};actual={c['nmID'] for c in after if c['imtID']==TARGET}
              assert actual==expected and len(actual)<=30,'Destination composition differs'
              a=protected(card);b=protected(ai[NM]);fields=[k for k in a if a[k]!=b[k]]
              R.update(after=ai[NM],membershipAfter=membership(after),afterCount=len(after),afterGroupSize=len(actual),contentEqual=not fields,differentFields=fields,onlyOneCardMoved=True)
              assert not fields,'Card content differs'
              R.update(status='verified',verified=True)
              print('STELLA_ONLY_ADDITION_VERIFIED',flush=True)
          except Exception as exc:R.update(status='incomplete',error={'type':type(exc).__name__,'message':str(exc),'trace':traceback.format_exc()})
          finally:R['finishedAt']=now();seal('STELLA_RESULT',R);print('STELLA_TASK_FINISHED',flush=True)
          
