name: Read live incoming currency header counts
on:
  push:
    branches: [main]
    paths: ['.github/workflows/cny-incoming-live-header-counts.yml']
permissions:
  contents: read
jobs:
  read:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: scripts
      - name: Read live header summary
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          MOYSKLAD_API_TOKEN: ${{ secrets.MOYSKLAD_API_TOKEN }}
        run: python scripts/cny_incoming_live_header_counts.py
