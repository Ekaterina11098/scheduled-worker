name: Owner IP liquidation49 launch
on:
  workflow_dispatch:
permissions: {contents: read}
concurrency:
  group: ip-owner-wb-advertising-writes
  cancel-in-progress: false
jobs:
  launch:
    if: github.run_attempt == 1 && github.event.head_commit.message == '[owner-ip-liquidation49] Launch exact approved test'
    runs-on: ubuntu-latest
    timeout-minutes: 245
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /scripts/owner_ad_tests23.py
            /scripts/owner_ip_liquidation49.py
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install requests==2.32.5 > /dev/null 2>&1
      - env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          WB_TOKEN_2: ${{ secrets.WB_TOKEN_2 }}
          OPENAI_API_KEY: ''
        run: python scripts/owner_ip_liquidation49.py
