name: MAYA3 approved Regina to Samanta366-368 correction25Nov
on:
  push:
    branches: [main]
    paths: ['.github/workflows/maya3-samanta-correction-20261125.yml']
permissions: {}
concurrency:
  group: maya3-samanta-correction-20261125
  cancel-in-progress: false
jobs:
  correct:
    if: github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install --quiet requests==2.32.5
      - env:
          WB_TOKEN_3: ${{ secrets.WB_TOKEN_3 }}
          MOYSKLAD_API_TOKEN: ${{ secrets.MOYSKLAD_API_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        shell: python
        run: |
          import os,json,time,requests,copy
          from datetime import datetime,timezone
          SB=os.environ['SUPABASE_URL'].rstrip('/');SK=os.environ['SUPABASE_SECRET_KEY']
          SH={'apikey':SK,'Authorization':'Bearer '+SK,'Content-Type':'application/json'}
          WH={'Authorization':os.environ['WB_TOKEN_3'],'Content-Type':'application/json'}
          MH={'Authorization':'Bearer '+os.environ['MOYSKLAD_API_TOKEN'],'Content-Type':'application/json','Accept-Encoding':'gzip'}
          WB='https://content-api.wildberries.cn';MS='https://api.moysklad.ru/api/remap/1.2'
          KEY='maya3_correction:samanta366_368:20261125:v1'
          def now():return datetime.now(timezone.utc).isoformat()
          def cache(k):
           r=requests.get(SB+'/rest/v1/telegram_api_cache',headers=SH,params={'cache_key':'eq.'+k,'select':'payload'},timeout=50);r.raise_for_status();rows=r.json()
           return rows[0]['payload'] if rows else None
          def save(e):
           r=requests.post(SB+'/rest/v1/telegram_api_cache?on_conflict=cache_key',headers={**SH,'Prefer':'resolution=merge-duplicates,return=minimal'},json={'cache_key':KEY,'payload':e,'updated_at':now(),'expires_at':'2099-01-01T00:00:00Z'},timeout=50);r.raise_for_status()
          def msget(path,params=None):
           for n in range(6):
            time.sleep(2);r=requests.get(MS+path,headers=MH,params=params,timeout=60)
            if r.status_code==429:time.sleep(10+n*5);continue
            r.raise_for_status();return r.json()
           raise RuntimeError('MS read rate limited')
          def cards():
           cur={'limit':100};out=[]
           for page in range(80):
            for n in range(4):
             r=requests.post(WB+'/content/v2/get/cards/list',headers=WH,json={'settings':{'sort':{'ascending':True},'cursor':cur,'filter':{'withPhoto':-1}}},timeout=60)
             if r.status_code==429:time.sleep(10+n*5);continue
             r.raise_for_status();break
            else:raise RuntimeError('WB read rate limited')
            j=r.json();assert not j.get('error');out.extend(j.get('cards',[]));cu=j.get('cursor',{})
            if cu.get('total',0)<100:return out
            cur={'limit':100,'updatedAt':cu['updatedAt'],'nmID':cu['nmID']};time.sleep(.8)
           raise RuntimeError('WB pagination incomplete')
          def wbcore(c):
           d={k:v for k,v in c.items() if k!='updatedAt'}
           d['characteristics']=sorted(d.get('characteristics',[]),key=lambda x:str(x['id']))
           return d
          def mscore(p):
           d={k:v for k,v in p.items() if k!='updated'}
           if 'attributes' in d:d['attributes']=sorted(d['attributes'],key=lambda x:str(x['id']))
           return d
          assert cache(KEY) is None,'Existing correction; inspect journal before resume'
          orig=cache('maya3_stage4:wb_create:20261125:v1');linked=cache('maya3_stage5:ms_barcodes:20261125:v1')
          assert orig['status']=='verified' and linked['status']=='verified'
          live=cards();by_nm={c['nmID']:c for c in live};targets=[];payload=[]
          reference=[c for c in live if c.get('vendorCode','').startswith('164-SamantaBag-')]
          assert len(reference)==1,'Owner reference164not found'
          reorder=[c for c in live if c.get('vendorCode')=='143-ReginaBag-black'];assert len(reorder)==1
          reorder_ms=msget('/entity/product/762a7b63-d3cf-11ef-0a80-0e8500025f22')
          for number in ('366','367','368'):
           old=next(c for c in orig['products'] if c['vendorCode'].startswith(number+'-'))
           c=by_nm[old['nmID']];a=c['vendorCode'];assert a==old['vendorCode'] and '-ReginaBag-' in a
           new=a.replace('-ReginaBag-','-SamantaBag-');assert not any(x.get('vendorCode')==new for x in live)
           link=next(x for x in linked['products'] if x['article']==a)
           p=msget('/entity/product/'+link['id']);assert p['article']==a and p['code']==number+'с'
           assert {'code128':orig['barcodes'][a]} in p.get('barcodes',[])
           collisions=msget('/entity/product',{'filter':'article='+new,'limit':100})['rows'];assert not collisions
           expected=copy.deepcopy(c);expected['vendorCode']=new
           for field in ('title','description'):
            if isinstance(expected.get(field),str):expected[field]=expected[field].replace('Regina','Samanta')
           for ch in expected.get('characteristics',[]):
            if isinstance(ch.get('value'),list):ch['value']=[v.replace('Regina','Samanta') if isinstance(v,str) else v for v in ch['value']]
           q={k:expected[k] for k in ('nmID','vendorCode','brand','title','description','sizes') if k in expected}
           q['characteristics']=[{'id':x['id'],'value':x['value']} for x in expected.get('characteristics',[])]
           q['dimensions']={k:v for k,v in c.get('dimensions',{}).items() if k in ('length','width','height','weightBrutto')}
           for field in ('gtin','kizMarked','wholesale'):
            if field in c:q[field]=c[field]
           targets.append({'old_article':a,'new_article':new,'nmID':c['nmID'],'ms_id':p['id'],'before_wb':c,'expected_wb':expected,'before_ms':p,'expected_ms_name':p['name'].replace('Regina','Samanta'),'barcode':orig['barcodes'][a]})
           payload.append(q)
          e={'status':'prepared','started_at':now(),'targets':targets,'payload':payload,'wb_update_attempts':0,'ms_update_attempts':0,'ms_verified':[],'reference164':reference[0],'reorder_before_wb':reorder[0],'reorder_before_ms':reorder_ms}
          r=requests.post(SB+'/rest/v1/telegram_api_cache?on_conflict=cache_key',headers={**SH,'Prefer':'resolution=ignore-duplicates,return=representation'},json={'cache_key':KEY,'payload':e,'updated_at':now(),'expires_at':'2099-01-01T00:00:00Z'},timeout=50);r.raise_for_status();assert len(r.json())==1
          try:
           fresh={c['nmID']:c for c in cards()}
           assert all(wbcore(fresh[t['nmID']])==wbcore(t['before_wb']) for t in targets),'Card changed during preparation'
           e.update(status='updating_wb',wb_update_attempts=1);save(e)
           r=requests.post(WB+'/content/v2/cards/update',headers=WH,json=payload,timeout=60)
           e['wb_http_status']=r.status_code
           if r.ok:e['wb_response']=r.json()
           else:e['wb_response_text']=r.text[:1000]
           e['status']='awaiting_wb_readback';save(e)
           for attempt in range(30):
            time.sleep(12);allnow=cards();byid={c['nmID']:c for c in allnow}
            if all(byid[t['nmID']].get('vendorCode')==t['new_article'] for t in targets):
             for t in targets:
              current=byid[t['nmID']]
              assert wbcore(current)==wbcore(t['expected_wb']),'Unexpected WB field change'
              assert not any(c.get('vendorCode')==t['old_article'] for c in allnow)
              t['after_wb']=current
             break
            e['wb_observed']=[{'nmID':t['nmID'],'article':byid[t['nmID']].get('vendorCode')} for t in targets];save(e)
           else:raise RuntimeError('WB rename not yet verified; do not resend')
           e.update(status='wb_verified');save(e)
           for t in targets:
            p=msget('/entity/product/'+t['ms_id']);assert mscore(p)==mscore(t['before_ms']),'MS changed during WB rename'
            patch={'article':t['new_article'],'name':t['expected_ms_name']}
            expected=copy.deepcopy(p);expected.update(patch)
            e.update(status='updating_ms',pending_ms=t['new_article'],ms_update_attempts=e['ms_update_attempts']+1);save(e)
            for attempt in range(5):
             time.sleep(2);r=requests.put(MS+'/entity/product/'+t['ms_id'],headers=MH,json=patch,timeout=60)
             if r.status_code!=429:break
             time.sleep(15+attempt*5)
             current=msget('/entity/product/'+t['ms_id'])
             if mscore(current)==mscore(expected):break
             assert mscore(current)==mscore(p),'MS changed during rate-limit pause'
            current=msget('/entity/product/'+t['ms_id'])
            assert mscore(current)==mscore(expected),'MS rename not verified or unrelated field changed'
            t['after_ms']=current
            assert not msget('/entity/product',{'filter':'article='+t['old_article'],'limit':100})['rows'],'Old article remains in MS'
            e['ms_verified'].append(t['new_article']);e.update(status='in_progress',pending_ms=None);save(e)
           final=cards();byid={c['nmID']:c for c in final}
           assert all(wbcore(byid[t['nmID']])==wbcore(t['expected_wb']) for t in targets)
           assert wbcore(next(c for c in final if c.get('vendorCode')=='143-ReginaBag-black'))==wbcore(reorder[0])
           assert mscore(msget('/entity/product/'+reorder_ms['id']))==mscore(reorder_ms)
           e.update(status='verified',reorder143_unchanged=True,ids_barcodes_photos_characteristics_preserved=True,completed_at=now());save(e)
           # Add a new approved canonical version; retain original audit history.
           r=requests.post(SB+'/rest/v1/telegram_api_cache?on_conflict=cache_key',headers={**SH,'Prefer':'resolution=ignore-duplicates,return=minimal'},json={'cache_key':'wb_content_protection:maya3_samanta_corrected:20261125:v1','payload':{'status':'verified','cards':{c['vendorCode']:c for c in final if c['nmID'] in {t['nmID'] for t in targets}},'supersedes_articles':{t['old_article']:t['new_article'] for t in targets}},'updated_at':now(),'expires_at':'2099-01-01T00:00:00Z'},timeout=50);r.raise_for_status()
           print('Three Samanta model names and articles verified in WB/MS; IDs/barcodes/media preserved;143unchanged')
          except Exception as ex:
           e['error_type']=type(ex).__name__;e['status_before_stop']=e['status'];e['status']='stopped_review_required';save(e)
           raise SystemExit('Stopped; inspect private correction journal before retry')
