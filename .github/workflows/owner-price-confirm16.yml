name: Complete exact confirmed China prices335
on:
  push:
    branches: [main]
    paths: [.github/workflows/owner-price-confirm16.yml]
permissions: {contents: read}
concurrency:
  group: china-confirmed-wb-price-writes
  cancel-in-progress: false
jobs:
  apply:
    if: github.run_attempt == 1 && github.event.head_commit.message == '[owner-price-confirm16] Fix outdated first-cut test and finish saved nine-price approval335'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: /scripts/
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install requests==2.32.5
      - name: Exact price execution safeguards
        run: PYTHONPATH=scripts python -m unittest discover -s scripts -p test_china_price_apply.py
      - name: Existing human confirmation335 only, no new approval or paid model
        env:
          WB_TOKEN_3: ${{ secrets.WB_TOKEN_3 }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          CHINA_TELEGRAM_BOT_TOKEN: ${{ secrets.CHINA_TELEGRAM_BOT_TOKEN }}
          OPENAI_API_KEY: ''
        run: python scripts/owner_price_confirm16.py

