name: Owner retain two bounded first5 price tests16
on:
  push:
    branches: [main]
    paths: [.github/workflows/owner-price-test5-16.yml]
permissions: {contents: read}
concurrency:
  group: owner-price-test5-16-report
  cancel-in-progress: false
jobs:
  review:
    if: github.run_attempt == 1 && github.event.head_commit.message == '[owner-price-test5-16] Retain two positive-economics first5 tests in the combined report'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /scripts/
            /.github/
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install requests==2.32.5 pillow==11.3.0 python-dotenv simplejson==4.2.0
      - name: Offline policy and economics safeguards
        run: |
          PYTHONPATH=scripts python -m unittest discover -s scripts -p 'test_price_bounded_test5.py'
          PYTHONPATH=scripts python -m unittest discover -s scripts -p 'test_price_rules31.py'
      - name: Exact current readback and same combined report edit only
        env:
          OPENAI_API_KEY: ''
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          WB_TOKEN_3: ${{ secrets.WB_TOKEN_3 }}
          MOYSKLAD_API_TOKEN: ${{ secrets.MOYSKLAD_API_TOKEN }}
          CHINA_TELEGRAM_BOT_TOKEN: ${{ secrets.CHINA_TELEGRAM_BOT_TOKEN }}
          PYTHONPATH: scripts
        run: python scripts/owner_price_test5_16.py

