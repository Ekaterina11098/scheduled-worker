name: Owner exclusion016 and package verification
on:
  push:
    branches: [main]
    paths: [.github/workflows/owner-016-alternate-read17.yml]
permissions: {contents: read}
concurrency:
  group: bot-mpstats-data
  cancel-in-progress: false
jobs:
  read:
    if: github.run_attempt == 1 && github.event.head_commit.message == '[owner-016-alternate-read17] Read alternate WB campaign queries'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /scripts/
      - uses: actions/checkout@v4
        with:
          repository: Ekaterina11098/VESCHI_AI
          ref: a7efd98c6ef7e54f415471abcb694c748c2b4f6d
          token: ${{ secrets.SOURCE_READ_TOKEN }}
          path: source
          persist-credentials: false
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /analytics/
            /china_agent/
            /business_agents/
            /advertising_agent/
            /*.py
      - uses: actions/checkout@v4
        with:
          repository: Ekaterina11098/VESCHI_AI
          ref: df8b75744007a7518f2c306bac0b274d1decaeda
          token: ${{ secrets.SOURCE_READ_TOKEN }}
          path: stock-source
          persist-credentials: false
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /stock_current_order_reserve.py
            /stock_unposted_orders.py
            /stock_operation_store.py
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install requests==2.32.5 python-dotenv simplejson==4.2.0 openai==3.42.1
      - run: python -m py_compile scripts/owner_016_alternate_read17.py scripts/china_daily_ad_actions.py
      - env:
          PYTHONPATH: scripts
        run: python -m unittest discover -s scripts -p test_china_package_readback.py
      - env:
          PYTHONPATH: scripts:stock-source:source
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          WB_TOKEN_1: ${{ secrets.WB_TOKEN_1 }}
          WB_TOKEN_2: ${{ secrets.WB_TOKEN_2 }}
          WB_TOKEN_3: ${{ secrets.WB_TOKEN_3 }}
          MPSTATS_API_TOKEN: ${{ secrets.MPSTATS_API_TOKEN }}
          MOYSKLAD_API_TOKEN: ${{ secrets.MOYSKLAD_API_TOKEN }}
          OPENAI_API_KEY: ''
          CHINA_TELEGRAM_BOT_TOKEN: ''
        run: python scripts/owner_016_alternate_read17.py


