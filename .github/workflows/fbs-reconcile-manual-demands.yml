name: Reconcile verified existing FBS manual documents
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: fbs-document-chain-production
  cancel-in-progress: false
jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: scripts
      - name: Test FBS safeguards
        run: python -m unittest discover -s scripts -p 'test_fbs*.py'
      - name: Verify and reconcile existing documents without commercial writes
        env:
          MOYSKLAD_API_TOKEN: ${{ secrets.MOYSKLAD_API_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        shell: python
        run: |
          import copy,os,sys
          sys.path.insert(0,'scripts')
          import fbs_document_chain as m
          assert os.environ['GITHUB_REPOSITORY']=='Ekaterina11098/scheduled-worker'
          class ReadOnlyCommercial(m.Transport):
              def request(self,base,path,method='GET',body=None,params=None):
                  if base==m.WB or base==m.MS and method!='GET':raise m.Stop('Commercial writes and WB calls prohibited')
                  return super().request(base,path,method,body,params)
          t=ReadOnlyCommercial();db=m.Cache(t);config=db.get(m.CONFIG)
          prior=db.get('diagnostic:fbs_stock_linked_docs:20261117')
          assert prior and len(prior['supplies'])==2
          prepared=[]
          for found in prior['supplies']:
              sid=found['supply_id'];key=m.PREFIX+sid;original=db.get(key)
              assert original and original['supply']['id']==sid
              assert len(found['shipments'])==1 and len(found['shipments'][0]['returns'])==1
              state=copy.deepcopy(original);w=m.Worker(t,db,config)
              w._annotation_positions=state['positions']
              annotation=w.order_annotation(state['supply'],state.get('warehouse_routing'))
              assert annotation
              docs={'customerorder':found['order'],'demand':found['shipments'][0]['document'],'salesreturn':found['shipments'][0]['returns'][0]['document']}
              links={};payloads={};verified={}
              for typ in m.TYPES:
                  payload=copy.deepcopy(config['templates'][typ])
                  routing=state.get('warehouse_routing')
                  if routing:
                      ident=routing['return_store_id'] if typ=='salesreturn' else routing['source_store_id']
                      payload['store']['meta']['href']=m.MS+'entity/store/'+ident
                  payload.update(positions=state['positions'],applicable=True,description=annotation['description'])
                  if typ=='customerorder':payload['name']=sid
                  elif typ=='demand':payload['customerOrder']=links['customerorder']
                  else:payload['demand']=links['demand']
                  doc=t.request(m.MS,'entity/'+typ+'/'+docs[typ]['id'])
                  w.verify(typ,doc,payload)
                  assert doc.get('description')==annotation['description']
                  links[typ]=m.meta(doc);payloads[typ]=payload;verified[typ]=doc
              assert m.href(verified['customerorder'].get('state',{}))==m.href(annotation['state'])
              prepared.append((key,original,state,w,payloads,verified,annotation))
          results=[]
          for key,original,state,w,payloads,verified,annotation in prepared:
              assert db.get(key)==original,'State changed concurrently'
              backup='diagnostic:fbs_before_manual_chain_reconciliation:'+state['supply']['id']
              if db.get(backup) is None:db.put(backup,{'at':m.now(),'original_state':original,'run_id':os.environ['GITHUB_RUN_ID']})
              for typ in m.TYPES:
                  adopted=w.ensure(typ,payloads[typ],state,key)
                  assert m.href(adopted)==m.href(verified[typ]),'Unexpected document chosen'
              assert state.get('reconciled_linked_demand') and state.get('reconciled_linked_return')
              intermediate=copy.deepcopy(state)
              state.update(status='complete',completed_at=m.now(),reconciled_at=m.now(),reconciliation_run_id=os.environ['GITHUB_RUN_ID'],reconciliation_commercial_writes=0)
              state['order_annotation']={'state_name':config['order_annotation']['state_name'],'description':annotation['description']}
              state.pop('error',None)
              if 'stock_shortages' in state:state['resolved_stock_shortages']=state.pop('stock_shortages')
              assert db.get(key)==intermediate
              db.put(key,state)
              # A second reconciliation must select exactly the same documents.
              for typ in m.TYPES:
                  assert m.href(w.ensure(typ,payloads[typ],state,key))==m.href(verified[typ])
              state.update(status='complete',replay_verified_at=m.now())
              db.put(key,state)
              results.append({'supply_id':state['supply']['id'],'status':db.get(key)['status'],'documents':state['documents'],'quantity':sum(p['quantity'] for p in state['positions']),'commercial_writes':0,'replay_verified':True})
          db.put('diagnostic:fbs_manual_chain_reconciliation:20261118',{'at':m.now(),'run_id':os.environ['GITHUB_RUN_ID'],'results':results,'commercial_writes':0})
          print('Existing document reconciliation verified; supplies=',len(results),'commercial writes=0; replay verified')
