name: Verify IP rules reports with saved data only
on:
  push:
    paths: [.github/workflows/verify-ip-report-rules.yml]
  workflow_dispatch:
permissions: {contents: read}
concurrency: {group: ip-rules-saved-verification, cancel-in-progress: false}
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 9eabfaf3fdacf6b0328f8630d92af3ae8014f93d
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*.py
      - uses: actions/checkout@v4
        with:
          ref: 8b925020156e32bd289b6c0e83306ab7a72748e1
          path: ip-rules-patch
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /ip_report_analysis.py
            /test_ip_report_analysis.py
            /verify_ip_report_rules.py
      - run: cp ip-rules-patch/*.py .
      - uses: actions/checkout@v4
        with:
          repository: Ekaterina11098/VESCHI_AI
          ref: dfa9651d7f18589ca1c8a1c8de020774be963261
          token: ${{ secrets.SOURCE_READ_TOKEN }}
          persist-credentials: false
          path: private-source
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install requests==2.32.5 cryptography==46.0.2 Pillow==12.3.0 > "$RUNNER_TEMP/dependencies.log" 2>&1
      - name: Offline regression
        run: python -m unittest test_ip_cloud_dialog test_ip_report_analysis test_full_retained_review test_ip_restrictions
      - name: Verify both saved reports without source API, model or Telegram credentials
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          OPENAI_API_KEY: ""
        run: |
          if python verify_ip_report_rules.py > "$RUNNER_TEMP/verification.log" 2>&1; then
            cat "$RUNNER_TEMP/verification.log"
          else
            echo "Saved-data verification failed; private log was not published."
            exit 1
          fi
