name: Owner remove unsolicited old price notices
on:
  push:
    branches: [main]
    paths: [.github/workflows/owner-price-notice-cleanup18.yml]
permissions: {}
jobs:
  cleanup:
    if: github.run_attempt == 1 && github.event.head_commit.message == '[owner-cleanup18] Delete three unsolicited historical price notices'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install --quiet requests==2.32.5
      - name: Delete exact owner-selected extras without WB access
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          CHINA_TELEGRAM_BOT_TOKEN: ${{ secrets.CHINA_TELEGRAM_BOT_TOKEN }}
        shell: python
        run: |
          import os,json,requests
          from datetime import datetime,timezone
          sb=os.environ['SUPABASE_URL'].rstrip('/');sk=os.environ['SUPABASE_SECRET_KEY']
          h={'apikey':sk,'Authorization':'Bearer '+sk,'Content-Type':'application/json'}
          root='china_agent:owner_price_notice_cleanup18:v1'
          def stamp():return datetime.now(timezone.utc).isoformat()
          def put(k,p,create=False):
           r=requests.post(sb+'/rest/v1/telegram_api_cache?on_conflict=cache_key',headers={**h,'Prefer':'resolution='+('ignore-duplicates' if create else 'merge-duplicates')+',return=representation'},json={'cache_key':k,'payload':p,'updated_at':stamp(),'expires_at':'2036-11-18T00:00:00Z'},timeout=30);r.raise_for_status()
           if create:assert len(r.json())==1,'Already claimed; do not repeat'
          token=os.environ['CHINA_TELEGRAM_BOT_TOKEN'];url='https://api.telegram.org/bot'+token+'/'
          r=requests.get(url+'getMe',timeout=30);assert r.status_code==200 and r.json()['result']['id']==8780468043
          put(root+':execution',{'status':'running','owner_quote':'удали из тГ лишнее','chat_id':-1004342917488,'message_ids':[1096,1097,1098],'preserve':[1093,1094,1095],'started_at':stamp()},True)
          results=[]
          for mid in [1096,1097,1098]:
           key=root+':message:'+str(mid)
           put(key,{'status':'submitting','message_id':mid,'submitted_at':stamp()},True)
           try:
            r=requests.post(url+'deleteMessage',json={'chat_id':-1004342917488,'message_id':mid},timeout=30)
            ok=r.status_code==200 and r.json().get('ok') is True and r.json().get('result') is True
            result={'status':'deleted' if ok else 'failed','message_id':mid,'http_status':r.status_code,'confirmed':ok,'checked_at':stamp()}
           except Exception:
            result={'status':'uncertain','message_id':mid,'confirmed':False,'checked_at':stamp()}
           put(key,result);results.append(result)
          final={'status':'verified' if all(x['confirmed'] for x in results) else 'attention_required','chat_id':-1004342917488,'results':results,'preserved_message_ids':[1093,1094,1095],'wb_writes':0,'telegram_sends':0,'completed_at':stamp()}
          put(root+':execution',final);print(json.dumps(final))
