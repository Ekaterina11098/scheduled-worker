name: IP reports prepared early and delivered by the existing cloud clock
on:
  workflow_dispatch:
    inputs:
      slot:
        description: Approved IP report slot
        required: true
        type: choice
        options: [morning, midday]
      verify_only:
        description: Saved-data verification only, no sources or report delivery
        required: true
        default: false
        type: boolean
permissions: {contents: read}
concurrency:
  group: ip-report-preparation
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 9eabfaf3fdacf6b0328f8630d92af3ae8014f93d
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*.py
      - uses: actions/checkout@v4
        with:
          repository: Ekaterina11098/VESCHI_AI
          ref: dfa9651d7f18589ca1c8a1c8de020774be963261
          token: ${{ secrets.SOURCE_READ_TOKEN }}
          persist-credentials: false
          path: private-source
      - name: Apply isolated IP rules review
        uses: actions/checkout@v4
        with:
          ref: 8b925020156e32bd289b6c0e83306ab7a72748e1
          path: ip-rules-patch
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /ip_report_analysis.py
            /test_ip_report_analysis.py
      - name: Install reviewed rules module
        run: cp ip-rules-patch/ip_report_analysis.py ip-rules-patch/test_ip_report_analysis.py .
      - name: Apply campaign scope reconciliation
        uses: actions/checkout@v4
        with:
          ref: 22b202d06e3480f8ed526377be158fb42ad979b2
          path: ip-scope-patch
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /ip_report_freeze.py
            /ip_campaign_table_png.py
            /ip_scheduled_source.py
            /test_ip_catalog_scope.py
      - name: Install reviewed scope reconciliation
        run: |
          cp ip-scope-patch/ip_report_freeze.py ip-scope-patch/ip_scheduled_source.py ip-scope-patch/test_ip_catalog_scope.py .
          cp ip-scope-patch/ip_campaign_table_png.py .
          cp ip-scope-patch/ip_campaign_table_png.py private-source/
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install requests==2.32.5 cryptography==46.0.2 Pillow==12.3.0 > "$RUNNER_TEMP/dependencies.log" 2>&1
      - name: Offline economic, scope, budget and dedup regression
        run: python -m unittest test_ip_cloud_dialog test_ip_report_analysis test_full_retained_review test_ip_restrictions test_ip_catalog_scope
      - name: Reuse dated data and read only missing report fields; no WB credentials
        if: inputs.verify_only != true
        env:
          IP_REPORT_SLOT: ${{ inputs.slot }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          MPSTATS_API_TOKEN: ${{ secrets.MPSTATS_API_TOKEN }}
        run: python ip_scheduled_source.py
      - name: Freeze private PNGs or verify saved example; never send from the runner
        env:
          IP_REPORT_SLOT: ${{ inputs.slot }}
          IP_REPORT_VERIFY_ONLY: ${{ inputs.verify_only && 'true' || 'false' }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          ADVERTISING_TELEGRAM_BOT_TOKEN: ${{ secrets.ADVERTISING_TELEGRAM_BOT_TOKEN }}
          OPENAI_API_KEY: ""
        run: |
          if [ "$IP_REPORT_VERIFY_ONLY" = "true" ]; then
            python -c 'import json;from ip_report_freeze import credentials,main;credentials();r=main();print(json.dumps({k:r.get(k) for k in ("status","period","model_calls","charged_micro_usd","source_calls","wb_writes","telegram_calls")}))'
          else
            python ip_report_freeze.py
          fi
