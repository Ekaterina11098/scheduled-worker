name: Read-only MS endpoint diagnosis24Nov
on:
  push:
    paths: ['.github/workflows/ms-endpoint-diagnosis-20261124.yml']
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Compare exact stock catalogue endpoint availability without reading business values
        env:
          MS_TOKEN: ${{ secrets.MOYSKLAD_API_TOKEN }}
        run: |
          python - <<'PY'
          import os,json,urllib.request,urllib.error,time,concurrent.futures
          def probe(kind):
              url='https://api.moysklad.ru/api/remap/1.2/entity/'+kind+'?limit=1000&filter=archived%3Dfalse%3Barchived%3Dtrue'
              req=urllib.request.Request(url,headers={'Authorization':'Bearer '+os.environ['MS_TOKEN'],'Accept-Encoding':'gzip'})
              began=time.time()
              try:
                  with urllib.request.urlopen(req,timeout=25) as r: result={'endpoint':kind,'status':r.status,'elapsed':round(time.time()-began,2)}
              except urllib.error.HTTPError as e:result={'endpoint':kind,'status':e.code,'elapsed':round(time.time()-began,2)}
              except Exception as e:result={'endpoint':kind,'error_type':type(e).__name__,'elapsed':round(time.time()-began,2)}
              print(json.dumps(result),flush=True)
          with concurrent.futures.ThreadPoolExecutor(max_workers=3) as ex:list(ex.map(probe,['product','variant']))
          PY
