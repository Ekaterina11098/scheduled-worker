name: Daily China midday green report 15:00 MSK
# Ready-candidate recovery 13Nov, all four directions and category minima: use existing idempotent Supabase retries; no model or WB writes.
on:
  push:
    branches: [main]
    paths: ['.github/workflows/china-advertising-midday.yml']
  schedule:
    - cron: '45 11 * * *' # Full preparation at 14:45 MSK; no Telegram delivery before 15:00.
    - cron: '0,15,30,45 12 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: china-midday-advertising-report
  cancel-in-progress: false
jobs:
  daily:
    if: github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /scripts/
            /.github/
            /*request*.json
      - uses: actions/checkout@v4
        with:
          repository: Ekaterina11098/VESCHI_AI
          ref: a7efd98c6ef7e54f415471abcb694c748c2b4f6d
          token: ${{ secrets.SOURCE_READ_TOKEN }}
          path: source
          persist-credentials: false
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /analytics/
            /business_agents/
            /advertising_agent/
            /china_agent/
            /tests/
            /*.py
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install requests==2.32.5 python-dotenv simplejson==4.2.0 pillow==11.3.0 openai==3.42.1 > "$RUNNER_TEMP/install.log" 2>&1
      - name: Check advertising arithmetic and duplicate safeguards
        run: PYTHONPATH=scripts python -m unittest discover -s scripts -p 'test_china_advertising_*.py'
      - name: Read current China day and publish exact owner-approved report or fully prepare next green report
        working-directory: source
        env:
          OPENAI_API_KEY: "" # Owner: no model API for this report; Telegram dialogue is separate.
          MPSTATS_API_TOKEN: ${{ secrets.MPSTATS_API_TOKEN }}
          MOYSKLAD_API_TOKEN: ${{ secrets.MOYSKLAD_API_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          WB_TOKEN_3: ${{ secrets.WB_TOKEN_3 }}
          CHINA_TELEGRAM_BOT_TOKEN: ${{ secrets.CHINA_TELEGRAM_BOT_TOKEN }}
        run: PYTHONPATH=../scripts:. python ../scripts/china_advertising_midday.py

# Read-only transport: bounded retry after transient WB connection failure; preserve prepared economics and report identity.

