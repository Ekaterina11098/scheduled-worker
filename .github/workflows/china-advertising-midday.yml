#18Nov: missing-ack package readback stays uncertain; production checks retained.

#18Nov: WB429 respects cooldown and resumes the saved read-only collection.

#18Nov: preserve existing two-attempt read transport bound.

#18Nov: safely parse legacy pause receipts and resume prepared report.

#19Nov: retain canonical wording for same facts and exact actions; real action conflicts remain blocked.

#19Nov: presentation reuse requires the same instruction, with full semantic-conflict tests.

#19Nov: pending first-full-day rows without actions retain the canonical waiting decision.

#20Nov: registry-history fixtures use explicit empty batches; all arithmetic and duplicate checks stay enabled.

#20Nov: confirmed terminal archive before the report window cannot block active-campaign review; history retained.
