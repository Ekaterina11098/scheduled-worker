                  if c['nmID'] not in by or c.get('updatedAt','')>=by[c['nmID']].get('updatedAt',''):by[c['nmID']]=c
              return by,len(cards)==len(by)
          def signature(by):return digest([[n,c['imtID'],content(c)] for n,c in sorted(by.items())])
          def read_before():
              previous=None
              for attempt in range(7):
                  by,unique=scan()
                  if unique and by:
                      sig=signature(by)
                      if sig==previous:return by
                      previous=sig
                  time.sleep(5)
              raise RuntimeError('Preflight catalog did not stabilize')
          def members(by,imt):return {n for n,c in by.items() if c['imtID']==imt}
          def compact(by):
              return [{k:c.get(k) for k in ('nmID','imtID','vendorCode','subjectID','subjectName','title')} for n,c in sorted(by.items())]
          try:
              assert token
              before=read_before();out['beforeCount']=len(before);out['membershipBefore']=compact(before)
              expected=set();group_ids={}
              for group in PLAN:
                  ids={entry[0] for entry in group['cards']}
                  assert 1<=len(ids)<=30 and not(expected&ids),'Invalid approved partition'
                  expected|=ids;group_ids[group['number']]=ids
                  for nm,sku_hash in group['cards']:
                      assert nm in before,'Approved card missing: '+str(nm)
                      c=before[nm]
                      assert hashlib.sha256(c['vendorCode'].lower().encode()).hexdigest()==sku_hash,'Article identity mismatch'
                  assert len({before[n]['subjectID'] for n in ids})==1,'Subcategory mismatch'
              assert len(expected)==247 and len(PLAN)==10
              out['beforeContentHashes']={str(n):content(c) for n,c in before.items()}
              out['preflightAt']=datetime.now(timezone.utc).isoformat()
              for group in PLAN:
                  ids=group_ids[group['number']]
                  imts={before[n]['imtID'] for n in ids}
                  if len(imts)==1 and members(before,next(iter(imts)))==ids:
                      out['requests'].append({'group':group['number'],'status':'already_correct','imtID':next(iter(imts))});continue
                  # WB: separating several nmIDs in a single request merges them under one new imtID.
                  # Every request contains exactly one approved final group, with at most 30 cards.
                  request('/content/v2/cards/moveNm',{'nmIDs':[e[0] for e in group['cards']]},write=True)
                  out['requests'][-1]['group']=group['number']
                  time.sleep(2)
              out['status']='writes_accepted_verifying'
              last_issues=[]
              for attempt in range(12):
                  time.sleep(10 if attempt else 8)
                  after,unique=scan();issues=[]
                  if set(after)!=set(before):issues.append('Active card set changed')
                  else:
                      for group in PLAN:
                          ids=group_ids[group['number']];imts={after[n]['imtID'] for n in ids}
                          if len(imts)!=1 or members(after,next(iter(imts)))!=ids:issues.append('Group membership mismatch '+str(group['number']))
                      unexpected=[n for n in before if n not in expected and before[n]['imtID']!=after[n]['imtID']]
                      if unexpected:issues.append('Unrelated membership changed')
                      different=[n for n in before if content(before[n])!=content(after[n])]
                      if different:issues.append('Content changed')
                  out['membershipAfter']=compact(after);out['afterCount']=len(after);out['verificationAttempts']=attempt+1
                  last_issues=issues
                  if not issues:
                      out.update(verified=True,status='complete',allCardsPreserved=True,unrelatedGroupsPreserved=True,contentEqual=True)
                      out['groups']=[{'number':g['number'],'imtID':after[g['cards'][0][0]]['imtID'],'count':len(g['cards'])} for g in PLAN]
                      out['changes']=[{'nmID':n,'vendorCode':before[n]['vendorCode'],'fromIMT':before[n]['imtID'],'toIMT':after[n]['imtID'],'group':next(g['number'] for g in PLAN if n in group_ids[g['number']])} for n in sorted(expected) if before[n]['imtID']!=after[n]['imtID']]
                      break
              else:raise RuntimeError('Verification incomplete: '+', '.join(last_issues))
          except Exception as exc:
              out['status']='incomplete';out['error']={'type':type(exc).__name__,'message':str(exc),'trace':traceback.format_exc()}
          finally:
              out['finishedAt']=datetime.now(timezone.utc).isoformat()
              raw=gzip.compress(json.dumps(out,ensure_ascii=False).encode());key=secrets.token_bytes(32);nonce=secrets.token_bytes(12)
              pub=serialization.load_pem_public_key(PUBLIC_KEY.encode());b=lambda v:base64.b64encode(v).decode()
              env={'key':b(pub.encrypt(key,padding.OAEP(mgf=padding.MGF1(hashes.SHA256()),algorithm=hashes.SHA256(),label=None))),'nonce':b(nonce),'ciphertext':b(AESGCM(key).encrypt(nonce,raw,None))}
              encoded=b(json.dumps(env).encode())
              for i in range(0,len(encoded),18000):print('APPROVED_GROUPS_ENCRYPTED '+str(i//18000)+' '+encoded[i:i+18000],flush=True)
              print('APPROVED_GROUP_APPLICATION_FINISHED',flush=True)
          
