name: Owner beige5 approved gallery and description
on:
  push:
    branches: [main]
    paths: [.github/workflows/owner-fur5-gallery19.yml]
permissions: {}
concurrency:
  group: bot-mpstats-data
  cancel-in-progress: false
jobs:
  apply:
    if: github.run_attempt == 1 && github.event.head_commit.message == '[owner-fur5-gallery19] Approved eleven photos description preserve video'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install --quiet requests==2.32.5 pillow==11.3.0
      - name: Apply approved beige5 only
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          WB_TOKEN_3: ${{ secrets.WB_TOKEN_3 }}
        shell: python
        run: |
          import os,json,time,base64,hashlib,io,copy
          from datetime import datetime,timezone
          import requests
          from PIL import Image,ImageChops,ImageStat
          ROOT='china_agent:owner_fur5_gallery19';NM=2215883910
          sb=os.environ['SUPABASE_URL'].rstrip('/');sk=os.environ['SUPABASE_SECRET_KEY']
          sh={'apikey':sk,'Authorization':'Bearer '+sk,'Content-Type':'application/json'};wh={'Authorization':os.environ['WB_TOKEN_3']}
          def stamp():return datetime.now(timezone.utc).isoformat()
          def cache(k):
           r=requests.get(sb+'/rest/v1/telegram_api_cache',headers=sh,params={'cache_key':'eq.'+k,'select':'payload'},timeout=45);r.raise_for_status();v=r.json();return v[0]['payload']if v else None
          def put(k,p,create=False):
           r=requests.post(sb+'/rest/v1/telegram_api_cache?on_conflict=cache_key',headers={**sh,'Prefer':'resolution='+('ignore-duplicates'if create else'merge-duplicates')+',return=representation'},json={'cache_key':k,'payload':p,'updated_at':stamp(),'expires_at':'2036-11-19T00:00:00Z'},timeout=45);r.raise_for_status()
           if create:assert len(r.json())==1,'Already claimed; no replay'
          def card():
           r=requests.post('https://content-api.wildberries.ru/content/v2/get/cards/list',headers=wh,json={'settings':{'cursor':{'limit':100},'filter':{'textSearch':str(NM),'withPhoto':-1}}},timeout=45);r.raise_for_status();v=[c for c in r.json()['cards']if c['nmID']==NM];assert len(v)==1 and v[0]['vendorCode']=='5-furcoat-beige';return v[0]
          def price():
           r=requests.get('https://discounts-prices-api.wildberries.ru/api/v2/list/goods/filter',headers=wh,params={'limit':100,'offset':0,'filterNmID':NM},timeout=45);r.raise_for_status();return r.json()['data']['listGoods']
          def stable(c):
           d={k:c.get(k)for k in('nmID','vendorCode','title','brand','sizes','video','characteristics','dimensions','kizMarked')};d['characteristics']=sorted(d['characteristics'],key=lambda x:x['id']);return d
          def thumb(b):return Image.open(io.BytesIO(b)).convert('RGB').resize((192,256))
          a=cache(ROOT+':approval');assert a['status']=='approved'and a['nm_id']==NM and a['preserve_video']and datetime.now(timezone.utc)<datetime.fromisoformat(a['expires_at'])
          assert not cache(ROOT+':execution'),'Already executed; no replay'
          sources=[]
          for i in range(1,12):
           p=cache(ROOT+':source:'+str(i));b=base64.b64decode(p['data'],validate=True);assert hashlib.sha256(b).hexdigest()==a['hashes'][i-1]==p['sha256'];assert Image.open(io.BytesIO(b)).size==(1086,1448);sources.append((p,b))
          before=card();prices=price();assert before.get('video')and len(before['photos'])==18
          e={'status':'preflight_verified','before':before,'prices_before':prices,'created_at':stamp(),'approval_key':ROOT+':approval','steps':[],'wb_writes':0,'telegram_calls':0,'price_writes':0,'advertising_writes':0}
          put(ROOT+':execution',e,True)
          try:
           assert stable(card())==stable(before)
           for p,b in sources:
            assert cache(ROOT+':approval')==a
            step={'slot':p['slot'],'sha256':p['sha256'],'status':'submitted_uncertain_no_replay','at':stamp()};e['steps'].append(step);e.update(wb_writes=e['wb_writes']+1,status='submitting');put(ROOT+':execution',e)
            r=requests.post('https://content-api.wildberries.ru/content/v3/media/file',headers={**wh,'X-Nm-Id':str(NM),'X-Photo-Number':str(p['slot'])},files={'uploadfile':('beige5-'+str(p['slot'])+'.jpg',b,'image/jpeg')},timeout=90);step['http_status']=r.status_code;r.raise_for_status();step['response']=r.json();assert not step['response'].get('error');step['status']='accepted';put(ROOT+':execution',e);time.sleep(10)
           current=card();assert stable(current)==stable(before)and current['description']==before['description']
           d={k:copy.deepcopy(current[k])for k in('nmID','vendorCode','brand','title','kizMarked','sizes')};d['dimensions']={k:v for k,v in current['dimensions'].items()if k!='isValid'};d['characteristics']=[{'id':x['id'],'value':x['value']}for x in current['characteristics']];d['description']=a['description'];assert len(d['description'])<2000
           e.update(status='description_submitted_uncertain_no_replay',description_request=d,wb_writes=e['wb_writes']+1);put(ROOT+':execution',e)
           r=requests.post('https://content-api.wildberries.ru/content/v2/cards/update',headers=wh,json=[d],timeout=60);e['description_response_status']=r.status_code;r.raise_for_status();e['description_response']=r.json();assert not e['description_response'].get('error');put(ROOT+':execution',e)
           for attempt in range(8):
            time.sleep(20);after=card();assert stable(after)==stable(before),'Non-content fields/video mismatch';checks=[]
            for p,b in sources:
             r=requests.get(after['photos'][p['slot']-1]['big'],params={'verify':str(int(time.time()))},timeout=45);r.raise_for_status();diff=sum(ImageStat.Stat(ImageChops.difference(thumb(r.content),thumb(b))).mean)/3;checks.append({'slot':p['slot'],'difference':round(diff,4),'matches':diff<8})
            e.update(after=after,photo_verification=checks,readback_at=stamp(),attempt=attempt+1);put(ROOT+':execution',e)
            if all(x['matches']for x in checks)and after['description']==a['description']:break
           else:raise RuntimeError('Readback pending; never replay')
           assert price()==prices
           e.update(status='slots_description_verified_pending_trim',video_unchanged=True,prices_unchanged=True,other_fields_unchanged=True,verified_at=stamp());put(ROOT+':execution',e)
           print(json.dumps({'status':e['status'],'photos':len(after['photos']),'video_unchanged':True}))
          except Exception as ex:
           e.update(status='needs_readback_no_replay',reason=type(ex).__name__+': '+str(ex)[:250]);put(ROOT+':execution',e);raise

