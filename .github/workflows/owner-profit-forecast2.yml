name: Owner requested preliminary profit2Nov
on:
  push:
    branches: [main]
    paths: ['scripts/owner_profit_forecast2.py']
permissions: {contents: read}
jobs:
  apply:
    if: ${{ false }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    concurrency: {group: china-dialog-data, cancel-in-progress: false}
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false, sparse-checkout: scripts}
      - uses: actions/checkout@v4
        with:
          repository: Ekaterina11098/VESCHI_AI
          ref: a7efd98c6ef7e54f415471abcb694c748c2b4f6d
          token: ${{ secrets.SOURCE_READ_TOKEN }}
          path: source
          persist-credentials: false
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install requests==2.32.5
      - name: Read current scoped forecast inputs and save private result
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          WB_TOKEN_3: ${{ secrets.WB_TOKEN_3 }}
          MOYSKLAD_API_TOKEN: ${{ secrets.MOYSKLAD_API_TOKEN }}
          CHINA_TELEGRAM_BOT_TOKEN: unused-no-telegram-capability
        run: PYTHONPATH=scripts:source python scripts/owner_profit_forecast2.py
