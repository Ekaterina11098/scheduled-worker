name: Verify completed Guangzhou migration and IP FBS zero26Nov
on:
  push:
    paths: ['.github/workflows/stock-gz-migration-audit-20261126.yml']
permissions:
  contents: read
concurrency:
  group: bot-stock
  cancel-in-progress: false
jobs:
  stock:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: |
            content_group_destination.py
            stock_deploy_support.py
            warehouse_id_patch.py
            scripts/moysklad_warehouses.py
          sparse-checkout-cone-mode: false
      - uses: actions/checkout@v4
        with:
          repository: Ekaterina11098/VESCHI_AI
          ref: 40c6a7ef4a34f7ecb739578091e26af1295e55da
          token: ${{ secrets.SOURCE_READ_TOKEN }}
          persist-credentials: false
          path: private-source
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests==2.32.5 python-dotenv==1.1.1 aiogram==3.22.0 simplejson==4.2.0 'psycopg[binary]==3.2.9' cryptography > "$RUNNER_TEMP/daily-install.log" 2>&1
      - name: Fresh stock calculation and newly created stock-only notifications
        env:
          PYTHONPATH: ${{ github.workspace }}/private-source:${{ github.workspace }}
          STOCK_DAILY_ENABLED: 'true'
          STOCK_OZON_ENABLED: 'true'
          STOCK_PENDING_RESERVE_ENABLED: 'true'
          STOCK_CANCELLATION_RESTORE_ENABLED: 'true'
          STOCK_RUN_SLOT: ${{ github.event_name == 'workflow_dispatch' && inputs.slot || ((github.event.schedule == '0 2 * * *' || github.event.schedule == '10,20,30,40,50 2 * * *' || github.event.schedule == '*/10 3-8 * * *') && '0700' || '1630') }}
          STOCK_NOTIFICATIONS_ENABLED: 'true'
          STOCK_CLOUD_EXECUTION_ENABLED: 'true'
          STOCK_JOURNAL_IMPORT_ACCEPTED: 'true'
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          WB_TOKEN_1: ${{ secrets.WB_TOKEN_1 }}
          WB_TOKEN_2: ${{ secrets.WB_TOKEN_2 }}
          WB_TOKEN_3: ${{ secrets.WB_TOKEN_3 }}
          WB_FINANCE_TOKEN_1: ${{ secrets.WB_FINANCE_TOKEN_1 }}
          WB_FINANCE_TOKEN_2: ${{ secrets.WB_FINANCE_TOKEN_2 }}
          WB_FINANCE_TOKEN_3: ${{ secrets.WB_TOKEN_3 }}
          WB_STOCK_WAREHOUSE_1: ${{ vars.WB_STOCK_WAREHOUSE_1 }}
          WB_STOCK_WAREHOUSE_2: ${{ vars.WB_STOCK_WAREHOUSE_2 }}
          WB_STOCK_WAREHOUSE_3: ${{ vars.WB_STOCK_WAREHOUSE_3 }}
          MOYSKLAD_API_TOKEN: ${{ secrets.MOYSKLAD_API_TOKEN }}
          MOYSKLAD_STORE_NAME: МСК
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ALLOWED_CHAT_ID: ${{ secrets.TELEGRAM_ALLOWED_CHAT_ID }}
          AUTO_STOCK_FAIL_FAST: '1'
        run: |
          python warehouse_id_patch.py private-source
          python - <<'PY'
          import time,json
          import stock_deploy_support as support,tg_agent_new as g
          import stock_guangzhou_relocate_20261126 as m
          from stock_operation_store import Store,canonical,digest
          from stock_china_mgt import policy,WB_WAREHOUSE
          g.RUN_DEADLINE=time.monotonic()+500
          api=g.api
          def readonly(method,url,*a,**kw):
              assert method in ('GET','POST')
              return api(method,url,*a,**kw)
          g.api=readonly
          with support.runtime_db() as db:
              store=Store(db,postgres=True);root=m.saved(store);ops=store.operations(m.ROOT)
          assert root['execution_complete'] and root['old_warehouse_zero'] and all(state=='confirmed' for s,b,state,t in ops)
          assert policy()['wb_warehouse_id']==WB_WAREHOUSE==2393088
          ids=sorted(r['chrtId'] for r in root['backup']['catalog'])
          allstocks={wh:m.read(g,wh,ids) for wh in (2308581,2373413,2393088)}
          assert all(q==0 for wh in (2308581,2373413) for q in allstocks[wh].values())
          assert {int(k) for k in root['backup']['old']}.issubset(allstocks[2373413])
          expected={b['location']['chrtId']:b['target'] for s,b,state,t in ops if b['phase']=='publish_new'}
          assert all(allstocks[2393088].get(i)==q for i,q in expected.items())
          assert not any(q>0 and i not in expected for i,q in allstocks[2393088].items())
          token=g.cabinet_tokens()[1];cursor={'limit':100};cards=[];seen=set()
          for _ in range(100):
              v=g.api('POST',g.WB_CONTENT+'/content/v2/get/cards/list',token,json={'settings':{'cursor':cursor,'filter':{'withPhoto':-1}}},retry_read_network=True)
              if not isinstance(v.get('cards'),list):v=v.get('data',{})
              rows=v.get('cards');assert isinstance(rows,list);cards+=rows
              if len(rows)<100:break
              marker=(v['cursor'].get('updatedAt'),v['cursor'].get('nmID'));assert all(marker) and marker not in seen;seen.add(marker)
              cursor=dict(limit=100,updatedAt=marker[0],nmID=marker[1]);time.sleep(.7)
          else:raise AssertionError('IP catalogue incomplete')
          ipids=set()
          for card in cards:
              for size in card.get('sizes',[]):
                  ident=size.get('chrtID',size.get('chrtId'))
                  if ident is None:
                      assert not size.get('skus');continue
                  assert type(ident) is int and ident>0;ipids.add(ident)
          warehouses=g.api('GET',g.WB_MARKET+'/api/v3/warehouses',token,retry_read_network=True)
          ipwh=sorted(w['id'] for w in warehouses if w.get('deliveryType')==1 and not w.get('isDeleting') and not w.get('isDeleted'))
          assert ipids and 854652 in ipwh
          for wh in ipwh:
              values=g.get_real_wb_stocks(token,sorted(ipids),wh)
              assert set(values)==ipids and all(q==0 for q in values.values())
          result=dict(complete=True,at=time.time(),migration=m.ROOT,old_zero=True,legacy_zero=True,destination=2393088,units=sum(allstocks[2393088].values()),positive_sizes=sum(q>0 for q in allstocks[2393088].values()),checked_china_sizes=len(ids),held_by_capacity=root['held_by_capacity'],ip_sizes=len(ipids),ip_cards=len(cards),ip_warehouses=ipwh,ip_nonzero=0,stock_writes=0)
          with support.runtime_db() as db:
              db.execute('INSERT INTO stock_runs VALUES(%s,%s,%s,%s,%s,%s) ON CONFLICT(id) DO UPDATE SET snapshot=excluded.snapshot',('technical:guangzhou-relocate-final-audit:2026-11-26',canonical(result),'{}',digest({}),'technical-no-executor',time.time()))
          print(json.dumps(result),flush=True)
          PY
