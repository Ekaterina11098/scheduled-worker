name: Apply owner approved two exclusions
on:
  push:
    paths: [.github/workflows/ip-two-exclusions-20261126.yml]
  workflow_dispatch:
permissions: {contents: read}
concurrency: {group: ip-two-exclusions-20261126, cancel-in-progress: false}
jobs:
  apply:
    if: github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /scripts/owner_ad_tests23.py
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install requests==2.32.5 > /dev/null 2>&1
      - shell: python
        env:
          PYTHONPATH: scripts
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          WB_TOKEN_2: ${{ secrets.WB_TOKEN_2 }}
        run: |
          import sys
          sys.path.insert(0,'scripts')
          """Single owner-authorized bid step, private scope, durable no-replay journal."""
          import copy,datetime,hashlib,json,math,os,time,requests
          from owner_ad_tests23 import State,ReadWB,stamp
          ROOT='ip_agent:png_two_exclusions:2026-11-26:v1'
          HOST='advert-api.wildberries.ru'
          class Run:
           def __init__(self):
            self.db=State();self.a=self.db.get(ROOT+':approval');self.wb=ReadWB(self.db,'token_2');self.s={'status':'preflight','wb_write_attempts':0,'telegram_sends':0,'started_at':stamp()};self.deadline=time.time()+5400
           def save(self):self.db.put(ROOT+':execution',self.s)
           def guard(self):
            if not self.a or self.a.get('status')!='approved' or self.a.get('cabinet')!='token_2' or self.a.get('operation')!='remove_two':raise PermissionError('Approval')
            if self.db.get(ROOT+':approval')!=self.a or datetime.datetime.now(datetime.timezone.utc)>=datetime.datetime.fromisoformat(self.a['expires_at']):raise PermissionError('Approval changed or expired')
           def call(self,path,method='GET',body=None,params=None,host=HOST):
            if (method,host,path)not in {('GET',HOST,'/api/advert/v2/adverts'),('PATCH',HOST,'/adv/v0/auction/nms')}:raise PermissionError('Endpoint')
            write=method=='PATCH'
            for attempt in range(3):
             self.guard();pk='wb-pause:'+hashlib.sha256((self.wb.token+host+path).encode()).hexdigest();until=float((self.db.get(pk)or{}).get('until',0))
             if until>self.deadline:raise RuntimeError('Cooldown exceeds authorization run')
             while until>time.time():
              self.s.update(status='waiting_provider',resume_after=datetime.datetime.fromtimestamp(until,datetime.timezone.utc).isoformat());self.save();time.sleep(min(25,max(.1,until-time.time())));self.guard()
             if write:
              if self.s.get('write',{}).get('status')in ('submitting','accepted','uncertain'):raise RuntimeError('No write replay')
              self.s.update(status='submitting',write={'status':'submitting','body':body,'at':stamp()});self.s['wb_write_attempts']+=1;self.save()
             try:r=requests.request(method,'https://'+host+path,headers={'Authorization':self.wb.token},params=params,json=body,timeout=(10,65),allow_redirects=False)
             except requests.RequestException:
              if write:self.s['write']['status']='uncertain';self.save()
              raise RuntimeError('Unknown request result; no replay')from None
             try:data=r.json()if r.content else{}
             except ValueError:data={'unparseable':True}
             raw=r.headers.get('X-Ratelimit-Retry')or r.headers.get('Retry-After')or r.headers.get('X-Ratelimit-Reset')
             try:delay=float(raw or 0)
             except ValueError:delay=0
             if delay>time.time()-86400:delay=max(0,delay-time.time())
             if r.status_code==429 or r.headers.get('X-Ratelimit-Remaining')=='0':self.db.put(pk,{'until':time.time()+max(3,delay)+5,'basis':'provider_header'})
             if r.status_code==429:
              self.s.setdefault('definite_429',[]).append({'path':path,'at':stamp(),'retry_after':delay})
              if write:self.s['write']['status']='rejected429'
              self.save();continue
             if not r.ok or isinstance(data,dict)and data.get('unparseable'):
              if write:self.s['write'].update(status='uncertain'if r.status_code>=500 or r.ok else'rejected',http=r.status_code,response=data);self.save()
              raise RuntimeError('API HTTP '+str(r.status_code))
             if write:self.s['write'].update(status='accepted',accepted_at=stamp(),response=data);self.save()
             return data
            raise RuntimeError('Bounded 429 retries exhausted')
           def configs(self):
            ids=self.a['read_campaign_ids'];rows=self.call('/api/advert/v2/adverts',params={'ids':','.join(map(str,ids))})['adverts']
            if {c['id']for c in rows}!=set(ids):raise ValueError('Campaign coverage')
            return {str(c['id']):c for c in rows}
           def execute(self):
            self.guard();self.wb.identity();before=self.configs();self.s.update(before=before,configuration_observed_at=stamp());self.save()
            cid=self.a['campaign'];c=before[str(cid)];wanted=self.a['items']
            if len(wanted)!=2 or len({x['nm']for x in wanted})!=2:raise ValueError('Exact two-item scope')
            if c['currency']!='RUB'or c['status']!=9 or c['settings']['payment_type']!='cpc'or c['settings']['placements']!={'search':True,'recommendations':False}:raise ValueError('Campaign placement or status changed')
            present={n['nm_id']for n in c['nm_settings']};removing=sorted(present&{x['nm']for x in wanted})
            if removing and (not c.get('restrictions',{}).get('can_change_nms')or len(present)<=len(removing)):raise ValueError('Membership locked or would empty campaign')
            self.s['already_absent']=sorted({x['nm']for x in wanted}-present);self.s['changes']=[dict(x,campaign=cid,kind='remove')for x in wanted if x['nm']in removing]
            expected=copy.deepcopy(before);expected[str(cid)]['nm_settings']=[n for n in expected[str(cid)]['nm_settings']if n['nm_id']not in removing];self.s['expected']=expected;self.save()
            if removing:
             self.call('/adv/v0/auction/nms','PATCH',{'nms':[{'advert_id':cid,'nms':{'add':[],'delete':removing}}]})
             time.sleep(6);after=self.configs()
            else:after=before
            self.s.update(after=after,readback_at=stamp())
            if self.project(after)!=self.project(expected):raise ValueError('Final full-scope readback differs from expected')
            self.s.update(status='verified_all',verified_count=2,other_settings_unchanged=True);self.save()
           def project(self,cs):
            return {cid:{'id':c['id'],'status':c['status'],'currency':c['currency'],'bid_type':c['bid_type'],'settings':c['settings'],'members':{str(n['nm_id']):n['bids_kopecks']for n in c['nm_settings']}}for cid,c in cs.items()}
           def run(self):
            if self.db.get(ROOT+':execution'):raise RuntimeError('Existing execution: read instead of replay')
            if not self.db.put(ROOT+':execution',self.s,once=True):raise RuntimeError('Already claimed')
            try:self.execute()
            except Exception as e:self.s.update(status='attention',error=str(e)if isinstance(e,(ValueError,RuntimeError,PermissionError))else type(e).__name__);self.save()
            self.s['finished_at']=stamp();self.save();print(json.dumps({k:self.s.get(k)for k in ('status','verified_count','wb_write_attempts','error')}))
          if __name__=='__main__':Run().run()
