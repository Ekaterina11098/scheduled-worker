name: Verify Stella472 addition read only 20261116
on:
  push:
    branches: ['review/china-bag-groups-20261116']
    paths: ['.github/workflows/china-stella472-verify-only-20261116.yml']
permissions: {}
jobs:
  read:
    if: github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install --quiet requests==2.32.5 cryptography
      - name: Verify expected complete memberships without any WB writes
        shell: python
        env:
          WB_TOKEN_3: ${{ secrets.WB_TOKEN_3 }}
        run: |
          import os,json,time,requests,hashlib,gzip,base64,secrets,traceback
          from datetime import datetime,timezone
          from cryptography.hazmat.primitives import serialization,hashes
          from cryptography.hazmat.primitives.asymmetric import padding
          from cryptography.hazmat.primitives.ciphers.aead import AESGCM
          META=json.loads("{\"membershipHash\":\"58fbe7b9f7182c981571991fe4eba6bb5c3518846cdca1cb4c796d5beced0694\",\"contentHash\":\"960c978d187e574e0f83ae60374a0ca6246246a97e2b80dbd27f45a46aaf9a8f\",\"expectedCount\":340,\"beforeGroupSize\":27,\"expectedGroupSize\":28,\"beforeIMT\":4377856663}")
          PUBLIC_KEY="-----BEGIN PUBLIC KEY-----\nMIIBojANBgkqhkiG9w0BAQEFAAOCAY8AMIIBigKCAYEAqZNUrOvZ4UeO29b+p61F\niH/TYX0CFHtnqndnmHR4leDh/pqkTFqC+EryTPqjLJBylfgeqPqc0Bywo7WeHNxe\nvbOmih5rb9wRTYgJRBx7ruUJaWiJLP0yp2KwLMf8Vc0tRxRBIfXV/CHQjVIIc0rY\nOEW8+gwrAgsqFgs0944OpliDwm0aI9UX+j4gCTCmktk5swzFuqyxcDUH7fOUDKe1\nOOSqDB/lODw3333K6mjuHxRcDUD69EdTOS+hJb+ZqQOCT9JGtE2b6H9+Uf6B9cYs\nKu7JDPUD/5ETgxz3Oa3YgM7XPWwamcn5MYq8HMJ2e4F2B1x/mxSpUk6RFDR8hW/W\nFpqmg+JxpZpKwuSgBhegRpWwJ1+gS0z0h31a58XweTDtA8nd7WJjhiegbmSwItLM\npC3FVE8HzAeP6h8C+7l2r/Vl81y59CE+VHvgSmUobNRmHdY+laFAU2v8PfuebV5C\nDku+Uuz+AjUYKOtflqUc8HQQHGldtkkXG1iafKKIpZyTAgMBAAE=\n-----END PUBLIC KEY-----\n"
          NM=1473242770;TARGET=4014564758
          R={'status':'started','verified':False,'wbWrites':0,'requests':[],'article':'472-StellaBag-beige','nmID':NM,'targetIMT':TARGET,'targetGroup':'Связка 8','beforeCount':META['expectedCount'],'beforeGroupSize':META['beforeGroupSize'],'beforeIMT':META['beforeIMT'],'writeRun':43865210394}
          def now():return datetime.now(timezone.utc).isoformat()
          def h(v):return hashlib.sha256(json.dumps(v,sort_keys=True,ensure_ascii=False,separators=(',',':')).encode()).hexdigest()
          def protected(c):
              fields=('nmID','nmUUID','subjectID','vendorCode','brand','title','description','sizes','photos','video','characteristics','dimensions','kizMarked','needKiz')
              out={k:c.get(k) for k in fields}
              out['characteristics']=sorted(out.get('characteristics') or [],key=lambda x:x.get('id',0));out['sizes']=sorted(out.get('sizes') or [],key=lambda x:x.get('chrtID',0))
              if isinstance(out.get('dimensions'),dict):out['dimensions']={k:v for k,v in out['dimensions'].items() if k!='isValid'}
              return out
          def page(body):
              for attempt in range(4):
                  time.sleep(.9)
                  r=requests.post('https://content-api.wildberries.cn/content/v2/get/cards/list',headers={'Authorization':os.environ['WB_TOKEN_3']},json=body,timeout=60)
                  if r.status_code==429:
                      wait=int(float(r.headers.get('X-Ratelimit-Retry') or r.headers.get('Retry-After') or 65))+2;assert wait<=180
                      time.sleep(wait);continue
                  if not r.ok:raise RuntimeError('Read HTTP '+str(r.status_code))
                  d=r.json()
                  if not isinstance(d.get('cards'),list):d=d.get('data',{})
                  assert isinstance(d.get('cards'),list) and isinstance(d.get('cursor'),dict)
                  return d
              raise RuntimeError('Read retries exhausted')
          try:
              for attempt in range(6):
                  raw=[];cursor={'limit':100};seen=set()
                  for p in range(50):
                      d=page({'settings':{'sort':{'ascending':True},'cursor':cursor,'filter':{'withPhoto':-1}}});raw.extend(d['cards'])
                      if len(d['cards'])<100:break
                      mark=(d['cursor'].get('updatedAt'),d['cursor'].get('nmID'));assert all(mark) and mark not in seen
                      seen.add(mark);cursor={'limit':100,'updatedAt':mark[0],'nmID':mark[1]}
                  else:raise RuntimeError('Pagination limit')
                  unique={}
                  for c in raw:
                      old=unique.get(c['nmID'])
                      if old is None or (c.get('updatedAt') or '')>=(old.get('updatedAt') or ''):unique[c['nmID']]=c
                  membership=sorted([[c['nmID'],c['imtID'],c['vendorCode'].lower()] for c in unique.values()],key=lambda v:v[0])
                  R['observedUnique']=len(unique);R['duplicateRows']=len(raw)-len(unique);R['observedMembershipHash']=h(membership)
                  if len(unique)==META['expectedCount'] and h(membership)==META['membershipHash']:
                      cards=list(unique.values());break
                  time.sleep(10)
              else:raise RuntimeError('Full expected membership not confirmed')
              c=unique[NM];assert c['imtID']==TARGET and c['vendorCode'].lower()=='472-stellabag-beige'
              group=[x for x in cards if x['imtID']==TARGET];assert len(group)==META['expectedGroupSize'] and len(group)<=30
              content_equal=h(protected(c))==META['contentHash']
              R.update(after=c,membershipAfter=[{k:x.get(k) for k in ('nmID','vendorCode','imtID','subjectID','subjectName')} for x in cards],afterCount=len(cards),afterGroupSize=len(group),contentEqual=content_equal,onlyOneCardMoved=True,fullExpectedMembershipMatched=True)
              assert content_equal,'Protected content hash differs'
              R.update(status='verified',verified=True)
              print('STELLA_READ_ONLY_VERIFICATION_PASSED',flush=True)
          except Exception as exc:R.update(status='incomplete',error={'type':type(exc).__name__,'message':str(exc),'trace':traceback.format_exc()})
          R['finishedAt']=now();R['verificationRun']=os.environ.get('GITHUB_RUN_ID')
          pub=serialization.load_pem_public_key(PUBLIC_KEY.encode());key=secrets.token_bytes(32);nonce=secrets.token_bytes(12);b=lambda v:base64.b64encode(v).decode()
          env={'key':b(pub.encrypt(key,padding.OAEP(mgf=padding.MGF1(hashes.SHA256()),algorithm=hashes.SHA256(),label=None))),'nonce':b(nonce),'ciphertext':b(AESGCM(key).encrypt(nonce,gzip.compress(json.dumps(R,ensure_ascii=False).encode()),None))}
          encoded=b(json.dumps(env).encode())
          for i in range(0,len(encoded),18000):print('STELLA_RESULT '+str(i//18000)+' '+encoded[i:i+18000],flush=True)
          
