name: Finish exact owner approvals359 and360
on:
  push:
    branches: [main]
    paths: ['.github/workflows/owner-confirmed21-finish.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: china-owner-confirmed21-finish
  cancel-in-progress: false
jobs:
  prepare:
    if: github.run_attempt == 1
    concurrency:
      group: china-dialog-data
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /scripts/
            /.github/
            /*request*.json
      - uses: actions/checkout@v4
        with:
          repository: Ekaterina11098/VESCHI_AI
          ref: a7efd98c6ef7e54f415471abcb694c748c2b4f6d
          token: ${{ secrets.SOURCE_READ_TOKEN }}
          path: source
          persist-credentials: false
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /analytics/
            /business_agents/
            /advertising_agent/
            /china_agent/
            /tests/
            /*.py
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install requests==2.32.5 pillow==11.3.0 python-dotenv simplejson==4.2.0 openai==3.42.1
      - name: Prepare and freeze the existing daily identity without Telegram calls
        env:
          CHINA_AD_PREPARE_ONLY: 'true'
          OPENAI_API_KEY: "" # Owner: no paid model API
          MPSTATS_API_TOKEN: ${{ secrets.MPSTATS_API_TOKEN }}
          MOYSKLAD_API_TOKEN: ${{ secrets.MOYSKLAD_API_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          WB_TOKEN_3: ${{ secrets.WB_TOKEN_3 }}
          CHINA_TELEGRAM_BOT_TOKEN: ${{ secrets.CHINA_TELEGRAM_BOT_TOKEN }}
        run: |
          python scripts/install_china_dialog.py
          PYTHONPATH=scripts:source python scripts/conversion_watches.py --exact-dialog-job 359
          PYTHONPATH=scripts:source python scripts/china_loss_execute.py --job-id 359
          PYTHONPATH=scripts:source python -c "from china_advertising_state import AdvertisingIO; i=AdvertisingIO(); a=i.get('china_agent:loss_plan_approval:v1:359')or{}; e=i.get('china_agent:daily_ad_execution:v2:'+a.get('plan_id',''))or{}; assert len(e.get('items',[]))==25 and all(s.get('status')=='verified'for s in e['items']), 'Ads incomplete; budget step deferred'"
          PYTHONPATH=scripts:source python scripts/conversion_watches.py --exact-dialog-job 360
          PYTHONPATH=scripts:source python scripts/china_loss_execute.py --job-id 360
# Resume saved read-only checkpoints after JSON normalization.
# Complete read adapter audit v2.
