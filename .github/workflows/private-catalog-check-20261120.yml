name: Private catalog read check
on:
  push:
    branches: [private-catalog-check-20261120]
    paths: [.github/workflows/private-catalog-check-20261120.yml]
permissions:
  contents: read
concurrency:
  group: private-catalog-check-20261120
  cancel-in-progress: false
jobs:
  read:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          repository: Ekaterina11098/VESCHI_AI
          ref: 0192e4d2c786269f288cbe1cecb6941325da320f
          token: ${{ secrets.SOURCE_READ_TOKEN }}
          persist-credentials: false
          path: private-source
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests pillow numpy
      - name: Read catalog and deliver report to private storage
        working-directory: private-source
        env:
          WB_TOKEN_1: ${{ secrets.WB_TOKEN_1 }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: |
          python -u maya_ooo_private_runner.py > /dev/null 2>&1
