name: Diagnose and safely resume rejected WB 320214719 demand
on:
  push:
    branches: [main]
    paths: ['.github/workflows/diagnose-wb-320214719-demand.yml']
permissions:
  contents: read
concurrency:
  group: fbs-document-chain-production
  cancel-in-progress: false
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify partial chain then capture sanitized MS rejection detail if still blocked
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          MOYSKLAD_API_TOKEN: ${{ secrets.MOYSKLAD_API_TOKEN }}
          WB_TOKEN_3: ${{ secrets.WB_TOKEN_3 }}
          FBS_EXECUTION_KIND: manual
          FBS_OWNER_APPROVAL_ID: china-320214719-demand-diagnostic
        run: python scripts/diagnose_wb_320214719_demand.py
