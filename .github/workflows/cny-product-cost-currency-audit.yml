name: Read-only product cost currency audit
on:
  push:
    branches: [main]
    paths: ['.github/workflows/cny-product-cost-currency-audit.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: scripts
      - name: Read product prices and stock valuation evidence
        env:
          MOYSKLAD_API_TOKEN: ${{ secrets.MOYSKLAD_API_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: python scripts/cny_product_cost_currency_audit.py
