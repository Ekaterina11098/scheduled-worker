name: Check WB umbrella 123
on:
  push:
    branches: [ops/wb-check-zont-123-20261123]
    paths: [.github/workflows/wb-check-zont-123-20261123.yml]
permissions: {}
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - shell: python
        env:
          CHINA: ${{ secrets.WB_TOKEN_3 }}
        run: |
          import os, json, urllib.request, urllib.error
          from collections import Counter
          from concurrent.futures import ThreadPoolExecutor
          nm = 1556488210
          token = os.environ['CHINA']
          def call(label, url, body=None, auth=True):
              try:
                  headers = {'Content-Type':'application/json'}
                  if auth: headers['Authorization'] = token
                  req = urllib.request.Request(url, json.dumps(body).encode() if body is not None else None, headers)
                  with urllib.request.urlopen(req, timeout=14) as f: return json.load(f)
              except Exception as e:
                  print(label, 'unavailable', getattr(e,'code',type(e).__name__))
                  return {}
          def reviews(answered):
              obj=call('feedbacks '+answered,'https://feedbacks-api.wildberries.ru/api/v1/feedbacks?isAnswered='+answered+'&take=100&skip=0&nmId='+str(nm))
              d=obj.get('data') or {}
              print('feedback_count',answered,d.get('countArchive'),d.get('countUnanswered'))
              return d.get('feedbacks') or []
          with ThreadPoolExecutor() as pool:
              a=pool.submit(reviews,'true')
              b=pool.submit(reviews,'false')
              q=pool.submit(call,'card','https://content-api.wildberries.ru/content/v2/get/cards/list',{'settings':{'cursor':{'limit':10},'filter':{'textSearch':str(nm),'withPhoto':-1}}})
              p=pool.submit(call,'storefront','https://www.wildberries.ru/__internal/u-card/cards/v4/detail?appType=1&curr=rub&dest=-1257786&spp=30&nm='+str(nm),None,False)
              rr={x['id']:x for x in a.result()+b.result() if x.get('productDetails',{}).get('nmId')==nm}
              cards=q.result().get('cards') or []
              public=p.result()
          for c in cards:
              if c.get('nmID')==nm: print('seller_card',nm,c.get('vendorCode'))
          print('reviews',dict(Counter(x.get('productValuation') for x in rr.values())))
          print('photo_reviews',dict(Counter(x.get('productValuation') for x in rr.values() if x.get('photoLinks'))))
          print('video_reviews',dict(Counter(x.get('productValuation') for x in rr.values() if x.get('video'))))
          for x in rr.values():
              if x.get('productValuation',5)<5:
                  s=' '.join(str(x.get(k) or '') for k in ['text','pros','cons']).lower()
                  categories=[name for name,terms in {'цвет':['цвет','розов'],'механизм':['механизм','откры','закры','кнопк'],'поломка':['слома','брак','спиц','слом'],'размер':['размер','маленьк','больш'],'упаковка':['упаков','короб'],'качество':['качеств','хлипк','тонк']}.items() if any(t in s for t in terms)]
                  print('low_review',x.get('productValuation'),'photo',bool(x.get('photoLinks')),'text',bool(s.strip()),'topics',categories)
          for c in public.get('products',public.get('data',{}).get('products',[])):
              if c.get('id')==nm: print('storefront', {k:c.get(k) for k in ['nmReviewRating','nmFeedbacks','reviewRating','feedbacks','totalQuantity']})
