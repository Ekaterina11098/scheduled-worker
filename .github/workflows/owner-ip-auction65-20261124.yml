name: Owner IP bounded auction reads
on:
  push:
    branches: [main]
    paths: ['.github/workflows/owner-ip-auction65-20261124.yml']
permissions: {contents: read}
concurrency: {group: owner-ip-auction65, cancel-in-progress: false}
jobs:
  read:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install requests==2.32.5 > /dev/null 2>&1
      - shell: python
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          WB_TOKEN_2: ${{ secrets.WB_TOKEN_2 }}
        run: |
          import os,json,time,datetime,requests
          ROOT='ip_agent:economics65:2026-11-24'
          base=os.environ['SUPABASE_URL'].rstrip('/')+'/rest/v1/'
          h={'apikey':os.environ['SUPABASE_SECRET_KEY'],'Authorization':'Bearer '+os.environ['SUPABASE_SECRET_KEY']}
          def get(k):
           r=requests.get(base+'telegram_api_cache',headers=h,params={'cache_key':'eq.'+k,'select':'payload'},timeout=60);r.raise_for_status();a=r.json();return a[0]['payload']if a else None
          def save(k,v):
           r=requests.post(base+'telegram_api_cache',headers=dict(h,Prefer='resolution=merge-duplicates'),params={'on_conflict':'cache_key'},json={'cache_key':k,'payload':v,'updated_at':datetime.datetime.now(datetime.timezone.utc).isoformat(),'expires_at':'2027-11-24T00:00:00Z'},timeout=60);r.raise_for_status()
          def wb(label,path,method='GET',params=None,body=None):
           old=get(ROOT+':wb:'+label)
           if old:return old
           assert (method,path)in {('GET','/api/advert/v2/adverts'),('GET','/api/advert/v0/bids/recommendations'),('POST','/api/advert/v1/bids/min'),('POST','/api/advert/v2/budget')}
           r=requests.request(method,'https://advert-api.wildberries.ru'+path,headers={'Authorization':os.environ['WB_TOKEN_2'].strip()},params=params,json=body,timeout=60,allow_redirects=False)
           try:d=r.json()
           except ValueError:d={'text':r.text[:1200]}
           v={'http':r.status_code,'observed_at':datetime.datetime.now(datetime.timezone.utc).isoformat(),'data':d,'retry_after':r.headers.get('X-Ratelimit-Retry')or r.headers.get('Retry-After')}
           save(ROOT+':wb:'+label,v)
           if r.status_code==429:raise RuntimeError('Read rate limited; no blind retries')
           return v
          scope=get(ROOT+':scope');assert scope['wb_writes']==False
          ps=get(ROOT+':products')['data']['data']['data']
          names={n.casefold()for n in scope['skus']}
          nms={int(p['nm_id']):p for p in ps if p['sa_name'].casefold()in names and p['stock_api_stock_count']>0}
          adverts=get(ROOT+':wb:adverts')['data']['adverts']
          live=[a for a in adverts if a['status']in [9,11]and a.get('settings',{}).get('payment_type')=='cpc']
          pairs={}
          for a in live:
           for n in a.get('nm_settings',[]):
            nm=int(n['nm_id'])
            if nm in nms and(nm not in pairs or a['status']==9):pairs[nm]=a['id']
          eligible={}
          for mid in [11736035,11779755,11861069,12102131,12103480,12107512,12382585,12469410]:
           d=get(ROOT+':ad_'+str(mid))
           if not d:continue
           for x in d['data']['data']:
            nm=int(x['nm_id'])
            if nm in pairs:
             t=eligible.setdefault(nm,{'orders':0,'revenue':0,'clicks':0})
             for k,v in [('orders','ac_orders'),('revenue','ac_orders_sum'),('clicks','ac_clicks')]:t[k]+=x[v]
          ready=[nm for nm,x in eligible.items()if x['orders']>=2 and x['clicks']>0 and .05*x['revenue']/x['clicks']>=2.95]
          state={'status':'running','wb_writes':0,'recommendations':[],'selection':'only 2+ observed direct orders and CPC5 above floor; no inferred market bid for others'}
          save(ROOT+':wb:recovery_status',state)
          try:
           for i,nm in enumerate(ready):
            if i:time.sleep(185)
            cid=pairs[nm]
            v=wb('competitive_'+str(cid)+'_'+str(nm),'/api/advert/v0/bids/recommendations',params={'advertId':cid,'nmId':nm})
            state['recommendations'].append({'nm':nm,'cid':cid,'http':v['http']});save(ROOT+':wb:recovery_status',state)
           state['status']='complete';save(ROOT+':wb:recovery_status',state)
          except Exception as e:
           state.update(status='error',error=type(e).__name__);save(ROOT+':wb:recovery_status',state);raise SystemExit(1)
          print('Bounded competitive reads stored.')
          