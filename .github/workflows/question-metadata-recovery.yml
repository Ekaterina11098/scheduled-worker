name: Validate question metadata fix and resume China question collection
on:
  push:
    paths:
      - '.github/workflows/question-metadata-recovery.yml'
permissions:
  contents: read
concurrency:
  group: question-metadata-recovery
  cancel-in-progress: true
jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*.py
            /review-approval-preparation/
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Verify metadata changes and immutable question content
        run: |
          python -m unittest -v test_question_snapshot_metadata.py test_review_morning.py test_review_questions.py
          python -m py_compile review_morning.py
      - uses: actions/checkout@v4
        with:
          repository: Ekaterina11098/VESCHI_AI
          ref: d584a0cf857ccc1fcac1e23ce73d75be970476fc
          token: ${{ secrets.SOURCE_READ_TOKEN }}
          path: private-source
          persist-credentials: false
          filter: blob:none
          sparse-checkout: |
            /*.py
            /*.md
            /tests/
          sparse-checkout-cone-mode: false
      - run: pip install 'psycopg[binary]==3.2.10' cryptography==46.0.2 requests==2.32.5 python-dotenv==1.1.1 openai==1.109.1
      - name: Resume China questions through original duplicate protection
        env:
          PYTHONPATH: ${{ github.workspace }}/private-source
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ALLOWED_CHAT_ID: ${{ secrets.TELEGRAM_ALLOWED_CHAT_ID }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          WB_TOKEN_3: ${{ secrets.WB_TOKEN_3 }}
        run: |
          python - <<'PY'
          import io,contextlib,time,json
          from review_morning import main
          from stock_deploy_support import seal,error
          private_log=io.StringIO()
          def clear_obsolete_backoff():
              import os,sys,hmac,hashlib,psycopg
              sys.path.insert(0,'review-approval-preparation')
              from review_telegram_approval import Repository,sha
              from review_approval_bridge import SQLSource
              from review_morning import persist_source_snapshot
              root=os.environ['SUPABASE_SECRET_KEY'].encode()
              pw=hmac.new(root,b'veschi:review-approval-login:20261015:v1',hashlib.sha256).hexdigest()
              with psycopg.connect(host='aws-0-eu-central-1.pooler.supabase.com',port=5432,dbname='postgres',user='review_approval_login_20261015.abxgjoqlddhtcmjcjwxw',password=pw,sslmode='require',autocommit=True,connect_timeout=15) as conn:
                  deadline=time.monotonic()+13*60
                  while not conn.execute("SELECT pg_try_advisory_lock(hashtextextended('reviews-morning-delivery',0))").fetchone()[0]:
                      if time.monotonic()>deadline:raise RuntimeError('Collection busy')
                      time.sleep(10)
                  try:
                      repo=Repository(conn,postgres=True);source=SQLSource(conn)
                      control='questions-china-two-hour:2026-11-20'
                      state=repo.get('events',control)
                      for item in state['scopes']['token_3']['items']:
                          candidate=state['items'].get('token_3:'+str(item['id']),{})
                          trace=(candidate.get('last_error') or {}).get('trace','')
                          if candidate.get('status')!='generate' or 'Observed review differs from immutable source snapshot' not in trace:continue
                          version=candidate['version']
                          key='reviews:source:'+sha(['token_3','questions',str(item['id']),version])
                          payload=dict(cabinet='token_3',kind='questions',item_id=str(item['id']),version=version,item=item,source_sha256=sha(item),observed_at=state['scopes']['token_3']['observed_at'])
                          persist_source_snapshot(source,key,payload,reuse_identical=True)
                          candidate.pop('retry_at',None)
                      with repo.transaction():repo.put('events',control,state)
                  finally:conn.execute("SELECT pg_advisory_unlock(hashtextextended('reviews-morning-delivery',0))")
          try:
              clear_obsolete_backoff()
              deadline=time.monotonic()+19*60
              while time.monotonic()<deadline:
                  with contextlib.redirect_stdout(private_log),contextlib.redirect_stderr(private_log):
                      result=main(kind='questions',china_two_hour=True)
                  if result.get('status')!='busy':break
                  time.sleep(30)
              else:raise RuntimeError('Collection lock remained busy')
              print(json.dumps(result))
          except Exception as exc:
              seal('question-metadata-recovery-error',dict(error=error(exc),private_log=private_log.getvalue()))
              print('Recovery failed; protected diagnostics saved.')
              raise SystemExit(1)
          PY
