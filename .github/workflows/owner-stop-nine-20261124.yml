name: Stop owner nine-article stock run
on:
  push:
    paths: ['.github/workflows/owner-stop-nine-20261124.yml']
permissions:
  actions: write
  contents: read
jobs:
  stop:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Cancel only owner-approved stock run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail-with-body --silent --show-error -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" https://api.github.com/repos/Ekaterina11098/scheduled-worker/actions/runs/45357099039/cancel
