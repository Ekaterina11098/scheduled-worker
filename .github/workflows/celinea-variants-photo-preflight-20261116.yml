name: Celinea363364365 photo preflight16Nov
on:
  push:
    branches: [main]
    paths: ['.github/workflows/celinea-variants-photo-preflight-20261116.yml']
permissions: {}
jobs:
  read:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install --quiet requests==2.32.5
      - env:
          WB_TOKEN_3: ${{ secrets.WB_TOKEN_3 }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        shell: python
        run: |
          import os,requests,time,datetime
          targets=['363-CelineaBag-darkred','364-CelineaBag-coffee','365-CelineaBag-green'];found={};cur={'limit':100}
          for page in range(40):
           r=requests.post('https://content-api.wildberries.cn/content/v2/get/cards/list',headers={'Authorization':os.environ['WB_TOKEN_3']},json={'settings':{'cursor':cur,'filter':{'withPhoto':-1}}},timeout=45);r.raise_for_status();j=r.json()
           for c in j.get('cards',[]):
            if c.get('vendorCode') in targets:found[c['vendorCode']]=c
           if len(found)==3:break
           cu=j.get('cursor',{})
           if cu.get('total',0)<100:break
           cur={'limit':100,'updatedAt':cu['updatedAt'],'nmID':cu['nmID']};time.sleep(.7)
          assert len(found)==3
          sb=os.environ['SUPABASE_URL'].rstrip('/');sk=os.environ['SUPABASE_SECRET_KEY'];sh={'apikey':sk,'Authorization':'Bearer '+sk,'Content-Type':'application/json','Prefer':'resolution=merge-duplicates,return=minimal'}
          out={'status':'read','cards':found,'wb_writes':0}
          r=requests.post(sb+'/rest/v1/telegram_api_cache?on_conflict=cache_key',headers=sh,json={'cache_key':'celinea_variants_media:20261116:preflight:v1','payload':out,'updated_at':datetime.datetime.now(datetime.timezone.utc).isoformat(),'expires_at':'2099-01-01T00:00:00Z'},timeout=45);r.raise_for_status()
          print('Three exact cards read privately; no WB writes')
