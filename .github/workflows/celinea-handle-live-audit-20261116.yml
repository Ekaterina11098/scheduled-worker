name: Celinea handle live gallery audit read-only
on:
  push:
    branches: [main]
    paths: ['.github/workflows/celinea-handle-live-audit-20261116.yml']
permissions: {}
concurrency:
  group: celinea362-media
  cancel-in-progress: false
jobs:
  upload:
    if: github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install --quiet requests==2.32.5 pillow==11.3.0
      - name: Upload exact approved order and verify content
        env:
          WB_TOKEN_3: ${{ secrets.WB_TOKEN_3 }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        shell: python
        run: |
          import os,json,time,base64,hashlib,io
          from datetime import datetime,timezone
          from urllib.parse import quote
          import requests
          from PIL import Image,ImageChops,ImageStat
          sb=os.environ['SUPABASE_URL'].rstrip('/')
          sk=os.environ['SUPABASE_SECRET_KEY']
          sh={'apikey':sk,'Authorization':'Bearer '+sk,'Content-Type':'application/json'}
          wh={'Authorization':os.environ['WB_TOKEN_3']}
          host='https://content-api.wildberries.cn'
          nm=2245828239;article='362-CelineaBag-black'
          key='celinea_handle_live_audit:20261116:v1'
          def stamp():return datetime.now(timezone.utc).isoformat()
          def cache(k):
           r=requests.get(sb+'/rest/v1/telegram_api_cache',headers=sh,params={'cache_key':'eq.'+k,'select':'payload'},timeout=40);r.raise_for_status()
           rows=r.json();return rows[0]['payload'] if rows else None
          def put(e):
           r=requests.post(sb+'/rest/v1/telegram_api_cache?on_conflict=cache_key',headers={**sh,'Prefer':'resolution=merge-duplicates,return=minimal'},json={'cache_key':key,'payload':e,'updated_at':stamp(),'expires_at':'2099-01-01T00:00:00Z'},timeout=40);r.raise_for_status()
          if cache(key):raise SystemExit('Execution exists; no replay')
          def card():
           cur={'limit':100}
           for page in range(40):
            r=requests.post(host+'/content/v2/get/cards/list',headers=wh,json={'settings':{'cursor':cur,'filter':{'withPhoto':-1}}},timeout=45);r.raise_for_status();j=r.json()
            cs=[c for c in j.get('cards',[]) if c.get('vendorCode')==article]
            if cs:
             assert len(cs)==1 and cs[0]['nmID']==nm,'Identity mismatch'
             return cs[0]
            cu=j.get('cursor',{})
            if cu.get('total',0)<100:break
            cur={'limit':100,'updatedAt':cu['updatedAt'],'nmID':cu['nmID']};time.sleep(0.7)
           raise RuntimeError('Exact card missing from full pagination')
          def core(c):
           d={k:v for k,v in c.items() if k not in ('photos','video','updatedAt')}
           d['characteristics']=sorted(d.get('characteristics',[]),key=lambda x:str(x['id']))
           return d
          rows=[]
          for number,identity,article_name in [(362,2245828239,'362-CelineaBag-black'),(363,2245828341,'363-CelineaBag-darkred'),(364,2245828148,'364-CelineaBag-coffee'),(365,2245828173,'365-CelineaBag-green')]:
           nm=identity;article=article_name;current=card()
           oldkey='celinea_care_corrected:362:20261116:final:v3:execution' if number==362 else 'celinea_variants_media:'+str(number)+':20261116:v1:execution'
           prior=cache(oldkey)
           refs=[];live=[]
           for n in range(1,9):
            prefix='celinea_media:362:20261116:owner_shape_v2:' if number==362 else 'celinea_variants_media:'+str(number)+':20261116:v1:'
            pk='celinea_care_corrected:'+str(number)+':20261116:v1:07' if n==7 else prefix+str(n).zfill(2)
            p=cache(pk);refs.append(Image.open(io.BytesIO(base64.b64decode(p['data']))).convert('RGB').resize((96,128)))
           for photo in current.get('photos',[]):
            r=requests.get(photo['big'],params={'verify':str(int(time.time()))},timeout=40);r.raise_for_status()
            live.append(Image.open(io.BytesIO(r.content)).convert('RGB'))
           matrix=[[round(sum(ImageStat.Stat(ImageChops.difference(im.resize((96,128)),ref)).mean)/3,3) for ref in refs] for im in live]
           row={'article':article,'nm_id':nm,'current':current,'core_matches_prior':core(current)==core(prior['after']),'matrix':matrix,'order':[v.index(min(v))+1 for v in matrix]}
           if len(live)>=7:
            preview=live[6].resize((543,724));b=io.BytesIO();preview.save(b,format='PNG')
            row['slide7_preview_png']=base64.b64encode(b.getvalue()).decode()
           rows.append(row)
          put({'status':'read','wb_writes':0,'observed_at':stamp(),'rows':rows})
          print('Read-only gallery audit saved privately')
